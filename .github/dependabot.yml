version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /server
      - /packages/cache
      - /packages/mail
      - /packages/vfs
      - /build/tools
    schedule:
      interval: weekly
      day: monday
    groups:
      go-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  # gopls depends on matching x/tools internals. Upgrade its graph through
  # gopls itself; independent transitive upgrades can break the pinned tool.
  - package-ecosystem: gomod
    directory: /build/tools/gopls
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-name: golang.org/x/tools/gopls
        dependency-type: all

  - package-ecosystem: npm
    directories:
      - /webapp
      - /docs/site
    schedule:
      interval: weekly
      day: monday
    # The webapp generator and docs compiler API still require TypeScript 5.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      javascript-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /build/docker
    schedule:
      interval: weekly
      day: monday
