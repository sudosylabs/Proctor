name: Vulnerability scan

on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/*.go'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/security.yml'
      - 'webapp/package.json'
      - 'webapp/package-lock.json'
      - 'webapp/.nvmrc'
      - 'docs/site/package.json'
      - 'docs/site/package-lock.json'
      - 'build/ci/npm-audit.mjs'
      - '.github/actions/setup/**'
      - '.golangci.yml'
      - 'build/make/config.mk'
      - 'build/make/tools.mk'
      - 'build/scripts/go-quality'
  push:
    branches: [main]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/*.go'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/security.yml'
      - 'webapp/package.json'
      - 'webapp/package-lock.json'
      - 'webapp/.nvmrc'
      - 'docs/site/package.json'
      - 'docs/site/package-lock.json'
      - 'build/ci/npm-audit.mjs'
      - '.github/actions/setup/**'
      - '.golangci.yml'
      - 'build/make/config.mk'
      - 'build/make/tools.mk'
      - 'build/scripts/go-quality'
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: proctor-vulnerability-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GOFLAGS: -buildvcs=false -mod=readonly
  GOPRIVATE: github.com/sudosylabs/proctor

jobs:
  govulncheck:
    name: Current Go vulnerability database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Scan reachable Go vulnerabilities
        run: make vulncheck

  webapp-audit:
    name: Webapp production npm advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webapp/.nvmrc
      # The audit reads the lockfile; nothing is installed or executed. High
      # and critical advisories fail, matching the dependency review.
      - name: Audit the shipped webapp dependency tree
        working-directory: webapp
        run: npm audit --omit=dev --audit-level=high

  docs-audit:
    name: Documentation toolchain npm advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webapp/.nvmrc
      # Like the webapp audit this reads only the lockfile and fails on high
      # or critical advisories, except the ones docs/site/README.md accepts
      # because no compatible fix exists. A failed or malformed audit fails.
      - name: Audit the documentation build dependency tree
        working-directory: docs/site
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/docs-audit.json" || true
          node ../../build/ci/npm-audit.mjs "$RUNNER_TEMP/docs-audit.json" GHSA-vfj7-8cjw-p6xm GHSA-qxc2-j82w-r537
