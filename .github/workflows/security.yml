name: Go vulnerability scan

on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/*.go'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/security.yml'
      - '.github/actions/setup/**'
      - '.golangci.yml'
      - 'build/make/config.mk'
      - 'build/make/tools.mk'
      - 'build/scripts/go-quality'
  push:
    branches: [main]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - '**/*.go'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/security.yml'
      - '.github/actions/setup/**'
      - '.golangci.yml'
      - 'build/make/config.mk'
      - 'build/make/tools.mk'
      - 'build/scripts/go-quality'
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: proctor-vulnerability-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GOFLAGS: -buildvcs=false -mod=readonly
  GOPRIVATE: github.com/sudosylabs/proctor

jobs:
  govulncheck:
    name: Current Go vulnerability database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Scan reachable Go vulnerabilities
        run: make vulncheck
