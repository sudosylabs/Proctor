name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: proctor-dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: New dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only dependencies a pull request adds or changes are judged. Build
      # tooling counts: a compromised development dependency still shapes
      # what is built and published.
      - name: Fail on high or critical advisories in changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
