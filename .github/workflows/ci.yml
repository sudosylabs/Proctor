name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proctor-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false -mod=readonly
  GOPRIVATE: github.com/sudosylabs/proctor

jobs:
  quality:
    name: Formatting and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            packages/cache/go.sum
            packages/mail/go.sum
            packages/vfs/go.sum
            build/tools/go.sum
            build/tools/gopls/go.sum
      - name: Select linter comparison revision
        id: lint-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          revision=
          if [ "$EVENT_NAME" = pull_request ]; then
            revision=$PULL_REQUEST_BASE
          elif [ "$EVENT_NAME" = push ]; then
            if ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            fi
            git cat-file -e "$PUSH_BEFORE^{commit}"
            revision=$PUSH_BEFORE
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            revision=$(git merge-base HEAD FETCH_HEAD)
          else
            printf 'unsupported event for incremental linting: %s\n' "$EVENT_NAME" >&2
            exit 2
          fi
          test -n "$revision"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Run formatting and linter gates
        env:
          LINT_BASE_REV: ${{ steps.lint-base.outputs.revision }}
        run: make quality

  hermetic:
    name: Hermetic and independent modules
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            packages/cache/go.sum
            packages/mail/go.sum
            packages/vfs/go.sum
      - name: Set up Node
        uses: actions/setup-node@53b839b1c293c9a420562e712d90e3ea84a0d83f # v6.3.0
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            docs/site/package-lock.json
      - name: Run product gate
        run: make check
      - name: Verify independent modules
        run: make independent-modules

  integration:
    name: Dependency-backed integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            packages/cache/go.sum
            packages/mail/go.sum
            packages/vfs/go.sum
      - name: Run integration suites
        run: make integration

  cluster:
    name: Three-node certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            packages/cache/go.sum
            packages/mail/go.sum
            packages/vfs/go.sum
      - name: Set up Node
        uses: actions/setup-node@53b839b1c293c9a420562e712d90e3ea84a0d83f # v6.3.0
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Certify active-active development topology
        run: make cluster-smoke
      - name: Print service logs after failure
        if: failure()
        run: make cluster-diagnostics
      - name: Stop cluster
        if: always()
        run: make cluster-down || true

  release:
    name: Reproducible release artifacts
    needs: [quality, hermetic, integration, cluster]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            server/go.sum
            packages/cache/go.sum
            packages/mail/go.sum
            packages/vfs/go.sum
      - name: Set up Node
        uses: actions/setup-node@53b839b1c293c9a420562e712d90e3ea84a0d83f # v6.3.0
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Build archives and checksums
        run: make VERSION=0.0.0-ci.${{ github.run_id }} dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@bbbca94d44d03d8e8a7d6c0251a0d6b8c6e0e972 # v7.0.0
        with:
          name: proctor-linux-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
