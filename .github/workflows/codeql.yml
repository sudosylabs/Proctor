name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proctor-codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false -mod=readonly
  GOPRIVATE: github.com/sudosylabs/proctor

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchains for the Go build
        if: matrix.language == 'go'
        uses: ./.github/actions/setup
        with:
          token: ${{ github.token }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules/**'
              - 'docs/api/reference/**'
              - 'docs/site/build/**'
              - 'docs/site/src/generated/**'
              - 'webapp/dist/**'
              - 'webapp/src/generated/**'
      - name: Build every product module
        if: matrix.build-mode == 'manual'
        run: go build ./server/... ./packages/cache/... ./packages/mail/... ./packages/vfs/...
      - name: Analyze
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
