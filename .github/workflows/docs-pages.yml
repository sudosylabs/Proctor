name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'server/openapi.json'
      - 'webapp/.nvmrc'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proctor-docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCS_PUBLISH_ENABLED: ${{ vars.DOCS_PUBLISH_ENABLED }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      BASE_URL: ${{ vars.DOCS_BASE_URL || '/' }}
    steps:
      - name: Require a real HTTPS origin before building for publication
        if: env.DOCS_PUBLISH_ENABLED == 'true'
        run: |
          [[ "$DOCS_SITE_URL" =~ ^https://[a-z0-9.-]+$ ]]
          [[ "$DOCS_SITE_URL" != *.invalid ]]
          [[ "$BASE_URL" =~ ^/([A-Za-z0-9._-]+/)*$ ]]
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webapp/.nvmrc
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install the locked documentation toolchain
        working-directory: docs/site
        run: npm ci --include=dev
      - name: Build the site
        working-directory: docs/site
        run: |
          # An unset DOCS_SITE_URL must fall back to the placeholder origin.
          if [ -z "$DOCS_SITE_URL" ]; then unset DOCS_SITE_URL; fi
          npm run build
      - name: Upload the Pages artifact
        if: env.DOCS_PUBLISH_ENABLED == 'true' && env.DOCS_SITE_URL != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Publication stays inert until maintainers opt in, like RELEASES_ENABLED.
    if: vars.DOCS_PUBLISH_ENABLED == 'true' && vars.DOCS_SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the built site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
