paths:
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List Roles
      tags:
        - Roles and access
      description: >-
        Lists built-in and custom Roles visible to the authorized caller. Role definitions name permissions only; effective access also requires a current scoped Role Binding and terminal authorization against current durable state.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/RoleListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRole
      summary: Create a custom Role
      tags:
        - Roles and access
      description: >-
        Creates a reusable custom Role from a canonical name and an allowlisted set of known permissions. Creation grants the Role to nobody; a separate scoped Role Binding is required before it affects authorization.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - role.invalid
        - role.conflict
        - role.permission.unknown
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRole'
      responses:
        "201":
          $ref: '#/components/responses/RoleCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/RoleID'
    get:
      operationId: getRole
      summary: Get a Role
      tags:
        - Roles and access
      description: >-
        Returns one built-in or custom Role visible to the caller, including its current permission set and built-in protection flag. The response does not imply that any User currently holds the Role.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/RoleOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateRole
      summary: Update a custom Role
      tags:
        - Roles and access
      description: >-
        Changes the presentation or complete permission set of one custom Role after rechecking current authority. Built-in Roles are protected, and a permission change can fail when active historical guarantees make the proposed replacement unsafe.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - role.invalid
        - role.conflict
        - role.built_in.protected
        - role.permission.unknown
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateRole'
      responses:
        "200":
          $ref: '#/components/responses/RoleOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteRole
      summary: Delete a custom Role
      tags:
        - Roles and access
      description: >-
        Deletes an unprotected custom Role only when no retained Binding dependency prevents removal. Built-in Roles and Roles whose deletion would invalidate active authorization history remain protected.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/roles/<role-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - role.built_in.protected
        - role.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/RoleDeleted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    RoleID:
      name: role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Role identifier.
  requestBodies:
    CreateRole:
      description: Canonical custom Role presentation and complete initial permission set.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateRoleRequest'
          example:
            name: assessment-reviewer
            display_name: Assessment Reviewer
            description: Reviews examination integrity records.
            permissions:
              - class.view
    UpdateRole:
      description: Partial custom Role replacement; omitted or null fields remain unchanged.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateRoleRequest'
          example:
            display_name: Senior Assessment Reviewer
            description: Reviews examination and integrity records.
            permissions:
              - class.view
  responses:
    RoleListOK:
      description: Role collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleListResponse'
    RoleOK:
      description: Role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleResponse'
    RoleCreated:
      description: Role created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleResponse'
    RoleDeleted:
      description: Role deleted
  schemas:
    RoleListResponse:
      description: Roles visible to the authorized caller.
      type: array
      items:
        $ref: '#/components/schemas/RoleResponse'
    CreateRoleRequest:
      description: Canonical identity, presentation, and complete permission set for a new custom Role.
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
        - permissions
      properties:
        name:
          type: string
          description: Immutable canonical machine name for the Role.
        display_name:
          type: string
          description: Human-facing Role name.
        description:
          type: string
          description: Human-facing explanation of the Role's intended responsibility.
        permissions:
          type: array
          description: Duplicate-free complete set of known permission actions granted by the Role.
          items:
            type: string
    UpdateRoleRequest:
      description: Mutable custom Role fields; the canonical name never changes.
      type: object
      additionalProperties: false
      properties:
        display_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        description:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        permissions:
          type:
            - array
            - "null"
          description: Omitted or null leaves the value unchanged. An empty array is present and subject to validation.
          items:
            type: string
