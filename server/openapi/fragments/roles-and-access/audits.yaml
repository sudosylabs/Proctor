paths:
  /api/v1/audits:
    get:
      operationId: listAuditEvents
      summary: List authorized institution or Academic Unit audit history
      tags:
        - Roles and access
      description: >-
        Lists bounded durable audit facts visible through the caller's Institution or Academic Unit authority. The projection omits raw parameters, prior state, result payloads, credentials, protected content, and unsafe internal failures.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.query.invalid
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of audit Events to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation emitted by the preceding page for the same filters.
        - name: actor_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Return only Events attributed to this actor User.
        - name: action
          in: query
          schema:
            type: string
          description: Return only Events with this exact stable action.
        - name: resource_type
          in: query
          schema:
            type: string
          description: Exact resource type to filter; resource_id is required when present.
        - name: resource_id
          in: query
          schema:
            $ref: '#/components/schemas/ID'
          description: Exact resource identity to filter; resource_type is required when present.
      responses:
        "200":
          $ref: '#/components/responses/AuditListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    AuditListOK:
      description: Audit Event collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuditListResponse'
          example:
            events: []
  schemas:
    AuditEventResponse:
      description: Safe durable audit fact visible to the authorized caller.
      type: object
      additionalProperties: false
      required:
        - id
        - create_at
        - update_at
        - action
        - resource
        - status
      properties:
        id:
          $ref: '#/components/schemas/ID'
        create_at:
          type: integer
          format: int64
          description: Unix time in milliseconds when the audit Attempt was created.
        update_at:
          type: integer
          format: int64
          description: Unix time in milliseconds of the latest durable audit status change.
        actor_id:
          type: string
          description: User that initiated the action, omitted for actor-less system transitions.
        session_id:
          type: string
          description: Safe Session identity associated with the action when retained; never a credential.
        action:
          type: string
          description: Stable permission-style name of the attempted action.
        resource:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              description: Stable resource type acted upon.
            id:
              $ref: '#/components/schemas/ID'
        scope_type:
          type: string
          description: Authorization scope type under which the action was evaluated.
        scope_id:
          type: string
          description: Authorization scope identity, when the action has a scoped owner.
        status:
          type: string
          description: Durable outcome state of the audited Attempt.
        request_id:
          type: string
          description: Safe request correlation value when the action originated over a request transport.
        node_id:
          type: string
        client_type:
          type: string
        authentication_method:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        error_code:
          type: string
          description: Stable safe failure category for an unsuccessful action; internal detail is omitted.
    AuditListResponse:
      description: One bounded page of authorized audit Events.
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
