paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      tags:
        - System
      description: >-
        Reports whether this process is alive and able to serve the health handler. It does not prove that dependencies are ready or that the node should receive application traffic.
      x-proctor-auth: public
      x-proctor-error-codes:
        - not_live
      security: []
      x-proctor-idempotency: none
      responses:
        "200":
          $ref: '#/components/responses/HealthOK'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check service readiness
      tags:
        - System
      description: >-
        Reports whether this node and its required dependencies are ready to serve application traffic. Orchestrators should remove a failing node from service while continuing to use liveness to decide whether the process needs replacement.
      x-proctor-auth: public
      x-proctor-error-codes:
        - not_ready
      security: []
      x-proctor-idempotency: none
      responses:
        "200":
          $ref: '#/components/responses/HealthOK'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    HealthOK:
      description: Health status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
  schemas:
    HealthResponse:
      description: Minimal successful health-check projection.
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          description: The literal successful health state.
          enum:
            - ok
