components:
  parameters:
    ExamExportID:
      name: "exam_export_id"
      in: "path"
      required: true
      description: "The opaque export request identity, within its exact Sitting or Submission route scope."
      schema:
        $ref: "#/components/schemas/ID"
  requestBodies:
    CreateExamExport:
      description: "Explicit whole-request category selection; omitted, empty, duplicate or unknown categories are rejected."
      required: true
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/CreateExamExportRequest"
          example:
            categories:
              - "work"
              - "integrity"
  responses:
    ExamExportAccepted:
      description: "A fixed-expiry export request was accepted; poll its exact scoped resource."
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ExamExportResponse"
          example:
            id: "yyyyyyyyyyyyyyyyyyyyyyyyyy"
            exam_id: "bbbbbbbbbbbbbbbbbbbbbbbbbb"
            exam_sitting_id: "nnnnnnnnnnnnnnnnnnnnnnnnnn"
            categories:
              - "work"
            state: "queued"
            policy_revision: 2
            created_at: "2026-09-01T12:00:00Z"
            expires_at: "2026-09-02T12:00:00Z"
            construction_deadline: "2026-09-02T12:00:00Z"
            submission_count: 1
            file_count: 1
            source_bytes: 128
    ExamExportOK:
      description: "Requester-only export metadata under current ordinary record authority."
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ExamExportResponse"
          example:
            id: "yyyyyyyyyyyyyyyyyyyyyyyyyy"
            exam_id: "bbbbbbbbbbbbbbbbbbbbbbbbbb"
            exam_sitting_id: "nnnnnnnnnnnnnnnnnnnnnnnnnn"
            categories:
              - "work"
            state: "queued"
            policy_revision: 2
            created_at: "2026-09-01T12:00:00Z"
            expires_at: "2026-09-02T12:00:00Z"
            construction_deadline: "2026-09-02T12:00:00Z"
            submission_count: 1
            file_count: 1
            source_bytes: 128
    ExamExportArchive:
      description: "Verified temporary ZIP archive; every new download is authorized and expiry checked. No public storage URL or backend identity is exposed."
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        ETag:
          description: "Quoted SHA-256 of the complete ZIP."
          schema:
            type: "string"
        Content-Disposition:
          description: "Attachment with a safe server-generated filename."
          schema:
            type: "string"
        X-Content-Type-Options:
          schema:
            type: "string"
            const: "nosniff"
      content:
        "application/zip":
          schema:
            type: "string"
            format: "binary"
    ExamExportGone:
      description: "The fixed advertised archive expiry has passed; new downloads are denied."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          example:
            type: "/problems/exam-export-expired"
            title: "Export expired"
            status: 410
            detail: "The temporary export has expired."
            code: "exam.export.expired"
            request_id: "req_docs_export_expired"
  schemas:
    CreateExamExportRequest:
      type: "object"
      additionalProperties: false
      required:
        - "categories"
      properties:
        categories:
          type: "array"
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "work"
              - "integrity"
    ExamExportResponse:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "exam_id"
        - "exam_sitting_id"
        - "categories"
        - "state"
        - "policy_revision"
        - "created_at"
        - "expires_at"
        - "construction_deadline"
        - "submission_count"
        - "file_count"
        - "source_bytes"
      properties:
        id:
          $ref: "#/components/schemas/ID"
        exam_id:
          $ref: "#/components/schemas/ID"
        exam_sitting_id:
          $ref: "#/components/schemas/ID"
        submission_id:
          $ref: "#/components/schemas/ID"
        categories:
          type: "array"
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "work"
              - "integrity"
        state:
          type: "string"
          enum:
            - "queued"
            - "ready"
            - "failed"
            - "expired"
        policy_revision:
          type: "integer"
          format: "int64"
          minimum: 1
        created_at:
          type: "string"
          format: "date-time"
        expires_at:
          type: "string"
          format: "date-time"
        construction_deadline:
          type: "string"
          format: "date-time"
        ready_at:
          type: "string"
          format: "date-time"
        submission_count:
          type: "integer"
          minimum: 1
          maximum: 200
        file_count:
          type: "integer"
          minimum: 0
          maximum: 50000
        source_bytes:
          type: "integer"
          format: "int64"
          minimum: 0
          maximum: 8589934592
        archive_size_bytes:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 8724152320
        archive_sha256:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
