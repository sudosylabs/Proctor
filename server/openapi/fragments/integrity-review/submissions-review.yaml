paths:
  /api/v1/submissions/{submission_id}/review:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: getExamIntegrityReview
      summary: Get the authorized manager Review snapshot
      tags:
        - Integrity review
      description: >-
        Returns the current manager-authorized Review, decision set, bounded counts, and integrity state for one Submission. The response includes private review fields and is never the candidate-facing released result projection.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamIntegrityReviewOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateExamIntegrityReview
      summary: Create or revise private notes and approved student remarks
      tags:
        - Integrity review
      description: >-
        Creates the Review or conditionally replaces its private manager notes and approved student remarks under an exact review revision. Finalized Reviews are immutable, and an idempotent replay does not repeat audit or publication effects.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UpdateExamIntegrityReview'
      responses:
        "200":
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/review/decisions/{integrity_flag_id}:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
      - $ref: '#/components/parameters/IntegrityFlagID'
    put:
      operationId: saveExamIntegrityDecision
      summary: Create or revise the one current decision for a Flag
      tags:
        - Integrity review
      description: >-
        Creates or revision-fences the single current manager decision for one exact Flag. The outcome is a non-academic integrity disposition, never a grade or guilt verdict, and its rationale remains private.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/SaveExamIntegrityDecision'
      responses:
        "200":
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/review/finalize:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    post:
      operationId: finalizeExamIntegrityReview
      summary: Freeze the complete Review and bounded evidence inventory
      tags:
        - Integrity review
      description: >-
        Finalizes one exact Review revision only after required decisions and integrity completeness checks succeed, freezing its private content and bounded evidence inventory digest. Late records remain explicit Discrepancies and cannot rewrite the finalized inventory.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/TerminalExamIntegrityReview'
      responses:
        "200":
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/submissions/{submission_id}/review/release:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    post:
      operationId: releaseStudentExamResult
      summary: Explicitly release the approved candidate result projection
      tags:
        - Integrity review
      description: >-
        Releases the narrow approved candidate result from one finalized Review revision. The transition does not expose manager notes, rationales, Flags, evidence, Discrepancies, or other private review state.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.revision_conflict
        - exam.integrity_review.state_conflict
        - exam.integrity_review.incomplete
        - exam.integrity_review.too_large
        - exam.integrity_review.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/TerminalExamIntegrityReview'
      responses:
        "200":
          $ref: '#/components/responses/ExamIntegrityReviewMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    SaveExamIntegrityDecision:
      description: Revision-fenced non-academic outcome and private rationale for one exact integrity Flag.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SaveExamIntegrityDecisionRequest'
          example:
            expected_review_revision: 0
            expected_decision_revision: 0
            outcome: inconclusive
            private_rationale: The retained evidence does not establish a reliable conclusion.
    UpdateExamIntegrityReview:
      description: Complete mutable private notes and approved candidate remarks under the current review revision.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateExamIntegrityReviewRequest'
          example:
            expected_review_revision: 0
            manager_notes: Review opened; evidence assessment is pending.
            student_remarks_markdown: ""
    TerminalExamIntegrityReview:
      description: Exact existing Review identity and revision to finalize or release.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TerminalExamIntegrityReviewRequest'
          example:
            submission_review_id: ybndrfg8ejkmcpqxot1uwisza3
            expected_review_revision: 7
  responses:
    ExamIntegrityReviewOK:
      description: Manager-authorized Review snapshot including private Review fields
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamIntegrityReviewResponse'
    ExamIntegrityReviewMutationOK:
      description: Committed Integrity Review mutation or its exact replay
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamIntegrityReviewMutationResponse'
  schemas:
    SaveExamIntegrityDecisionRequest:
      description: Conditional create or replacement of the current decision for one integrity Flag.
      type: object
      additionalProperties: false
      required:
        - expected_review_revision
        - expected_decision_revision
        - outcome
        - private_rationale
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
          description: Required when revising an existing Review; omitted only when creating its first decision.
        expected_review_revision:
          type: integer
          format: int64
          minimum: 0
          description: Zero when creating the first Review through this command; otherwise the exact current Review revision.
        expected_decision_revision:
          type: integer
          format: int64
          minimum: 0
          description: Zero for the first decision on this Flag; otherwise the exact current decision revision.
        outcome:
          type: string
          enum:
            - confirmed
            - dismissed
            - inconclusive
          description: A non-academic integrity disposition, never a grade or guilt verdict.
        private_rationale:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required already-trimmed manager-only UTF-8 rationale, at most 1000 Unicode scalar values and 4000 bytes.
    UpdateExamIntegrityReviewRequest:
      description: Conditional complete replacement of the Review's mutable text fields.
      type: object
      additionalProperties: false
      required:
        - expected_review_revision
        - manager_notes
        - student_remarks_markdown
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
          description: Required when revising an existing Review; omitted only when creating it.
        expected_review_revision:
          type: integer
          format: int64
          minimum: 0
        manager_notes:
          type: string
          maxLength: 3000
          description: Already-trimmed private manager UTF-8 notes, at most 3000 Unicode scalar values and 12000 bytes.
        student_remarks_markdown:
          type: string
          maxLength: 8192
          description: >-
            Optional approved student-facing Markdown, at most 8192 Unicode scalar values and 32768 UTF-8 bytes; sanitized again on candidate projection.
    TerminalExamIntegrityReviewRequest:
      description: Existing Review identity and exact revision for a terminal transition.
      type: object
      additionalProperties: false
      required:
        - submission_review_id
        - expected_review_revision
      properties:
        submission_review_id:
          $ref: '#/components/schemas/ID'
        expected_review_revision:
          type: integer
          format: int64
          minimum: 1
    ExamIntegrityReviewDecisionResponse:
      description: Current private manager disposition for one integrity Flag.
      type: object
      additionalProperties: false
      required:
        - id
        - integrity_flag_id
        - outcome
        - revision
        - actor_user_id
        - private_rationale
        - decided_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        integrity_flag_id:
          $ref: '#/components/schemas/ID'
        outcome:
          type: string
          enum:
            - confirmed
            - dismissed
            - inconclusive
        revision:
          type: integer
          format: int64
          minimum: 1
        actor_user_id:
          $ref: '#/components/schemas/ID'
        private_rationale:
          type: string
          minLength: 1
          maxLength: 1000
          description: Manager-only private rationale.
        decided_at:
          type: string
          format: date-time
    ExamSubmissionReviewResponse:
      description: Private manager Review state and bounded immutable inventory metadata.
      type: object
      additionalProperties: false
      required:
        - id
        - submission_id
        - state
        - release_state
        - revision
        - created_by_user_id
        - manager_notes
        - student_remarks_markdown
        - flag_count
        - evidence_count
        - discrepancy_count
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        submission_id:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          enum:
            - draft
            - finalized
        release_state:
          type: string
          enum:
            - withheld
            - released
          description: Whether the narrow candidate result remains withheld or has been explicitly released.
        revision:
          type: integer
          format: int64
          minimum: 1
        created_by_user_id:
          $ref: '#/components/schemas/ID'
        manager_notes:
          type: string
          maxLength: 3000
          description: Manager-only private notes.
        student_remarks_markdown:
          type: string
          maxLength: 8192
        flag_count:
          type: integer
          minimum: 0
          maximum: 200
        evidence_count:
          type: integer
          minimum: 0
          maximum: 20000
        discrepancy_count:
          type: integer
          minimum: 0
          maximum: 200
        evidence_inventory_digest:
          $ref: '#/components/schemas/SHA256'
          description: Digest freezing the bounded evidence inventory at finalization.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
        finalized_by_user_id:
          $ref: '#/components/schemas/ID'
        released_at:
          type: string
          format: date-time
        released_by_user_id:
          $ref: '#/components/schemas/ID'
    ExamIntegrityReviewResponse:
      description: Manager-authorized Submission integrity snapshot and current decision set.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - exam_id
        - exam_sitting_id
        - exam_attempt_id
        - candidate_user_id
        - integrity_state
        - unresolved_integrity_count
        - decisions
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
        exam_id:
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
        candidate_user_id:
          $ref: '#/components/schemas/ID'
        integrity_state:
          type: string
          enum:
            - settled
            - gapped
        unresolved_integrity_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of unresolved integrity items that can block finalization.
        review:
          $ref: '#/components/schemas/ExamSubmissionReviewResponse'
        decisions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExamIntegrityReviewDecisionResponse'
    ExamIntegrityReviewMutationResponse:
      description: Committed Review state and optional decision returned by a mutation or exact replay.
      type: object
      additionalProperties: false
      required:
        - submission_id
        - exam_attempt_id
        - candidate_user_id
        - review
      properties:
        submission_id:
          $ref: '#/components/schemas/ID'
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
        candidate_user_id:
          $ref: '#/components/schemas/ID'
        review:
          $ref: '#/components/schemas/ExamSubmissionReviewResponse'
        decision:
          $ref: '#/components/schemas/ExamIntegrityReviewDecisionResponse'
