paths:
  /api/v1/submissions/{submission_id}/integrity-discrepancies:
    parameters:
      - $ref: '#/components/parameters/SubmissionID'
    get:
      operationId: listExamIntegrityDiscrepancies
      summary: List bounded late records retained after integrity collection ended
      tags:
        - Integrity review
      description: Late records are explicit discrepancies and never alter a finalized or released Review inventory.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.integrity_review.invalid
        - exam.integrity_review.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of retained Discrepancies to return.
        - name: cursor
          in: query
          schema:
            type: string
            description: Opaque versioned Discrepancy identity cursor.
          description: Opaque continuation emitted by the preceding Discrepancy page.
      responses:
        "200":
          $ref: '#/components/responses/ExamIntegrityDiscrepancyListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    ExamIntegrityDiscrepancyListOK:
      description: Bounded manager-authorized post-collection discrepancies
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamIntegrityDiscrepancyListResponse'
          example:
            items: []
  schemas:
    ExamIntegrityDiscrepancyResponse:
      description: >-
        Bounded manager-only uncertainty associated with a sealed Submission. Kind-specific fields are present only for
        their named kind; the record is not evidence, a misconduct finding, a score, or a grade.
      type: object
      additionalProperties: false
      required:
        - id
        - exam_attempt_id
        - participation_id
        - generation
        - kind
        - schema_version
        - received_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
        participation_id:
          $ref: '#/components/schemas/ID'
        generation:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum:
            - late_focus_loss
            - focus_loss_gap
            - browser_activity_gap
            - correction_acknowledgement_missing
        schema_version:
          type: integer
          const: 1
        focus_loss_signal_id:
          $ref: '#/components/schemas/ID'
        sequence:
          type: integer
          format: int64
          minimum: 1
        duration_milliseconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
          description: Reported focus-loss duration in milliseconds.
        source:
          type: string
          enum:
            - application_backgrounded
            - document_hidden
            - fullscreen_exited
            - window_blur
        missing_before:
          type: integer
          format: int64
          minimum: 0
          description: Number of missing monotonic signals observed before this late record.
        correction_revision_id:
          $ref: '#/components/schemas/ID'
        browser_activity_source_session_id:
          type: string
          format: uuid
        final_sequence:
          type: integer
          format: int64
          minimum: 1
        gap_reason:
          type: string
          enum:
            - sequence_gap
            - source_not_finalized
            - sequence_gap_and_source_not_finalized
            - spool_overflow
            - spool_corrupt
            - spool_key_unavailable
            - delivery_incomplete
            - prior_source_gap
        unresolved_count:
          type: integer
          format: int64
          minimum: 1
          description: Bounded aggregate represented by this terminal discrepancy.
        received_at:
          type: string
          format: date-time
    ExamIntegrityDiscrepancyListResponse:
      description: One bounded page of post-collection integrity Discrepancies.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExamIntegrityDiscrepancyResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
