paths:
  /api/v1/exams/{exam_id}/sittings:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: listExamSittings
      summary: List bounded Exam Sittings ordered by scheduled start and identity descending
      tags:
        - Sittings
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: class_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ID'
        - name: state
          in: query
          required: false
          description: Repeated values are accepted and deduplicated before applying the filter.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            items:
              $ref: '#/components/schemas/ExamSittingState'
        - name: ends_after
          in: query
          required: false
          description: Paired with starts_before; selects half-open Sittings whose end is after this instant.
          schema:
            type: string
            format: date-time
        - name: starts_before
          in: query
          required: false
          description: Paired with ends_after; selects half-open Sittings whose start is before this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque versioned cursor over descending scheduled start and Sitting identity; clients return it unchanged.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: scheduleExamSitting
      summary: Schedule one immutable Exam Revision for one Class
      tags:
        - Sittings
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.class_ineligible
        - exam.sitting.schedule_outside_period
        - exam.sitting.schedule_not_future
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ScheduleExamSitting'
      responses:
        "201":
          $ref: '#/components/responses/ExamSittingCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: getExamSitting
      summary: Get one bounded Exam Sitting
      tags:
        - Sittings
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateExamSittingSchedule
      summary: Change the pre-open Exam Revision, Class, or schedule
      tags:
        - Sittings
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.no_changes
        - exam.sitting.state_conflict
        - exam.sitting.class_ineligible
        - exam.sitting.schedule_outside_period
        - exam.sitting.schedule_not_future
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/UpdateExamSittingSchedule'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    ScheduleExamSitting:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleExamSittingRequest'
    UpdateExamSittingSchedule:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateExamSittingScheduleRequest'
  responses:
    ExamSittingCreated:
      description: Exam Sitting scheduled
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingResponse'
    ExamSittingListOK:
      description: Bounded Exam Sitting collection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingListResponse'
  schemas:
    ScheduleExamSittingRequest:
      type: object
      additionalProperties: false
      required:
        - exam_revision_id
        - class_id
        - scheduled_start_at
        - scheduled_end_at
      properties:
        exam_revision_id:
          $ref: '#/components/schemas/ID'
        class_id:
          $ref: '#/components/schemas/ID'
        scheduled_start_at:
          type: string
          format: date-time
        scheduled_end_at:
          type: string
          format: date-time
    UpdateExamSittingScheduleRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      anyOf:
        - required:
            - exam_revision_id
        - required:
            - class_id
        - required:
            - scheduled_start_at
        - required:
            - scheduled_end_at
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        exam_revision_id:
          $ref: '#/components/schemas/ID'
        class_id:
          $ref: '#/components/schemas/ID'
        scheduled_start_at:
          type: string
          format: date-time
        scheduled_end_at:
          type: string
          format: date-time
    ExamSittingListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExamSittingResponse'
        next_cursor:
          type: string
          description: Opaque versioned cursor over descending scheduled start and Sitting identity; clients return it unchanged.
