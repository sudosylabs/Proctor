paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    post:
      operationId: cancelExamSitting
      summary: Cancel a Scheduled Exam Sitting with a private manager reason
      tags:
        - Sittings
      description: >-
        Cancels one still-scheduled Sitting under an exact revision fence and retains a bounded private manager rationale in durable audit state. Cancellation never fabricates Attempts or Submissions and cannot rewrite a Sitting that has opened.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.conflict
        - exam.sitting.unavailable
        - exam.archived
        - exam.sitting.revision_conflict
        - exam.sitting.state_conflict
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CancelExamSitting'
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CancelExamSitting:
      description: Exact current Sitting revision and private rationale for pre-open cancellation.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CancelExamSittingRequest'
          example:
            expected_revision: 2
            reason: The examination timetable was withdrawn.
  schemas:
    CancelExamSittingRequest:
      description: Revision-fenced pre-open cancellation command.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - reason
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          description: Exact current Sitting revision used as an optimistic concurrency fence.
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            Private manager rationale. Must be valid UTF-8, already trimmed, 1-1000 Unicode scalar values, and at most 4000 UTF-8 bytes.
