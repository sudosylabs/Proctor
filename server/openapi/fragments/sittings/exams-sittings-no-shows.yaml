paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/no-shows:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: listExamSittingNoShows
      summary: List candidates who were Class members at actual start but never created an Attempt
      tags:
        - Sittings
      description: >-
        Derives candidates from Class membership effective at the Sitting's actual opening time and excludes everyone with an Attempt. It never fabricates an Attempt or Submission for absence and is available only after lifecycle state makes the no-show set meaningful.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.sitting.invalid
        - exam.sitting.unavailable
        - exam.sitting.state_conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of no-show candidate identities to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque versioned cursor over candidate identity; return unchanged.
      responses:
        "200":
          $ref: '#/components/responses/ExamSittingNoShowListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    ExamSittingNoShowListOK:
      description: Bounded candidates with no Attempt, derived from membership active at actual Sitting start
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamSittingNoShowListResponse'
  schemas:
    ExamSittingNoShowResponse:
      description: Candidate who belonged to the target Class at actual opening and has no Attempt.
      type: object
      additionalProperties: false
      required:
        - candidate_user_id
      properties:
        candidate_user_id:
          $ref: '#/components/schemas/ID'
    ExamSittingNoShowListResponse:
      description: One bounded page of derived no-show candidate identities.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExamSittingNoShowResponse'
        next_cursor:
          type: string
          description: Opaque versioned candidate-identity cursor; clients return it unchanged.
