paths:
  /api/v1/academic-unit-members/{academic_unit_member_id}:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitMemberID'
    delete:
      operationId: endAcademicUnitMember
      summary: End organizational membership while retaining history
      tags:
        - Membership and progression
      description: >-
        Ends one exact effective Academic Unit membership after authorizing its current Unit scope. Historical dates and audit provenance remain durable, and ending membership does not silently remove affiliations, Roles, or scoped Role Bindings.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/academic-unit-members/<membership-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit_member.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitMemberEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    AcademicUnitMemberID:
      name: academic_unit_member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Academic Unit membership identifier.
  responses:
    AcademicUnitMemberEnded:
      description: Academic Unit Member ended
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
