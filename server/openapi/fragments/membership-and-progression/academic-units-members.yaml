paths:
  /api/v1/academic-units/{academic_unit_id}/members:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listAcademicUnitMembers
      summary: List effective-dated organizational members
      tags:
        - Membership and progression
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: active_at
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: history
          in: query
          required: false
          description: When true, return membership history and ignore active_at.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAcademicUnitMember
      summary: Create organizational membership without granting permissions
      tags:
        - Membership and progression
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit_member.invalid
        - academic_unit_member.conflict
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicUnitMember'
      responses:
        "201":
          $ref: '#/components/responses/AcademicUnitMemberCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    CreateAcademicUnitMember:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicUnitMemberRequest'
  responses:
    AcademicUnitMemberCreated:
      description: Academic Unit Member created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
    AcademicUnitMemberListOK:
      description: Academic Unit Member collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberListResponse'
  schemas:
    AcademicUnitMemberListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AcademicUnitMemberResponse'
    CreateAcademicUnitMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        academic_unit_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: integer
          format: int64
        end_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored; memberships are ended through DELETE.
