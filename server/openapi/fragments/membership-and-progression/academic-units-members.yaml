paths:
  /api/v1/academic-units/{academic_unit_id}/members:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listAcademicUnitMembers
      summary: List effective-dated organizational members
      tags:
        - Membership and progression
      description: >-
        Lists authorized current or historical organizational memberships for one Academic Unit at the requested effective instant. Membership describes a relationship only and is never presented as an unrestricted permission grant. Bounded pages use immutable (user_id, id) ordering. The next Link freezes the effective instant or history filter, but pages are a live view: later membership edits and insertions can change later results; no database snapshot is retained across requests.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Opt into bounded paging while preserving the bare-array response. Defaults to 50 when cursor is supplied; pages contain at most 200 rows. Without limit or cursor the legacy full-list response remains available.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          required: false
          description: Opaque continuation from the previous Link header. It binds the resource and effective/history filter. Every page requires fresh authorization; do not edit or reuse it for another resource or filter.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: active_at
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Unix time in milliseconds at which membership must be effective; ignored when history is true in legacy full-list mode. For paging, omit it with history=true and inherit the first page instant when following a cursor.
        - name: history
          in: query
          required: false
          description: When true, return membership history. Legacy full-list mode ignores active_at; paged requests must omit active_at with history=true.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAcademicUnitMember
      summary: Create organizational membership without granting permissions
      tags:
        - Membership and progression
      description: >-
        Creates one effective-dated relationship between an existing User and the Academic Unit in the route. The transaction rechecks Unit authority and overlap constraints but creates no Role or Role Binding.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit_member.invalid
        - academic_unit_member.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicUnitMember'
      responses:
        "201":
          $ref: '#/components/responses/AcademicUnitMemberCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateAcademicUnitMember:
      description: Existing User and optional effective start for membership in the route Academic Unit.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicUnitMemberRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: 1785542400000
  responses:
    AcademicUnitMemberCreated:
      description: Academic Unit Member created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
    AcademicUnitMemberListOK:
      headers:
        Link:
          description: Present only when a bounded page has more rows. Follow the relative URL with rel="next"; its cursor and effective/history filter identify the continuation.
          schema:
            type: string
      description: Academic Unit Member collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberListResponse'
  schemas:
    AcademicUnitMemberListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AcademicUnitMemberResponse'
    CreateAcademicUnitMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        academic_unit_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: integer
          format: int64
        end_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored; memberships are ended through DELETE.
