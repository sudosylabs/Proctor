paths:
  /api/v1/academic-units/{academic_unit_id}/members:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listAcademicUnitMembers
      summary: List effective-dated organizational members
      tags:
        - Membership and progression
      description: >-
        Lists authorized current or historical organizational memberships for one Academic Unit at the requested effective instant. Membership describes a relationship only and is never presented as an unrestricted permission grant. Bounded pages use immutable (user_id, id) ordering. The next_cursor freezes the effective instant or history filter, but pages are a live view: later membership edits and insertions can change later results; no database snapshot is retained across requests.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: active_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant at which membership must be effective; ignored when history is true in legacy full-list mode. For paging, omit it with history=true and inherit the first page instant when following a cursor.
        - name: history
          in: query
          required: false
          description: When true, return membership history. Legacy full-list mode ignores active_at; paged requests must omit active_at with history=true.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAcademicUnitMember
      summary: Create organizational membership without granting permissions
      tags:
        - Membership and progression
      description: >-
        Creates one effective-dated relationship between an existing User and the Academic Unit in the route. The transaction rechecks Unit authority and overlap constraints but creates no Role or Role Binding.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit_member.invalid
        - academic_unit_member.conflict
        - administration.unavailable
        - mail.unavailable
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - authentication.csrf.invalid
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicUnitMember'
      responses:
        "201":
          $ref: '#/components/responses/AcademicUnitMemberCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateAcademicUnitMember:
      description: Existing User and optional effective start for membership in the route Academic Unit.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicUnitMemberRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: '2026-08-01T00:00:00Z'
  responses:
    AcademicUnitMemberCreated:
      description: Academic Unit Member created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
    AcademicUnitMemberListOK:
      description: Academic Unit Member collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitMemberListResponse'
  schemas:
    AcademicUnitMemberListResponse:
      description: One page of the collection in its stable order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AcademicUnitMemberResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateAcademicUnitMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: string
          format: date-time