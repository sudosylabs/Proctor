paths:
  /api/v1/affiliations/{affiliation_id}:
    parameters:
      - $ref: '#/components/parameters/AffiliationID'
    delete:
      operationId: endAffiliation
      summary: End an Affiliation while retaining history
      tags:
        - Membership and progression
      description: >-
        Ends one exact effective Affiliation after authorizing the related User and scope. Other Affiliations may remain active, and this relationship change never revokes credentials or permissions implicitly.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/affiliations/<affiliation-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - affiliation.student_has_active_enrollment
        - affiliation.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AffiliationEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    AffiliationID:
      name: affiliation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Affiliation identifier.
  responses:
    AffiliationEnded:
      description: Affiliation ended
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliationResponse'
