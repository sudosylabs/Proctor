components:
  parameters:
    StudentProgressionID:
      name: student_progression_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The staged student progression identifier.
  responses:
    StudentProgressionAccepted:
      description: Student progression accepted for asynchronous dry-run or execution
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingImportResponse'
    StudentProgressionOK:
      description: Authorized safe student progression preview or result
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingImportResponse'
  schemas:
    AffiliationKind:
      type: string
      enum:
        - student
        - teacher
        - staff
        - external
    AffiliationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - user_id
        - kind
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        user_id:
          $ref: '#/components/schemas/ID'
        kind:
          $ref: '#/components/schemas/AffiliationKind'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
    AcademicUnitMemberResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - academic_unit_id
        - user_id
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        academic_unit_id:
          $ref: '#/components/schemas/ID'
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
    ClassMemberResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - class_id
        - academic_period_id
        - user_id
        - start_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        class_id:
          $ref: '#/components/schemas/ID'
        academic_period_id:
          $ref: '#/components/schemas/ID'
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
