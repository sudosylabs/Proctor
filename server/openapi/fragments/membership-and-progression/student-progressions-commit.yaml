paths:
  /api/v1/student-progressions/{student_progression_id}/commit:
    parameters:
      - $ref: '#/components/parameters/StudentProgressionID'
    post:
      operationId: commitStudentProgression
      summary: Commit one exact student progression preview
      description: >-
        Applies the exact authorized dry-run preview only when its revision and digest still match current source, destination, and student state. The named aggregate transition ends and creates enrollments atomically and preserves history for every affected student.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      tags:
        - Membership and progression
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - student_progression.target_conflict
        - student_progression.lineage_conflict
        - student_progression.effective_date_conflict
        - student_progression.roster_too_large
        - student_progression.conflict
        - student_progression.unavailable
        - administration.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CommitStudentProgression'
      responses:
        "202":
          $ref: '#/components/responses/StudentProgressionAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CommitStudentProgression:
      description: Exact immutable preview revision and digest to apply transactionally.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudentProgressionCommitRequest'
          example:
            expected_revision: 3
            preview_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  schemas:
    StudentProgressionCommitRequest:
      description: Revision and SHA-256 digest fencing commit to the reviewed dry-run preview.
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - preview_digest
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 digest of the exact immutable preview, encoded as lowercase hexadecimal.
