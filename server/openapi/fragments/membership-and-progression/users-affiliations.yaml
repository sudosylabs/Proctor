paths:
  /api/v1/users/{user_id}/affiliations:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      operationId: listAffiliations
      summary: List a User's effective-dated Affiliations
      tags:
        - Membership and progression
      description: >-
        Lists the authorized current and historical relationship kinds attached to one User. Affiliations are non-exclusive descriptive relationships and never substitute for Role Bindings in permission checks.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AffiliationListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAffiliation
      summary: Create a non-exclusive effective-dated Affiliation
      tags:
        - Membership and progression
      description: >-
        Adds one effective-dated student, teacher, staff, or external relationship to an existing User. Other Affiliation kinds may coexist, and the transition grants no permissions or credentials by itself.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - affiliation.invalid
        - affiliation.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAffiliation'
      responses:
        "201":
          $ref: '#/components/responses/AffiliationCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateAffiliation:
      description: Relationship kind and optional effective interval for the route User.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAffiliationRequest'
          example:
            kind: teacher
            start_at: '2026-08-01T00:00:00Z'
  responses:
    AffiliationCreated:
      description: Affiliation created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliationResponse'
    AffiliationListOK:
      description: Affiliation collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffiliationListResponse'
          example:
            items: []
  schemas:
    AffiliationListResponse:
      description: One page of the collection in its stable order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AffiliationResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    CreateAffiliationRequest:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          $ref: '#/components/schemas/AffiliationKind'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
