paths:
  /api/v1/class-members/{class_member_id}:
    parameters:
      - $ref: '#/components/parameters/ClassMemberID'
    delete:
      operationId: endClassMember
      summary: End an enrollment while retaining history
      tags:
        - Membership and progression
      description: >-
        Ends one exact Class enrollment while preserving its Academic Period history. The command does not delete the User, Class, past participation, or audit data and never enrolls the student elsewhere automatically.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/class-members/<class-member-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.enrollment_conflict
        - mail.unavailable
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/ClassMemberEnded'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    ClassMemberID:
      name: class_member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The effective-dated Class membership identifier.
  responses:
    ClassMemberEnded:
      description: Class Member ended
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassMemberResponse'
