paths:
  /api/v1/classes/{class_id}/members:
    parameters:
      - $ref: '#/components/parameters/ClassID'
    get:
      operationId: listClassMembers
      summary: List active or historical student enrollments for a Class
      tags:
        - Membership and progression
      description: >-
        Lists authorized student enrollments for one Class at the requested effective instant or across retained history. The roster projection contains relationship state and does not expand student credentials, answers, or unrestricted profile data. Bounded pages use immutable (user_id, id) ordering. The next_cursor freezes the effective instant or history filter, but pages are a live view: later membership edits and insertions can change later results; no database snapshot is retained across requests.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: active_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: RFC 3339 instant at which enrollment must be effective; ignored when history is true in legacy full-list mode. For paging, omit it with history=true and inherit the first page instant when following a cursor.
        - name: history
          in: query
          required: false
          description: When true, return enrollment history. Legacy full-list mode ignores active_at; paged requests must omit active_at with history=true.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/ClassMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: enrollClassMember
      summary: Enroll, transfer, or progress a student transactionally
      tags:
        - Membership and progression
      description: >-
        Enrolls an existing User in the route Class and atomically ends a conflicting active Class membership in the same Academic Period when the domain permits transfer or progression. The transaction preserves every prior enrollment interval.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class_member.invalid
        - class_member.student_affiliation_required
        - class.enrollment_conflict
        - mail.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/EnrollClassMember'
      responses:
        "201":
          $ref: '#/components/responses/ClassMemberEnrolled'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EnrollClassMember:
      description: Existing User and optional effective interval for enrollment in the route Class.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnrollClassMemberRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: '2026-08-01T00:00:00Z'
  responses:
    ClassMemberListOK:
      description: Class Member collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassMemberListResponse'
    ClassMemberEnrolled:
      description: Enrollment or transfer completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassEnrollmentResponse'
  schemas:
    ClassMemberListResponse:
      description: One page of the collection in its stable order.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassMemberResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ClassEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - membership
      properties:
        membership:
          $ref: '#/components/schemas/ClassMemberResponse'
        previous:
          $ref: '#/components/schemas/ClassMemberResponse'
    EnrollClassMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
