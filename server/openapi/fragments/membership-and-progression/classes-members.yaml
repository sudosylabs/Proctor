paths:
  /api/v1/classes/{class_id}/members:
    parameters:
      - $ref: '#/components/parameters/ClassID'
    get:
      operationId: listClassMembers
      summary: List active or historical student enrollments for a Class
      tags:
        - Membership and progression
      description: >-
        Lists authorized student enrollments for one Class at the requested effective instant or across retained history. The roster projection contains relationship state and does not expand student credentials, answers, or unrestricted profile data.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: active_at
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Unix time in milliseconds at which enrollment must be effective; ignored when history is true.
        - name: history
          in: query
          required: false
          description: When true, return enrollment history and ignore active_at.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: '#/components/responses/ClassMemberListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: enrollClassMember
      summary: Enroll, transfer, or progress a student transactionally
      tags:
        - Membership and progression
      description: >-
        Enrolls an existing User in the route Class and atomically ends a conflicting active Class membership in the same Academic Period when the domain permits transfer or progression. The transaction preserves every prior enrollment interval.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class_member.invalid
        - class_member.student_affiliation_required
        - class.enrollment_conflict
        - mail.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/EnrollClassMember'
      responses:
        "201":
          $ref: '#/components/responses/ClassMemberEnrolled'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EnrollClassMember:
      description: Existing User and optional effective interval for enrollment in the route Class.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnrollClassMemberRequest'
          example:
            user_id: ybndrfg8ejkmcpqxot1uwisza3
            start_at: 1785542400000
  responses:
    ClassMemberListOK:
      description: Class Member collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassMemberListResponse'
    ClassMemberEnrolled:
      description: Enrollment or transfer completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassEnrollmentResponse'
  schemas:
    ClassMemberListResponse:
      type: array
      items:
        $ref: '#/components/schemas/ClassMemberResponse'
    ClassEnrollmentResponse:
      type: object
      additionalProperties: false
      required:
        - membership
      properties:
        membership:
          $ref: '#/components/schemas/ClassMemberResponse'
        previous:
          $ref: '#/components/schemas/ClassMemberResponse'
    EnrollClassMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        class_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        academic_period_id:
          type: string
          deprecated: true
          description: Accepted and ignored; destination Class is authoritative.
        user_id:
          $ref: '#/components/schemas/ID'
        start_at:
          type: integer
          format: int64
        end_at:
          type: integer
          format: int64
