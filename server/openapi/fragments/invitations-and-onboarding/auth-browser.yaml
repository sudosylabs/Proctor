paths:
  /api/v1/auth/browser/invitations:
    post:
      operationId: startBrowserInvitation
      summary: Exchange an Invitation claim for a purpose-bound browser acceptance transaction
      description: >-
        Consumes no Invitation yet; it exchanges the one-time claim for a short-lived, same-origin browser handle bound to that exact Invitation purpose. The response omits the original claim and prevents it from entering subsequent browser URLs or logs.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/BrowserInvitationStart'
      responses:
        "201":
          $ref: '#/components/responses/BrowserInvitationStarted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/browser/invitations/accept:
    post:
      operationId: acceptBrowserInvitation
      summary: Accept an account-creating Invitation through its browser transaction
      description: >-
        Creates the invited account and applies the immutable Invitation package through one purpose-bound browser handle. Password and profile inputs are validated, the handle is consumed atomically, and claim or credential material is never returned.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.user_invalid
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.password.invalid
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/BrowserInvitationAcceptance'
      responses:
        "200":
          $ref: '#/components/responses/BrowserInvitationAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/browser/invitations/accept-session:
    post:
      operationId: acceptBrowserInvitationWithSession
      summary: Accept a scoped-role Invitation with the current browser Session
      description: >-
        Applies an eligible scoped Role Invitation to the exact already-authenticated User bound to the browser handle. It never relinks the package to another User and consumes the transaction atomically.
      tags:
        - Invitations and onboarding
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/BrowserInvitationSessionAcceptance'
      responses:
        "200":
          $ref: '#/components/responses/BrowserInvitationAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    BrowserInvitationStart:
      description: One-time Invitation claim to exchange for a short-lived purpose-bound browser handle.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationStartRequest'
          example:
            claim: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    BrowserInvitationAcceptance:
      description: Browser handle plus account credentials and optional profile fields for account-creating acceptance.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationAcceptanceRequest'
          example:
            handle: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            password: Correct-Horse-Battery-Staple-2048!
            username: student-one
            display_name: Student One
            locale: en
            timezone: Europe/Paris
    BrowserInvitationSessionAcceptance:
      description: Purpose-bound browser handle to accept for the exact current Session User.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationSessionAcceptanceRequest'
          example:
            handle: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
  responses:
    BrowserInvitationStarted:
      description: Short-lived browser Invitation transaction created; its second proof is set only as an HttpOnly cookie
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserInvitationStartResponse'
    BrowserInvitationAccepted:
      description: Invitation accepted or its exact durable outcome replayed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAcceptanceResponse'
  schemas:
    BrowserInvitationStartRequest:
      type: object
      additionalProperties: false
      required:
        - claim
      properties:
        claim:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    BrowserInvitationAcceptanceRequest:
      type: object
      additionalProperties: false
      required:
        - handle
        - password
        - username
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        password:
          type: string
        username:
          type: string
        display_name:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        locale:
          type: string
        timezone:
          type: string
    BrowserInvitationSessionAcceptanceRequest:
      type: object
      additionalProperties: false
      required:
        - handle
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    BrowserInvitationStartResponse:
      type: object
      additionalProperties: false
      required:
        - handle
        - purpose
        - requirement
        - expires_at
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        purpose:
          type: string
          enum:
            - student_class
            - teacher_academic_unit
            - academic_unit_role
            - institution_role
        requirement:
          type: string
          enum:
            - account
            - session
        expires_at:
          type: integer
          format: int64
