paths:
  /api/v1/onboarding-imports/{onboarding_import_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    post:
      operationId: cancelOnboardingImport
      summary: Cooperatively cancel an onboarding parse or execution
      description: >-
        Requests cooperative cancellation while the authorized onboarding validation or commit Job remains cancelable. It cannot roll back rows that already committed and preserves the immutable source, preview, and Job history.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/onboarding-imports/<import-id>/cancel' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.invalid_file
        - onboarding_import.unavailable
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
