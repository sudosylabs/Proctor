paths:
  /api/v1/invitations/{invitation_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: revokeInvitation
      summary: Revoke a pending Invitation
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.conflict
        - invitation.mail_unavailable
        - invitation.unavailable
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/MutateInvitation'
      responses:
        "200":
          $ref: '#/components/responses/InvitationAdministrationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
