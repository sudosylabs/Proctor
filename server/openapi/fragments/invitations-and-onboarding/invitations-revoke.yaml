paths:
  /api/v1/invitations/{invitation_id}/revoke:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    post:
      operationId: revokeInvitation
      summary: Revoke a pending Invitation
      description: >-
        Revision-fences and revokes one pending Invitation so its claim and browser transaction can no longer be accepted. The operation retains immutable package and audit history and does not undo an Invitation already accepted.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - invitation.conflict
        - invitation.mail_unavailable
        - invitation.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/MutateInvitation'
      responses:
        "200":
          $ref: '#/components/responses/InvitationAdministrationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
