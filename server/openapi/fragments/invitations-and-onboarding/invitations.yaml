paths:
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: List Invitations within the caller's authorized scope
      description: >-
        Lists bounded safe Invitation metadata visible through the caller's current Institution, Academic Unit, or Class authority. Claims, delivery payloads, recipient secrets, provider state, and acceptance credentials are never returned.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - invitation.query.invalid
        - invitation.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: purpose
          in: query
          required: false
          description: Restrict results to the immutable Invitation workflow that will be accepted.
          schema:
            type: string
            enum:
              - student_class
              - teacher_academic_unit
              - academic_unit_role
              - institution_role
        - name: state
          in: query
          required: false
          description: Restrict results to Invitations in this current lifecycle state.
          schema:
            type: string
            enum:
              - pending
              - accepted
              - revoked
              - expired
              - superseded
        - name: email
          in: query
          required: false
          description: Match the normalized intended recipient email exactly.
          schema:
            type: string
            format: email
        - name: target_id
          in: query
          required: false
          description: Match the exact Class, Academic Unit, or Institution targeted by the Invitation.
          schema:
            $ref: '#/components/schemas/ID'
        - name: created_after
          in: query
          required: false
          description: Return Invitations created at or after this Unix timestamp in milliseconds.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: created_before
          in: query
          required: false
          description: Return Invitations created before this Unix timestamp in milliseconds.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: cursor
          in: query
          required: false
          description: Continue from the opaque cursor returned by the preceding page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Maximum number of Invitations to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          $ref: '#/components/responses/InvitationAdministrationListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/{invitation_id}:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    get:
      operationId: getInvitation
      summary: Get one Invitation within the caller's authorized scope
      description: >-
        Returns one safe immutable Invitation package and lifecycle state when authorized for its exact scope. The projection omits its one-time claim and all mail payload or credential material.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - invitation.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/InvitationAdministrationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/student-class/accept:
    post:
      operationId: acceptStudentClassInvitation
      summary: Accept a student Class Invitation using its one-time claim
      description: >-
        Atomically creates or admits the student account and exact Class enrollment encoded by the claim. The transition rechecks Invitation state, policy, Class eligibility, and effective-period uniqueness before consuming the claim.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.user_invalid
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.password.invalid
      security: []
      requestBody:
        required: true
        description: Supplies the one-time claim and profile credentials used to create or admit the student account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptStudentClassInvitationRequest'
            example:
              claim: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              password: correct-horse-battery-staple-2026
              username: student.one
              display_name: Student One
              locale: en
              timezone: Europe/Paris
      responses:
        "200":
          description: Invitation accepted or replay resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/teacher-academic-unit/accept:
    post:
      operationId: acceptTeacherAcademicUnitInvitation
      summary: Accept a teacher Academic Unit Invitation using its one-time claim
      description: >-
        Atomically applies the immutable teacher relationship and delegated Academic Unit Role package after rechecking current policy and scope validity. The one-time claim is consumed and never becomes a reusable credential.
      tags:
        - Invitations and onboarding
      x-proctor-auth: public
      security: []
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.user_invalid
        - invitation.mail_unavailable
        - invitation.unavailable
        - authentication.password.invalid
      requestBody:
        required: true
        description: Supplies the one-time claim and profile credentials used to create or admit the teacher account.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptTeacherAcademicUnitInvitationRequest'
            example:
              claim: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
              password: careful-teacher-passphrase-2026
              username: teacher.one
              display_name: Teacher One
              locale: en
              timezone: Europe/Paris
      responses:
        "200":
          description: Invitation accepted or replay resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/academic-unit-role/accept:
    post:
      operationId: acceptAcademicUnitRoleInvitation
      summary: Accept an Academic Unit Role Invitation as the authenticated User
      description: >-
        Applies the exact Academic Unit Role package to the authenticated intended User after rechecking scope and policy. Acceptance cannot change the package or transfer it to another account.
      tags:
        - Invitations and onboarding
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        description: Supplies the one-time claim whose immutable Academic Unit Role package will be applied to the current User.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptScopedRoleInvitationRequest'
            example:
              claim: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        "200":
          description: Invitation accepted or exact outcome replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/invitations/institution-role/accept:
    post:
      operationId: acceptInstitutionRoleInvitation
      summary: Accept an Institution Role Invitation as the authenticated User
      description: >-
        Applies the exact Institution Role package to the authenticated intended User after strong current authorization invariants are rechecked. The immutable package cannot be repurposed for another Role or User.
      tags:
        - Invitations and onboarding
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - invitation.invalid
        - invitation.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        description: Supplies the one-time claim whose immutable Institution Role package will be applied to the current User.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptScopedRoleInvitationRequest'
            example:
              claim: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
      responses:
        "200":
          description: Invitation accepted or exact outcome replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptanceResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    InvitationAdministrationListOK:
      description: Bounded authorized Invitation administration page
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationAdministrationListResponse'
  schemas:
    AcceptStudentClassInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - claim
        - password
        - username
      properties:
        claim:
          type: string
          minLength: 43
          maxLength: 43
        password:
          type: string
        username:
          type: string
          maxLength: 64
        display_name:
          type: string
          maxLength: 512
        first_name:
          type: string
          maxLength: 256
        last_name:
          type: string
          maxLength: 256
        locale:
          type: string
          maxLength: 35
        timezone:
          type: string
          maxLength: 64
    AcceptTeacherAcademicUnitInvitationRequest:
      $ref: '#/components/schemas/AcceptStudentClassInvitationRequest'
    AcceptScopedRoleInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - claim
      properties:
        claim:
          type: string
          minLength: 43
          maxLength: 128
    InvitationAdministrationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvitationAdministrationResponse'
        next_cursor:
          type: string
