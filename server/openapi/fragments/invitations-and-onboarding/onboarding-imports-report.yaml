paths:
  /api/v1/onboarding-imports/{onboarding_import_id}/report:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    get:
      operationId: downloadOnboardingImportReport
      summary: Download the authorized formula-safe onboarding report
      description: >-
        Downloads the bounded authorized preview or final row report with spreadsheet formulas neutralized as data. The report excludes credentials, one-time claims, mail payloads, and internal worker diagnostics.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - onboarding_import.conflict
        - onboarding_import.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportReport'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    OnboardingImportReport:
      description: Formula-safe CSV report without recipient or Invitation secret disclosure
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        text/csv:
          schema:
            type: string
            format: binary
