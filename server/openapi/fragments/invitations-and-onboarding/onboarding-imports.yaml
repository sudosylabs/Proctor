paths:
  /api/v1/onboarding-imports:
    post:
      operationId: uploadOnboardingImport
      summary: Upload a bounded onboarding CSV for asynchronous validation
      description: >-
        Stores one bounded formula-safe CSV source and creates a durable validation Job for the explicit mode and authorization scope. Upload performs no account, membership, or Role mutation; the resulting immutable preview must be reviewed and committed separately.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.invalid_file
        - onboarding_import.unavailable
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: mode
          in: query
          required: true
          description: Selects the onboarding workflow and therefore the CSV columns and validation rules to apply.
          schema:
            type: string
            enum:
              - student_class
              - teacher_academic_unit
              - institution
              - academic_administration
        - name: scope_type
          in: query
          required: true
          description: Declares the kind of resource that owns every row in this import.
          schema:
            type: string
            enum:
              - class
              - academic_unit
              - institution
        - name: scope_id
          in: query
          required: true
          description: Identifies the exact Class, Academic Unit, or Institution that owns the import.
          schema:
            $ref: '#/components/schemas/ID'
        - name: role_id
          in: query
          required: false
          description: Role to package into applicable teacher or institution Invitation rows; rejected for modes that do not use Roles.
          schema:
            $ref: '#/components/schemas/ID'
      requestBody:
        required: true
        description: Contains the bounded UTF-8 CSV source to validate; the upload creates only a preview and performs no account or membership mutations.
        content:
          text/csv:
            schema:
              type: string
              format: binary
              maxLength: 10485760
      x-codeSamples:
        - lang: Shell
          label: Upload a student Class roster
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Content-Type: text/csv" \
              --data-binary '@./onboarding.csv' \
              "https://proctor.example.edu/api/v1/onboarding-imports?mode=student_class&scope_type=class&scope_id=ybndrfg8ejkmcpqxot1uwisza3"
      responses:
        "202":
          $ref: '#/components/responses/OnboardingImportAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/onboarding-imports/{onboarding_import_id}:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    get:
      operationId: getOnboardingImport
      summary: Get one authorized immutable onboarding preview or final report projection
      description: >-
        Returns the bounded authorized state, preview digest, and row outcomes for one onboarding import. The projection omits original claims, passwords, mail payloads, internal Job data, and unsafe parsing diagnostics.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - onboarding_import.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/OnboardingImportOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
