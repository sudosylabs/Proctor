paths:
  /api/v1/onboarding-imports/{onboarding_import_id}/commit:
    parameters:
      - $ref: '#/components/parameters/OnboardingImportID'
    post:
      operationId: commitOnboardingImport
      summary: Commit one exact validated onboarding preview
      description: >-
        Starts application of the exact immutable preview only when its revision, digest, and selected commit policy still match. Per-row transactions preserve bounded outcomes, and the operation never accepts an unvalidated or silently changed upload.
      tags:
        - Invitations and onboarding
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - onboarding_import.conflict
        - onboarding_import.invalid_file
        - onboarding_import.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CommitOnboardingImport'
      responses:
        "202":
          $ref: '#/components/responses/OnboardingImportAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CommitOnboardingImport:
      description: Exact immutable preview revision and digest plus the explicit valid-row commit policy.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingImportCommitRequest'
          example:
            expected_revision: 4
            preview_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            policy: require_all_valid
  schemas:
    OnboardingImportCommitRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - preview_digest
        - policy
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        preview_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        policy:
          type: string
          enum:
            - require_all_valid
            - valid_rows_only
