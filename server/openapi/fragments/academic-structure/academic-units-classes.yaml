paths:
  /api/v1/academic-units/{academic_unit_id}/classes:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: searchClasses
      summary: Search Classes owned by an Academic Unit
      tags:
        - Academic structure
      description: >-
        Searches Classes whose Programme hierarchy is owned by the authorized Academic Unit, using bounded stable traversal. Results expose Class structure only and never enroll students or grant Class-scoped permission.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against name and display name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of Classes to return.
      responses:
        "200":
          $ref: '#/components/responses/ClassListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
