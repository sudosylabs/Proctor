paths:
  /api/v1/programmes/{programme_id}/levels:
    parameters:
      - $ref: '#/components/parameters/ProgrammeID'
    get:
      operationId: listProgrammeLevels
      summary: List or search Programme Levels owned by a Programme
      tags:
        - Academic structure
      description: >-
        Lists active Levels directly owned by one authorized Programme with bounded stable search. The collection excludes Classes and does not imply roster or permission access.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against name and display name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of Programme Levels to return.
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeLevelListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProgrammeLevel
      summary: Create a Programme Level owned by a Programme
      tags:
        - Academic structure
      description: >-
        Creates one Level under the exact Programme in the route after rechecking management authority. It does not create Classes, Academic Periods, enrollments, or permission grants.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme_level.invalid
        - programme_level.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateProgrammeLevel'
      responses:
        "201":
          $ref: '#/components/responses/ProgrammeLevelCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateProgrammeLevel:
      description: Canonical and human-facing presentation for a Level owned by the route Programme.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProgrammeLevelRequest'
          example:
            name: level-100
            display_name: Level 100
            description: First year of the programme.
  responses:
    ProgrammeLevelCreated:
      description: Programme Level created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeLevelResponse'
    ProgrammeLevelListOK:
      description: Programme Level collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeLevelListResponse'
  schemas:
    ProgrammeLevelListResponse:
      type: array
      items:
        $ref: '#/components/schemas/ProgrammeLevelResponse'
    CreateProgrammeLevelRequest:
      description: Canonical and human-facing fields for a new Programme Level.
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        programme_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
