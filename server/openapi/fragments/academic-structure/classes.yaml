paths:
  /api/v1/classes/{class_id}:
    parameters:
      - $ref: '#/components/parameters/ClassID'
    get:
      operationId: getClass
      summary: Get a Class using exact Class scope authorization
      tags:
        - Academic structure
      description: >-
        Returns one active Class after authorizing the exact Class resource rather than inferring access from a broader directory read. The projection identifies its Programme Level and Academic Period without including its student roster.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ClassOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateClass
      summary: Update a Class and optionally move its parent references
      tags:
        - Academic structure
      description: >-
        Applies a partial Class update and can change its Programme Level or Academic Period only when both targets remain eligible and authorized. Existing roster history is preserved and cross-period membership invariants are rechecked.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.invalid
        - class.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateClass'
      responses:
        "200":
          $ref: '#/components/responses/ClassOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: archiveClass
      summary: Archive a Class with no active members or role bindings
      tags:
        - Academic structure
      description: >-
        Archives one Class only after proving it has no active members or Role Bindings. The operation retains historical enrollment and audit records and never ends relationships implicitly.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/classes/<class-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/ClassArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateClass:
      description: Partial Class presentation, Programme Level, or Academic Period change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateClassRequest'
          example:
            display_name: Computer Science Level 100 — B
            academic_period_id: ybndrfg8ejkmcpqxot1uwisza3
  responses:
    ClassOK:
      description: Class
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassResponse'
    ClassArchived:
      description: Class archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    UpdateClassRequest:
      description: Mutable Class fields; omitted or null values leave the stored value unchanged.
      type: object
      additionalProperties: false
      properties:
        programme_level_id:
          type:
            - string
            - "null"
          description: Omitted or null leaves the Programme Level unchanged.
        academic_period_id:
          type:
            - string
            - "null"
          description: Omitted or null leaves the Academic Period unchanged.
        name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged.
        display_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged.
        description:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged.
