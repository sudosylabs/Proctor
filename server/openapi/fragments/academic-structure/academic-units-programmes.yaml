paths:
  /api/v1/academic-units/{academic_unit_id}/programmes:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listProgrammes
      summary: List or search Programmes owned by an Academic Unit
      tags:
        - Academic structure
      description: >-
        Lists active Programmes directly owned by one authorized Academic Unit, optionally narrowed by the documented search input. The collection does not include Programmes owned by descendants unless requested through those Units.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against name and display name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of Programmes to return.
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createProgramme
      summary: Create a Programme owned by an Academic Unit
      tags:
        - Academic structure
      description: >-
        Creates one Programme under the exact Academic Unit in the route after rechecking current management authority. Programme creation does not create levels, Classes, enrollments, Roles, or Role Bindings.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme.invalid
        - programme.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateProgramme'
      responses:
        "201":
          $ref: '#/components/responses/ProgrammeCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateProgramme:
      description: Canonical and human-facing presentation for a Programme owned by the route Academic Unit.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProgrammeRequest'
          example:
            name: bsc-computer-science
            display_name: BSc Computer Science
            description: Undergraduate computer science programme.
  responses:
    ProgrammeCreated:
      description: Programme created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeResponse'
    ProgrammeListOK:
      description: Programme collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeListResponse'
  schemas:
    ProgrammeListResponse:
      type: array
      items:
        $ref: '#/components/schemas/ProgrammeResponse'
    CreateProgrammeRequest:
      description: Canonical and human-facing fields for a new Programme.
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        academic_unit_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
