paths:
  /api/v1/academic-units/{academic_unit_id}/programmes:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listProgrammes
      summary: List or search Programmes owned by an Academic Unit
      tags:
        - Academic structure
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against name and display name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProgramme
      summary: Create a Programme owned by an Academic Unit
      tags:
        - Academic structure
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme.invalid
        - programme.conflict
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateProgramme'
      responses:
        "201":
          $ref: '#/components/responses/ProgrammeCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    CreateProgramme:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateProgrammeRequest'
  responses:
    ProgrammeCreated:
      description: Programme created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeResponse'
    ProgrammeListOK:
      description: Programme collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeListResponse'
  schemas:
    ProgrammeListResponse:
      type: array
      items:
        $ref: '#/components/schemas/ProgrammeResponse'
    CreateProgrammeRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        academic_unit_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
