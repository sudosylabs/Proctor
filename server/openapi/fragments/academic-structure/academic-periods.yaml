paths:
  /api/v1/academic-periods:
    get:
      operationId: listAcademicPeriods
      summary: List or search Academic Periods visible through authorized owner scopes
      tags:
        - Academic structure
      description: >-
        Lists Academic Periods visible through the caller's current Institution or Academic Unit authority, with stable owner-aware filtering. Periods describe effective academic time windows and do not themselves grant access to Classes or students.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against name and display name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of visible Academic Periods to return.
      responses:
        "200":
          $ref: '#/components/responses/AcademicPeriodListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAcademicPeriod
      summary: Create an Institution- or Academic-Unit-owned Academic Period
      tags:
        - Academic structure
      description: >-
        Creates one named Academic Period under the exact Institution or Academic Unit owner after terminal scope authorization. The inclusive start and exclusive end are Unix-millisecond instants, and an optional Idempotency-Key makes uncertain retries safe.
      x-proctor-auth: principal_required
      x-proctor-idempotency: optional
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_period.invalid
        - academic_period.conflict
        - administration.unavailable
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/OptionalIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicPeriod'
      responses:
        "201":
          $ref: '#/components/responses/AcademicPeriodCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/academic-periods/{academic_period_id}:
    parameters:
      - $ref: '#/components/parameters/AcademicPeriodID'
    get:
      operationId: getAcademicPeriod
      summary: Get an Academic Period
      tags:
        - Academic structure
      description: >-
        Returns one Academic Period only when its durable owner is visible to the current principal. The response reports its owner and time bounds without implying access to every Class that references it.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicPeriodOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAcademicPeriod
      summary: Update an Academic Period without changing its owner
      tags:
        - Academic structure
      description: >-
        Applies a partial presentation or time-window update while preserving the Period's original owner. The authoritative transition rejects bounds that would invalidate dependent academic structure or conflict with current durable state.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_period.invalid
        - academic_period.conflict
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateAcademicPeriod'
      responses:
        "200":
          $ref: '#/components/responses/AcademicPeriodOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveAcademicPeriod
      summary: Archive an Academic Period with no active Classes or enrollments
      tags:
        - Academic structure
      description: >-
        Archives one Academic Period only after proving that no active Class or enrollment still depends on it. History is retained, and the operation never cascades into Class deletion, membership termination, or student progression.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/academic-periods/<academic-period-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_period.conflict
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/AcademicPeriodArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    AcademicPeriodID:
      name: academic_period_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Academic Period identifier.
  requestBodies:
    CreateAcademicPeriod:
      description: Exact owner, canonical presentation, and Unix-millisecond bounds for a new Academic Period.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicPeriodRequest'
          example:
            owner_type: institution
            owner_id: ybndrfg8ejkmcpqxot1uwisza3
            name: 2026-2027
            display_name: 2026–2027
            start_at: 1785542400000
            end_at: 1817078399000
    UpdateAcademicPeriod:
      description: Partial Academic Period presentation or bounds update; ownership cannot change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateAcademicPeriodRequest'
          example:
            display_name: Academic Year 2026–2027
            end_at: 1819756799000
  responses:
    AcademicPeriodOK:
      description: Academic Period
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicPeriodResponse'
    AcademicPeriodCreated:
      description: Academic Period created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicPeriodResponse'
    AcademicPeriodListOK:
      description: Academic Period collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicPeriodListResponse'
          example: []
    AcademicPeriodArchived:
      description: Academic Period archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    AcademicPeriodResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - create_at
        - update_at
        - delete_at
        - owner_type
        - owner_id
        - name
        - display_name
        - description
        - start_at
        - end_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
        owner_type:
          type: string
          enum:
            - institution
            - academic_unit
        owner_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        start_at:
          type: integer
          format: int64
          minimum: 1
          description: Inclusive start time in Unix milliseconds.
        end_at:
          type: integer
          format: int64
          minimum: 1
          description: Exclusive end time in Unix milliseconds; must be after start_at.
    AcademicPeriodListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AcademicPeriodResponse'
    CreateAcademicPeriodRequest:
      description: Complete owner, presentation, and time window for a new Academic Period.
      type: object
      additionalProperties: false
      required:
        - owner_type
        - owner_id
        - name
        - display_name
        - start_at
        - end_at
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        owner_type:
          type: string
          enum:
            - institution
            - academic_unit
        owner_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        start_at:
          type: integer
          format: int64
          minimum: 1
        end_at:
          type: integer
          format: int64
          minimum: 1
    UpdateAcademicPeriodRequest:
      description: Mutable Academic Period fields; omitted or null values leave the stored value unchanged.
      type: object
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        display_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        description:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        start_at:
          type:
            - integer
            - "null"
          format: int64
          description: Omitted or null leaves the inclusive start unchanged.
        end_at:
          type:
            - integer
            - "null"
          format: int64
          description: Omitted or null leaves the exclusive end unchanged.
