paths:
  /api/v1/academic-units/{academic_unit_id}/children:
    parameters:
      - $ref: '#/components/parameters/AcademicUnitID'
    get:
      operationId: listAcademicUnitChildren
      summary: List an Academic Unit's direct children
      tags:
        - Academic structure
      description: >-
        Lists only the immediate active child Units beneath one authorized Academic Unit. The operation does not recursively flatten the hierarchy or broaden the caller's visibility to concealed descendants.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/AcademicUnitListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAcademicUnitChild
      summary: Create a child Academic Unit
      tags:
        - Academic structure
      description: >-
        Creates one active Unit directly beneath the Academic Unit named by the route. Route scope is authoritative, and current permission is checked against the parent before the hierarchical relationship commits.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - academic_unit.invalid
        - academic_unit.conflict
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateAcademicUnit'
      responses:
        "201":
          $ref: '#/components/responses/AcademicUnitCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
