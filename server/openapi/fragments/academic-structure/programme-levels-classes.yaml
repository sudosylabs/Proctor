paths:
  /api/v1/programme-levels/{programme_level_id}/classes:
    parameters:
      - $ref: '#/components/parameters/ProgrammeLevelID'
    get:
      operationId: listClasses
      summary: List Classes for a Programme Level
      tags:
        - Academic structure
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ClassListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createClass
      summary: Create a Class for a Programme Level and Academic Period
      tags:
        - Academic structure
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.invalid
        - class.conflict
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateClass'
      responses:
        "201":
          $ref: '#/components/responses/ClassCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    CreateClass:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateClassRequest'
  responses:
    ClassCreated:
      description: Class created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassResponse'
  schemas:
    CreateClassRequest:
      type: object
      additionalProperties: false
      required:
        - academic_period_id
        - name
        - display_name
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        programme_level_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        academic_period_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
