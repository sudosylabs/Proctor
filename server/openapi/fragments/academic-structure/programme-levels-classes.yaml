paths:
  /api/v1/programme-levels/{programme_level_id}/classes:
    parameters:
      - $ref: '#/components/parameters/ProgrammeLevelID'
    get:
      operationId: listClasses
      summary: List Classes for a Programme Level
      tags:
        - Academic structure
      description: >-
        Lists active Classes directly assigned to one authorized Programme Level. The collection returns structural Class metadata and excludes rosters, candidate Attempts, and permission grants.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ClassListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createClass
      summary: Create a Class for a Programme Level and Academic Period
      tags:
        - Academic structure
      description: >-
        Creates one concrete student roster under the Programme Level in the route and one eligible Academic Period in the body. Creation performs owner and period checks but does not enroll any student automatically.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - class.invalid
        - class.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreateClass'
      responses:
        "201":
          $ref: '#/components/responses/ClassCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    CreateClass:
      description: Academic Period and canonical presentation for a new Class under the route Programme Level.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateClassRequest'
          example:
            academic_period_id: ybndrfg8ejkmcpqxot1uwisza3
            name: cs-level-100-a
            display_name: Computer Science Level 100 — A
            description: First-year Class A.
  responses:
    ClassCreated:
      description: Class created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassResponse'
  schemas:
    CreateClassRequest:
      description: Academic Period and presentation for a concrete student roster.
      type: object
      additionalProperties: false
      required:
        - academic_period_id
        - name
        - display_name
      properties:
        id:
          type: string
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        create_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        update_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        delete_at:
          type: integer
          format: int64
          deprecated: true
          description: Accepted and ignored for v1 compatibility.
        programme_level_id:
          type: string
          deprecated: true
          description: Accepted and ignored; route scope is authoritative.
        academic_period_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
