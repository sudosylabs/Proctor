paths:
  /api/v1/programme-levels/{programme_level_id}:
    parameters:
      - $ref: '#/components/parameters/ProgrammeLevelID'
    get:
      operationId: getProgrammeLevel
      summary: Get a Programme Level
      tags:
        - Academic structure
      description: >-
        Returns one active Programme Level when its owning Programme hierarchy is visible to the caller. The projection does not expand Classes or confer authority over their rosters.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeLevelOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateProgrammeLevel
      summary: Update a Programme Level without changing its Programme owner
      tags:
        - Academic structure
      description: >-
        Applies a partial canonical or presentation update while preserving the Level's Programme owner. Dependent Classes retain their stable parent identity and block changes that would violate current structure.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme_level.invalid
        - programme_level.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateProgrammeLevel'
      responses:
        "200":
          $ref: '#/components/responses/ProgrammeLevelOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: archiveProgrammeLevel
      summary: Archive a Programme Level that has no active Classes
      tags:
        - Academic structure
      description: >-
        Archives one Programme Level only when it has no active Classes. The transition retains history and never cascades into Class archival, enrollment termination, or Role Binding removal.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request DELETE \
              --url 'https://proctor.example.edu/api/v1/programme-levels/<programme-level-id>' \
              --header 'Authorization: Bearer <token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - programme_level.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/ProgrammeLevelArchived'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateProgrammeLevel:
      description: Partial Programme Level presentation update; its Programme owner cannot change.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateProgrammeLevelRequest'
          example:
            display_name: Level 100
            description: First year of the programme.
  responses:
    ProgrammeLevelOK:
      description: Programme Level
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProgrammeLevelResponse'
    ProgrammeLevelArchived:
      description: Programme Level archived
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
  schemas:
    UpdateProgrammeLevelRequest:
      description: Mutable Programme Level fields; omitted or null values remain unchanged.
      type: object
      additionalProperties: false
      properties:
        name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        display_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
        description:
          type:
            - string
            - "null"
          description: Omitted or null leaves the value unchanged. An empty string is present and subject to validation.
