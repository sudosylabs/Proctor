components:
  parameters:
    AcademicExpectedRevision:
      name: expected_revision
      in: query
      required: false
      description: Optional revision from the last resource response. A stale value returns the resource conflict error without archiving; omission preserves v1 compatibility.
      schema:
        type: integer
        format: int64
        minimum: 1
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Opaque client key. Identical semantic commands replay the committed outcome for at least 24 hours; reuse with different input is a conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._~-]+$
    ProgrammeID:
      name: programme_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Programme identifier.
    ProgrammeLevelID:
      name: programme_level_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Programme Level identifier.
  requestBodies:
    CreateAcademicUnit:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateAcademicUnitRequest'
          example:
            name: computer-science
            display_name: Computer Science
            description: Teaching and research in computing.
      description: >-
        The canonical name and human-facing presentation for a new root Academic Unit. Server-owned identity, timestamps, Institution, and parent fields are ignored when sent for v1 compatibility.
  responses:
    AcademicUnitCreated:
      description: Academic Unit created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitResponse'
    AcademicUnitListOK:
      description: Academic Unit collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcademicUnitListResponse'
    ClassListOK:
      description: Class collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassListResponse'
  schemas:
    AcademicUnitResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - institution_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current aggregate revision. Supply it as expected_revision on an edit or archive to protect a client snapshot from concurrent changes.
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        institution_id:
          $ref: '#/components/schemas/ID'
        parent_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
    AcademicUnitListResponse:
      type: array
      items:
        $ref: '#/components/schemas/AcademicUnitResponse'
    CreateAcademicUnitRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - display_name
      properties:
        name:
          type: string
          description: The owner-scoped canonical machine name.
        display_name:
          type: string
          description: The human-facing Academic Unit name.
        description:
          type: string
          description: An optional human-facing description.
    ProgrammeResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - academic_unit_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current aggregate revision. Supply it as expected_revision on an edit or archive to protect a client snapshot from concurrent changes.
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        academic_unit_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
    ProgrammeLevelResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - programme_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current aggregate revision. Supply it as expected_revision on an edit or archive to protect a client snapshot from concurrent changes.
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        programme_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
    ClassResponse:
      type: object
      additionalProperties: false
      required:
        - revision
        - id
        - created_at
        - updated_at
        - programme_level_id
        - academic_period_id
        - name
        - display_name
        - description
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current aggregate revision. Supply it as expected_revision on an edit or archive to protect a client snapshot from concurrent changes.
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
        programme_level_id:
          $ref: '#/components/schemas/ID'
        academic_period_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
    ClassListResponse:
      type: array
      items:
        $ref: '#/components/schemas/ClassResponse'
