paths:
  /api/v1/users/me/mfa:
    get:
      operationId: getMFAStatus
      summary: Get current-user MFA status
      description: >-
        Returns whether MFA is active, whether a setup is pending, and the count of unused recovery codes for the current User. TOTP secrets and recovery-code values are never returned by this status view.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.mfa.disabled
        - authentication.mfa.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MFAStatusOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/mfa/setup:
    post:
      operationId: setupMFA
      summary: Begin MFA setup
      description: >-
        Creates or replaces a short-lived pending TOTP setup and returns its secret and provisioning URI exactly for enrollment. MFA is not active until a valid code is submitted to the activation operation.
      x-codeSamples:
        - lang: Shell
          label: Begin TOTP enrollment
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/mfa/setup
      tags:
        - Authentication
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.reauthentication_required
        - authentication.mfa.disabled
        - authentication.mfa.not_found
        - authentication.mfa.conflict
        - authentication.mfa.unavailable
        - authentication.internal
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "201":
          $ref: '#/components/responses/MFASetupCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/mfa/activate:
    post:
      operationId: activateMFA
      summary: Activate pending MFA setup
      description: >-
        Verifies a current TOTP code against the pending setup, activates MFA, and returns a new recovery-code set exactly once. An expired or superseded setup cannot be activated.
      tags:
        - Authentication
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.reauthentication_required
        - request.invalid
        - authentication.mfa.invalid_code
        - authentication.mfa.disabled
        - authentication.mfa.not_found
        - authentication.mfa.conflict
        - authentication.mfa.unavailable
        - authentication.internal
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/MFACode'
      responses:
        "200":
          $ref: '#/components/responses/MFAActivationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/mfa/challenge:
    post:
      operationId: challengeMFA
      summary: Upgrade the current session with MFA
      description: >-
        Verifies a current TOTP code or one unused recovery code and upgrades the exact current interactive Session to MFA assurance. A recovery code is consumed atomically and cannot be replayed.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - request.invalid
        - authentication.mfa.invalid_code
        - authentication.mfa.disabled
        - authentication.mfa.not_found
        - authentication.mfa.conflict
        - authentication.mfa.unavailable
        - authentication.internal
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/MFACode'
      responses:
        "200":
          $ref: '#/components/responses/SessionOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/mfa/recovery-codes/regenerate:
    post:
      operationId: regenerateMFARecoveryCodes
      summary: Regenerate MFA recovery codes
      tags:
        - Authentication
      description: >-
        Invalidates the current recovery-code set and returns a new single-use set exactly once. It requires a strong, recently authenticated interactive Session; Personal Access Tokens cannot satisfy that assurance. Store the returned codes securely because Proctor does not expose them again.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --fail-with-body \
              --request POST \
              --url 'https://proctor.example.edu/api/v1/users/me/mfa/recovery-codes/regenerate' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'Accept: application/json'
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
        - authentication.mfa.disabled
        - authentication.mfa.not_found
        - authentication.mfa.conflict
        - authentication.mfa.unavailable
        - authentication.internal
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/MFARecoveryCodesOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/mfa/disable:
    post:
      operationId: disableMFA
      summary: Disable current-user MFA
      description: >-
        Disables MFA for the current User after strong recent authentication and invalidates pending setup material and recovery codes. The transition is audited and may be blocked by current policy.
      x-codeSamples:
        - lang: Shell
          label: Disable MFA
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/mfa/disable
      tags:
        - Authentication
      x-proctor-auth: strong_recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.strong_required
        - authentication.reauthentication_required
        - authentication.mfa.disabled
        - authentication.mfa.not_found
        - authentication.mfa.conflict
        - authentication.mfa.unavailable
        - audit.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "501":
          $ref: '#/components/responses/NotImplemented'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    MFACode:
      required: true
      description: Supplies a current TOTP code or, where permitted, one unused recovery code; clients must treat the value as sensitive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFACodeRequest'
          example:
            code: "123456"
  responses:
    SessionOK:
      description: Session
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionResponse'
    MFAStatusOK:
      description: MFA status
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFAStatusResponse'
    MFASetupCreated:
      description: Pending MFA setup
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFASetupResponse'
    MFAActivationOK:
      description: MFA activated
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFAActivationResponse'
    MFARecoveryCodesOK:
      description: New MFA recovery codes
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARecoveryCodesResponse'
    NotImplemented:
      description: Capability is not enabled
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    MFACodeRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
    MFARecoveryCodesResponse:
      type: object
      additionalProperties: false
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    MFASetupResponse:
      type: object
      additionalProperties: false
      required:
        - secret
        - provisioning_uri
        - expires_at
      properties:
        secret:
          type: string
        provisioning_uri:
          type: string
          format: uri
        expires_at:
          type: integer
          format: int64
    MFAActivationResponse:
      type: object
      additionalProperties: false
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          items:
            type: string
    MFAStatusResponse:
      type: object
      additionalProperties: false
      required:
        - enabled
        - pending
        - recovery_codes_remaining
      properties:
        enabled:
          type: boolean
        pending:
          type: boolean
        pending_expires_at:
          type: integer
          format: int64
        recovery_codes_remaining:
          type: integer
          minimum: 0
