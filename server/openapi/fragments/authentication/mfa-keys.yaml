paths:
  /api/v1/mfa/keys:
    get:
      operationId: inspectMFAKeyState
      summary: Inspect the MFA key ring and the live secrets each key seals
      tags:
        - Authentication
      description: >-
        Returns the non-secret identifier of this node's configured MFA primary key, the primary-key fence that the last rekey installed, and, per sealing key, how many live TOTP secrets it seals and whether this node's ring holds it. Use it to plan a rotation and to confirm a retiring key seals nothing before removing it from configuration. No key bytes, ciphertext, or account identities are returned.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - authentication.mfa.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MFAKeyStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mfa/rekey:
    post:
      operationId: startMFARekey
      summary: Start a durable fenced rotation of the MFA secret key
      tags:
        - Authentication
      description: >-
        Fences the MFA key ring on this node's configured primary key and starts one durable Job that re-seals every live TOTP secret from other keys to it, one credential at a time under a compare-and-swap on its key identity. The Job resumes from its checkpoint after a crash or lease loss. A rekey is refused while another is queued or running, and the fence moves to a different primary only after the previous rekey proved that no live secret needs another key. From the fence onwards every node must seal new secrets with the fenced primary.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - authentication.mfa.rekey.invalid
        - authentication.mfa.rekey.conflict
        - authentication.mfa.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/StartMFARekey'
      responses:
        "202":
          $ref: '#/components/responses/MFARekeyAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mfa/rekey/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The durable MFA rekey Job whose safe progress is requested.
    get:
      operationId: getMFARekeyStatus
      summary: Inspect safe progress and final retirement proof for one MFA rekey Job
      tags:
        - Authentication
      description: >-
        Returns bounded progress for one MFA rekey Job and, after it succeeds, the live-secret counts that prove the retiring key seals nothing and may be removed from configuration. A Job of another type is not found. No secrets, ciphertext, account identities, key bytes, or worker diagnostics are returned.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - authentication.mfa.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MFARekeyStatusOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    StartMFARekey:
      description: Identifies the configured non-primary MFA key that this rotation must retire.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARekeyRequest'
          example:
            retiring_key_id: "0123456789abcdef0123456789abcdef"
  responses:
    MFAKeyStateOK:
      description: MFA key-ring identities, fence, and live-secret counts
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFAKeyStateResponse'
    MFARekeyAccepted:
      description: Durable fenced MFA key rotation accepted
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARekeyResponse'
    MFARekeyStatusOK:
      description: Safe MFA rekey progress and final retirement proof
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MFARekeyStatusResponse'
  schemas:
    MFASecretKeyUsage:
      description: Live TOTP secrets sealed with one MFA key.
      type: object
      additionalProperties: false
      required:
        - key_id
        - credentials
        - configured
      properties:
        key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Non-secret 128-bit key identifier encoded as lowercase hexadecimal.
        credentials:
          type: integer
          format: int64
          minimum: 1
          description: Number of live MFA credentials whose secret this key seals.
        configured:
          type: boolean
          description: Whether this node's configured MFA key ring holds the key.
    MFAKeyStateResponse:
      description: MFA key-ring identities, the durable primary-key fence, and live-secret counts.
      type: object
      additionalProperties: false
      required:
        - primary_key_id
        - active
      properties:
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Identifier of the key this node uses for new MFA secrets.
        required_primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Primary key the last rekey fenced; every node must seal new secrets with it. Absent before the first rekey.
        active_rekey_job_id:
          $ref: '#/components/schemas/ID'
        active:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/MFASecretKeyUsage'
          description: Keys that seal at least one live MFA secret, ordered by identifier.
    MFARekeyRequest:
      description: Exact retiring-key selection for a new fenced MFA rotation Job.
      type: object
      additionalProperties: false
      required:
        - retiring_key_id
      properties:
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Non-secret identifier of the configured MFA key to retire; it must not be the primary key.
    MFARekeyResponse:
      description: Durable identities created when the MFA rotation Job is accepted.
      type: object
      additionalProperties: false
      required:
        - job_id
        - primary_key_id
        - retiring_key_id
        - created_at
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        created_at:
          type: string
          format: date-time
          description: Time when the rekey Job was created.
    MFARekeyProgress:
      description: Coarse bounded progress while live MFA secrets are re-sealed.
      type: object
      additionalProperties: false
      required:
        - current
        - total
        - stage
      properties:
        current:
          type: integer
          format: int64
          minimum: 0
          description: Credentials examined so far.
        total:
          type: integer
          format: int64
          minimum: 1
          description: Credentials in the processing set.
        stage:
          type: string
          enum:
            - resealing
    MFARekeyProof:
      description: Final live-secret counts used to decide whether the retiring key may be removed.
      type: object
      additionalProperties: false
      required:
        - non_primary_references
        - retiring_references
        - retirement_safe
      properties:
        non_primary_references:
          type: integer
          format: int64
          minimum: 0
          description: Live MFA secrets sealed with any non-primary key after processing.
        retiring_references:
          type: integer
          format: int64
          minimum: 0
          description: Live MFA secrets still sealed with the exact retiring key.
        retirement_safe:
          type: boolean
          description: True only when the final counts prove the retiring key can be removed.
    MFARekeyStatusResponse:
      description: Safe Job status, progress, and optional final key-retirement proof.
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - primary_key_id
        - retiring_key_id
        - created_at
        - updated_at
        - attempt_count
        - maximum_attempts
        - processed
        - resealed
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
        status:
          $ref: '#/components/schemas/JobStatus'
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        public_error_code:
          type: string
          maxLength: 128
        attempt_count:
          type: integer
          minimum: 0
        maximum_attempts:
          type: integer
          minimum: 1
        processed:
          type: integer
          format: int64
          minimum: 0
        resealed:
          type: integer
          format: int64
          minimum: 0
        progress:
          $ref: '#/components/schemas/MFARekeyProgress'
        proof:
          $ref: '#/components/schemas/MFARekeyProof'
