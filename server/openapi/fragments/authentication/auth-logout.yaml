paths:
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.internal
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
