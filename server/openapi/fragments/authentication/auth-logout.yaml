paths:
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: >-
        Revokes the exact interactive Session represented by the current access credential and clears browser authentication cookies when present. Other Sessions for the User remain active.
      x-codeSamples:
        - lang: Shell
          label: Revoke the current Session
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/auth/logout
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.internal
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
