paths:
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh credentials
      tags:
        - Authentication
      x-proctor-auth: refresh_credential_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.session.invalid
        - authentication.internal
      x-proctor-idempotency: none
      security:
        - refreshBearerAuth: []
        - refreshCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AuthenticationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
