paths:
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh credentials
      description: >-
        Atomically rotates the current Session's refresh credential and returns a fresh access/refresh pair or browser cookies. A Desktop-bound refresh credential must use the DPoP authorization scheme and a fresh proof bound to its registered key and current server nonce. Reuse of a consumed refresh credential is treated as replay and invalidates the affected Session family.
      x-codeSamples:
        - lang: Shell
          label: Rotate a native-client refresh token
          source: |-
            curl --request POST \
              --header "Authorization: DPoP $PROCTOR_REFRESH_TOKEN" \
              --header "DPoP: $PROCTOR_DPOP_PROOF" \
              https://proctor.example.edu/api/v1/auth/refresh
      tags:
        - Authentication
      x-proctor-auth: refresh_credential_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.session.invalid
        - authentication.internal
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      x-proctor-idempotency: none
      security:
        - refreshBearerAuth: []
        - refreshDPoPAuth: []
        - refreshCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/AuthenticationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
