paths:
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset message
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/RequestPasswordReset'
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      summary: Consume a password-reset credential
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.password.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CompletePasswordReset'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    RequestPasswordReset:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'
    CompletePasswordReset:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetCompletionRequest'
  schemas:
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
