paths:
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset message
      description: >-
        Requests a short-lived password-reset message for the supplied email address when an eligible local account exists. The accepted response is intentionally identical for known and unknown addresses to prevent account discovery.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/RequestPasswordReset'
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      summary: Consume a password-reset credential
      description: >-
        Consumes one valid short-lived reset token, applies the new policy-compliant password, and revokes affected Sessions according to the authentication contract. Expired, replayed, or superseded credentials are rejected without exposing account state.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.password.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.account_token.invalid
        - authentication.account_recovery.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/CompletePasswordReset'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    RequestPasswordReset:
      required: true
      description: Supplies the account email address to which an eligible password-reset message should be sent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetRequest'
          example:
            email: student.one@example.edu
    CompletePasswordReset:
      required: true
      description: Supplies the one-time reset token and the replacement password, both of which must be treated as secrets by clients and logs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PasswordResetCompletionRequest'
          example:
            token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            password: correct-horse-battery-staple-2026
  schemas:
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    PasswordResetCompletionRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
