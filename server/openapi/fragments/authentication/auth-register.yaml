paths:
  /api/v1/auth/register:
    post:
      operationId: registerLocalUser
      summary: Register one unverified local account when current policy permits
      description: >-
        Creates one unverified local account only when the current Access Policy permits public registration. Registration does not grant institutional affiliation or authorization, and a verification message is sent without returning credential material.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.password.invalid
        - authentication.registration.invalid
        - authentication.registration.invitation_required
        - authentication.registration.unavailable
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/PublicRegistration'
      responses:
        "202":
          $ref: '#/components/responses/SensitiveAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    PublicRegistration:
      required: true
      description: Supplies the new account's unique username, normalized email address, and policy-compliant local password.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicRegistrationRequest'
          example:
            username: student.one
            email: student.one@example.edu
            password: correct-horse-battery-staple-2026
  schemas:
    PublicRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
