paths:
  /api/v1/auth/desktop/authorizations:
    post:
      operationId: startDesktopAuthorization
      summary: Create a purpose-bound Desktop browser authorization transaction
      description: >-
        Starts a short-lived browser handoff for a Desktop client, binding the callback, opaque state, selected authentication method, device presentation, and S256 PKCE challenge. No Session is created until the browser approves the transaction and the Desktop client exchanges the one-use code.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.desktop_authorization.invalid
        - authentication.desktop_authorization.disabled
        - authentication.desktop_authorization.rejected
        - authentication.desktop_authorization.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/DesktopAuthorizationStart'
      responses:
        "201":
          $ref: '#/components/responses/DesktopAuthorizationStarted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/desktop/authorizations/approve:
    post:
      operationId: approveDesktopAuthorization
      summary: Approve a Desktop transaction with the current browser Session
      description: >-
        Uses the current interactive browser Session to approve the exact pending Desktop transaction identified by its handle, browser proof, and state. Approval issues a short-lived one-use code without exposing browser credentials to the Desktop client.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - request.invalid
        - authentication.desktop_authorization.invalid
        - authentication.desktop_authorization.rejected
        - authentication.desktop_authorization.unavailable
        - audit.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/DesktopAuthorizationProof'
      responses:
        "200":
          $ref: '#/components/responses/DesktopAuthorizationApproved'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/desktop/authorizations/cancel:
    post:
      operationId: cancelDesktopAuthorization
      summary: Cancel one pending Desktop browser authorization transaction
      description: >-
        Cancels the exact pending Desktop transaction after validating its handle, browser proof, and state. Cancellation is terminal and prevents a later approval or token exchange for that transaction.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.desktop_authorization.invalid
        - authentication.desktop_authorization.rejected
        - authentication.desktop_authorization.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/DesktopAuthorizationProof'
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/desktop/token:
    post:
      operationId: exchangeDesktopAuthorizationCode
      summary: Atomically exchange one Desktop code and S256 verifier for an ordinary Desktop Session
      description: >-
        Consumes the one-use Desktop authorization code only when the opaque state and PKCE verifier match the original transaction. A successful exchange creates an ordinary bounded Desktop Session; replay or mismatched proof is rejected.
      tags:
        - Authentication
      x-proctor-auth: public
      x-proctor-error-codes:
        - request.invalid
        - authentication.rate_limited
        - authentication.rate_limit_unavailable
        - authentication.desktop_authorization.invalid
        - authentication.desktop_authorization.rejected
        - authentication.desktop_authorization.unavailable
        - authentication.sessions.maximum_reached
        - audit.unavailable
      x-proctor-idempotency: none
      security: []
      requestBody:
        $ref: '#/components/requestBodies/DesktopAuthorizationExchange'
      responses:
        "200":
          $ref: '#/components/responses/AuthenticationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "429":
          $ref: '#/components/responses/TooManyRequests'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    DesktopAuthorizationStart:
      required: true
      description: Declares the trusted loopback callback, anti-forgery state, S256 PKCE challenge, authentication method, and optional device presentation for the Desktop handoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopAuthorizationStartRequest'
          example:
            callback_url: http://127.0.0.1:49152/callback
            state: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            code_challenge: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            authentication_method: password
            device_id: exam-laptop-01
            device_name: Exam laptop
    DesktopAuthorizationProof:
      required: true
      description: Proves possession of the browser-facing transaction values before approving or cancelling the exact pending Desktop handoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopAuthorizationProofRequest'
          example:
            handle: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            browser_proof: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
            state: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
    DesktopAuthorizationExchange:
      required: true
      description: Supplies the one-use authorization code, original state, and PKCE verifier required to create the Desktop Session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopAuthorizationExchangeRequest'
          example:
            code: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            state: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
            code_verifier: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
  responses:
    DesktopAuthorizationStarted:
      description: Desktop browser authorization transaction created
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopAuthorizationStartResponse'
    DesktopAuthorizationApproved:
      description: One-use Desktop code issued
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DesktopAuthorizationApprovalResponse'
  schemas:
    DesktopAuthorizationStartRequest:
      type: object
      additionalProperties: false
      required:
        - callback_url
        - state
        - code_challenge
        - authentication_method
      properties:
        callback_url:
          type: string
          format: uri
        state:
          type: string
          minLength: 43
          maxLength: 128
        code_challenge:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        authentication_method:
          type: string
          minLength: 1
          maxLength: 64
        provider_id:
          type: string
          maxLength: 64
        device_id:
          type: string
          maxLength: 128
        device_name:
          type: string
          maxLength: 128
    DesktopAuthorizationProofRequest:
      type: object
      additionalProperties: false
      required:
        - handle
        - browser_proof
        - state
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        browser_proof:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        state:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
    DesktopAuthorizationExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - state
        - code_verifier
      properties:
        code:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        state:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: ^[A-Za-z0-9._~-]+$
    DesktopAuthorizationStartResponse:
      type: object
      additionalProperties: false
      required:
        - authorization_url
        - expires_at
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: integer
          format: int64
    DesktopAuthorizationApprovalResponse:
      type: object
      additionalProperties: false
      required:
        - redirect_url
        - expires_at
      properties:
        redirect_url:
          type: string
          format: uri
        expires_at:
          type: integer
          format: int64
