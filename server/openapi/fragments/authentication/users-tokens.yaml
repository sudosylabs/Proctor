paths:
  /api/v1/users/me/tokens:
    get:
      operationId: listPersonalAccessTokens
      summary: List current-user Personal Access Tokens
      description: >-
        Returns safe metadata for the current User's Personal Access Tokens, including scope, expiry, and lifecycle state. The token credential is returned only once at creation and never appears in this list.
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - personal_access_token.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createPersonalAccessToken
      summary: Create a Personal Access Token
      description: >-
        Creates a bounded Personal Access Token after recent interactive authentication and returns its credential exactly once. Requested scopes and any Academic Unit boundary are validated against current authority and policy.
      tags:
        - Authentication
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - personal_access_token.invalid
        - personal_access_token.maximum_reached
        - personal_access_token.unavailable
        - audit.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/CreatePersonalAccessToken'
      responses:
        "201":
          $ref: '#/components/responses/PersonalAccessTokenCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/tokens/{personal_access_token_id}/disable:
    parameters:
      - $ref: '#/components/parameters/PersonalAccessTokenID'
    post:
      operationId: disablePersonalAccessToken
      summary: Disable a Personal Access Token
      description: >-
        Temporarily disables the exact current-User Personal Access Token so its credential can no longer authenticate. The token record and audit history remain available for later review or re-enablement.
      x-codeSamples:
        - lang: Shell
          label: Disable a Personal Access Token
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/ybndrfg8ejkmcpqxot1uwisza3/disable
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - request.invalid
        - resource.not_found
        - personal_access_token.unavailable
        - audit.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/tokens/{personal_access_token_id}/enable:
    parameters:
      - $ref: '#/components/parameters/PersonalAccessTokenID'
    post:
      operationId: enablePersonalAccessToken
      summary: Enable a Personal Access Token
      description: >-
        Re-enables a disabled, unexpired Personal Access Token after recent interactive authentication and a fresh scope-authority check. Revoked tokens cannot be enabled.
      x-codeSamples:
        - lang: Shell
          label: Enable a Personal Access Token
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/ybndrfg8ejkmcpqxot1uwisza3/enable
      tags:
        - Authentication
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - personal_access_token.maximum_reached
        - personal_access_token.unavailable
        - audit.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/PersonalAccessTokenOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/tokens/{personal_access_token_id}:
    parameters:
      - $ref: '#/components/parameters/PersonalAccessTokenID'
    delete:
      operationId: revokePersonalAccessToken
      summary: Revoke a Personal Access Token
      description: >-
        Permanently revokes the exact Personal Access Token belonging to the current User. Revocation is durable and audited; the credential cannot be restored or exchanged for a replacement.
      x-codeSamples:
        - lang: Shell
          label: Revoke a Personal Access Token
          source: |-
            curl --request DELETE \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              https://proctor.example.edu/api/v1/users/me/tokens/ybndrfg8ejkmcpqxot1uwisza3
      tags:
        - Authentication
      x-proctor-auth: session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - request.invalid
        - resource.not_found
        - personal_access_token.unavailable
        - audit.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          $ref: '#/components/responses/SensitiveNoContent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    PersonalAccessTokenID:
      name: personal_access_token_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
      description: The Personal Access Token record identifier; this is not the token secret.
  requestBodies:
    CreatePersonalAccessToken:
      required: true
      description: Declares the human-facing purpose, bounded scopes, optional Academic Unit boundary, and absolute expiry for the new token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatePersonalAccessTokenRequest'
          example:
            description: Read examination schedules from the registrar tool
            scopes:
              - examinations:read
            academic_unit_id: ybndrfg8ejkmcpqxot1uwisza3
            expires_at: 1798761600000
  responses:
    PersonalAccessTokenOK:
      description: Personal Access Token
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenResponse'
    PersonalAccessTokenCreated:
      description: Personal Access Token with one-time credential
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenCreationResponse'
    PersonalAccessTokenListOK:
      description: Personal Access Token collection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PersonalAccessTokenListResponse'
  schemas:
    CreatePersonalAccessTokenRequest:
      type: object
      additionalProperties: false
      required:
        - description
        - scopes
        - expires_at
      properties:
        description:
          type: string
        scopes:
          type: array
          items:
            type: string
        academic_unit_id:
          $ref: '#/components/schemas/ID'
        expires_at:
          type: integer
          format: int64
    PersonalAccessTokenResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - create_at
        - update_at
        - delete_at
        - user_id
        - description
        - scopes
        - expires_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        create_at:
          type: integer
          format: int64
        update_at:
          type: integer
          format: int64
        delete_at:
          type: integer
          format: int64
        user_id:
          $ref: '#/components/schemas/ID'
        description:
          type: string
        scopes:
          type: array
          items:
            type: string
        academic_unit_id:
          $ref: '#/components/schemas/ID'
        expires_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
        disabled_at:
          type: integer
          format: int64
        revoked_at:
          type: integer
          format: int64
    PersonalAccessTokenCreationResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - credential
      properties:
        token:
          $ref: '#/components/schemas/PersonalAccessTokenResponse'
        credential:
          type: string
    PersonalAccessTokenListResponse:
      type: array
      items:
        $ref: '#/components/schemas/PersonalAccessTokenResponse'
