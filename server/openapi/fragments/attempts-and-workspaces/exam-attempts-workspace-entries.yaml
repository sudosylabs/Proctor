paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/entries/{attempt_workspace_entry_id}:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/AttemptWorkspaceEntryID'
    patch:
      operationId: moveCandidateExamWorkspaceEntry
      summary: Rename or move one Workspace entry
      description: >-
        Atomically renames or moves the exact file or directory from its expected canonical path to a new canonical path in the active Workspace. Stale paths, invalid descendants, and destination conflicts fail without partially changing the manifest.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_unavailable
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.path_conflict
        - exam.attempt.workspace.entry_conflict
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/MoveCandidateWorkspaceEntry'
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteCandidateExamWorkspaceEntry
      summary: Delete a Workspace entry or a guarded directory subtree
      description: >-
        Deletes the exact Workspace entry only when its expected path and, for files, required content version still match. A directory must be empty unless recursive is true. Recursive deletion requires the expected_workspace_cursor from the client's manifest, rejects any intervening Workspace change, and atomically removes the directory and all descendants with one recursive journal record. Other mutations do not require a Workspace cursor.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_unavailable
        - exam.attempt.state_conflict
        - exam.attempt.connection_closed
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - exam.attempt.workspace.path_conflict
        - exam.attempt.workspace.entry_conflict
        - exam.attempt.workspace.content_conflict
        - exam.attempt.workspace.directory_not_empty
        - exam.attempt.workspace.cursor_conflict
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/DeleteCandidateWorkspaceEntry'
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceMutationOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    MoveCandidateWorkspaceEntry:
      required: true
      description: Supplies the active Participation generation, expected current path, and canonical destination path for the atomic move.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MoveCandidateWorkspaceEntryRequest'
          example:
            participation_id: ybndrfg8ejkmcpqxot1uwisza3
            generation: 2
            expected_path: answers/draft.txt
            destination_path: answers/final.txt
    DeleteCandidateWorkspaceEntry:
      required: true
      description: Supplies the active Participation generation and expected entry state that must still match before deletion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteCandidateWorkspaceEntryRequest'
          example:
            participation_id: ybndrfg8ejkmcpqxot1uwisza3
            generation: 2
            expected_path: answers/draft.txt
            expected_content_version: ybndrfg8ejkmcpqxot1uwisza4
  schemas:
    MoveCandidateWorkspaceEntryRequest:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_path
        - destination_path
      properties:
        participation_id:
          $ref: '#/components/schemas/ID'
        generation:
          type: integer
          format: int64
          minimum: 1
        expected_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
        destination_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
    DeleteCandidateWorkspaceEntryRequest:
      type: object
      additionalProperties: false
      required:
        - participation_id
        - generation
        - expected_path
      properties:
        participation_id:
          $ref: '#/components/schemas/ID'
        generation:
          type: integer
          format: int64
          minimum: 1
        expected_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
        expected_content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
          description: Required for file deletion; omitted for directories.
        recursive:
          type: boolean
          default: false
          description: Delete this directory and every descendant atomically. Requires expected_workspace_cursor and cannot be used for a file.
        expected_workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          description: Required only when recursive is true. The complete Workspace cursor observed by the client; any intervening mutation causes a conflict.
      allOf:
        - if:
            required: [recursive]
            properties:
              recursive:
                const: true
          then:
            required: [expected_workspace_cursor]
            not:
              required: [expected_content_version]
          else:
            not:
              required: [expected_workspace_cursor]
