paths:
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: browserSourceList
      summary: List owned Participation Browser sources
      description: >-
        Return at most 49 source statuses in successful start order, bounded at 1 MiB, for one owned
        Participation. Current registered-key ownership is required; any live source also requires current
        Connection continuity. This is source recovery, not Browser Activity history access.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.not_found
        - exam.attempt.registered_desktop_required
        - exam.attempt.continuity_invalid
        - exam.attempt.connection_closed
        - exam.attempt.connection_lost
        - exam.attempt.sitting_unavailable
        - exam.attempt.unavailable
        - exam.delivery.upload_expired
        - exam.delivery.declaration_conflict
        - exam.delivery.sequence_limit
        - exam.delivery.missing_interval_limit
        - exam.delivery.detail_budget_exhausted
        - exam.delivery.metadata_capacity
        - exam.delivery.control_rate_limited
        - exam.delivery.summary_rate_limited
        - idempotency.conflict
        - idempotency.in_progress
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/NativeDeliveryCredential'
        - $ref: '#/components/parameters/NativeDeliveryConnectionID'
        - name: participation_id
          in: query
          required: true
          description: Owned Participation whose bounded source inventory is requested.
          schema:
            $ref: '#/components/schemas/ID'
      responses:
        '200':
          $ref: '#/components/responses/BrowserSourceListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/NativeDeliveryExpired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    get:
      operationId: browserSourceStatus
      summary: Recover an owned Browser source
      description: >-
        Read the current immutable Browser source identity, source counters and delivery closure after an
