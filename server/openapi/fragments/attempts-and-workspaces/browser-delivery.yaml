  /api/v1/exam-attempts/{exam_attempt_id}/browser-activity/sources/{source_session_id}/events:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
      - $ref: '#/components/parameters/BrowserSourceSessionID'
    post:
      operationId: appendHistoricalBrowserDelivery
      summary: Upload retained events for a closed Browser source
      description: >-
        Requires current registered-key ownership of an already closed source and its immutable policy
        revision/digest. Old candidate Connection headers are rejected. Original per-event receipts survive
        repacking; receipt progress remains distinct from settled gaps. The upload deadline and final declared
        boundary are immutable.
      tags:
