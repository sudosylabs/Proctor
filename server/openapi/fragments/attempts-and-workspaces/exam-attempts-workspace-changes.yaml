paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/changes:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listCandidateExamWorkspaceChanges
      summary: List ordered acknowledged Workspace changes
      description: >-
        Returns acknowledged Workspace mutations after the supplied journal cursor in strict order for the active candidate Attempt. If retained history can no longer bridge the cursor, the response explicitly instructs the client to reload the full manifest.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_unavailable
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - name: after_cursor
          in: query
          required: false
          description: Return acknowledged changes strictly after this Workspace journal cursor; zero starts at the retained beginning.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of ordered Workspace journal entries to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceJournalOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    CandidateWorkspaceJournalOK:
      description: Bounded ordered acknowledged Workspace changes or an explicit full-refresh signal
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateWorkspaceJournalResponse'
  schemas:
    CandidateWorkspaceJournalEntryResponse:
      type: object
      additionalProperties: false
      required:
        - cursor
        - entry_id
        - kind
        - operation
        - changed_at
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 1
        entry_id:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          enum:
            - file
            - directory
        operation:
          type: string
          enum:
            - create_file
            - create_directory
            - replace_file
            - move_entry
            - delete_entry
        old_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
        new_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
        content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
        changed_at:
          type: string
          format: date-time
    CandidateWorkspaceJournalResponse:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - current_cursor
        - entries
        - has_more
        - refresh_required
      properties:
        workspace_id:
          $ref: '#/components/schemas/ID'
        current_cursor:
          type: integer
          format: int64
          minimum: 0
        entries:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CandidateWorkspaceJournalEntryResponse'
        has_more:
          type: boolean
        refresh_required:
          type: boolean
