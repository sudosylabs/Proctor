paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace/changes:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listCandidateExamWorkspaceChanges
      summary: List ordered acknowledged Workspace changes
      description: >-
        Returns acknowledged Workspace mutations after the supplied workspace_cursor in strict order for the active candidate Attempt. If retained history can no longer bridge the cursor, the response explicitly instructs the client to reload the full manifest.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_not_open
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
        - exam.attempt.registered_desktop_required
        - exam.delivery.metadata_capacity
        - authentication.required
        - authentication.token_invalid
        - authentication.credential_ambiguous
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - name: workspace_cursor
          in: query
          required: false
          description: Start the listing with changes strictly after this Workspace Cursor; zero or omission starts at the retained beginning. Omit it when continuing with cursor.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        "200":
          $ref: '#/components/responses/CandidateWorkspaceJournalOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    CandidateWorkspaceJournalOK:
      description: Bounded ordered acknowledged Workspace changes or an explicit full-refresh signal
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateWorkspaceJournalResponse'
  schemas:
    CandidateWorkspaceJournalEntryResponse:
      type: object
      additionalProperties: false
      required:
        - cursor
        - entry_id
        - kind
        - operation
        - changed_at
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 1
        entry_id:
          $ref: '#/components/schemas/ID'
        kind:
          type: string
          enum:
            - file
            - directory
        operation:
          type: string
          enum:
            - create_file
            - create_directory
            - replace_file
            - move_entry
            - delete_entry
        old_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
        new_path:
          $ref: '#/components/schemas/StarterWorkspacePath'
        content_version:
          $ref: '#/components/schemas/WorkspaceContentVersion'
        changed_at:
          type: string
          format: date-time
        recursive:
          type: boolean
          description: When true, this directory deletion removes old_path and all descendants whose paths start with old_path followed by a slash. Clients apply the entire subtree removal at this one cursor.
    CandidateWorkspaceJournalResponse:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - current_cursor
        - items
        - refresh_required
      properties:
        workspace_id:
          $ref: '#/components/schemas/ID'
        current_cursor:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CandidateWorkspaceJournalEntryResponse'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        refresh_required:
          type: boolean
