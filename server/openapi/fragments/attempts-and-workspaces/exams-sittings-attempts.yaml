paths:
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
    get:
      operationId: listExamAttempts
      summary: List bounded candidate Attempts for one Exam Sitting
      description: >-
        Lists manager-safe Attempt projections for the exact Exam Sitting after rechecking current scope authority. Results may be filtered by lifecycle state and omit candidate credentials, answer content, private integrity evidence, and internal lease material.
      tags:
        - Attempts and workspaces
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: state
          in: query
          required: false
          description: Repeated distinct Attempt states.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            uniqueItems: true
            items:
              $ref: '#/components/schemas/ExamAttemptState'
        - name: limit
          in: query
          required: false
          description: Maximum number of manager-safe Exam Attempt projections to return in this page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque versioned cursor over descending creation time and Attempt identity; clients return it unchanged.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamAttemptManagerListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: getExamAttempt
      summary: Get one manager-safe Exam Attempt projection
      description: >-
        Returns one Attempt only after verifying its Exam and Sitting path ownership and the caller's current management authority. The projection exposes operational state but omits candidate credentials, answer content, and private evidence.
      tags:
        - Attempts and workspaces
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamAttemptManagerOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/browser-activity:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listExamAttemptBrowserActivity
      summary: List privacy-minimized Browser Activity for one managed Attempt
      description: >-
        Returns a no-store keyset page of minimized top-level browser navigation records after resolving the exact nested Attempt and checking the dedicated Browser Activity view authority. Session, Connection, Desktop Registration, credentials, page content, and private Review state are excluded.
      tags:
        - Attempts and workspaces
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of minimized Browser Activity records to return in this keyset page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque versioned keyset cursor; return it unchanged and do not infer Browser location data from it.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/BrowserActivityListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/sittings/{exam_sitting_id}/attempts/{exam_attempt_id}/reallow:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamSittingID'
      - $ref: '#/components/parameters/ExamAttemptID'
    post:
      operationId: reallowExamAttempt
      summary: Re-allow one exact suspended Exam Attempt
      tags:
        - Attempts and workspaces
      description: >-
        Closes only the identified active suspension episode and moves the Attempt to ready. It preserves integrity evidence and creates no continuity credential, Participation, Session binding, or Connection; the candidate must rejoin through full admission validation.
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.revision_conflict
        - exam.attempt.suspension_conflict
        - exam.attempt.state_conflict
        - exam.attempt.sitting_unavailable
        - exam.attempt.conflict
        - exam.attempt.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReallowExamAttempt'
      responses:
        "200":
          $ref: '#/components/responses/ExamAttemptReallowed'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReallowExamAttempt:
      required: true
      description: Identifies the active suspension, expected Attempt revision, and private manager reason required for the audited re-allow transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReallowExamAttemptRequest'
          example:
            suspension_id: ybndrfg8ejkmcpqxot1uwisza3
            expected_attempt_revision: 4
            reason: Candidate identity was reverified by the invigilator.
  responses:
    BrowserActivityListOK:
      description: Bounded privacy-minimized Browser Activity page
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrowserActivityListResponse'
    ExamAttemptManagerOK:
      description: Bounded manager-safe Exam Attempt state
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamAttemptManagerResponse'
    ExamAttemptManagerListOK:
      description: Bounded manager-safe Exam Attempt collection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamAttemptManagerListResponse'
          example:
            items: []
    ExamAttemptReallowed:
      description: Exam Attempt suspension re-allowed without exposing the private manager reason
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamAttemptReallowResponse'
  schemas:
    BrowserActivityListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/BrowserActivityItemResponse'
        next_cursor:
          type: string
    BrowserActivityItemResponse:
      type: object
      additionalProperties: false
      required: [source_session_id, generation, sequence, kind, policy_revision_id, client_occurred_at, location, matched_rule_id, block_reason, received_at]
      properties:
        source_session_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        sequence:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [browser_opened, browser_closed, top_level_navigation, top_level_redirect, blocked_top_level_navigation]
        policy_revision_id:
          $ref: '#/components/schemas/ID'
        client_occurred_at:
          type: string
          format: date-time
        location:
          description: >-
            Reason-minimized navigation location. Successful navigation and HTTPS policy failures use a canonical HTTPS
            host, optional non-default port, and path. A blocked HTTP navigation uses the same canonical network fields
            with scheme `http`. Other disallowed schemes retain only their lowercase scheme while host and path are empty.
            An `invalid_url` block uses empty scheme, host, and path values. Query, fragment, user information, local paths,
            and scheme payloads are never retained.
          type:
            - object
            - "null"
          additionalProperties: false
          required: [scheme, host, path]
          properties:
            scheme:
              type: string
              maxLength: 32
              pattern: '^$|^[a-z][a-z0-9+.-]{0,31}$'
            host:
              type: string
            port:
              type: string
              pattern: '^[0-9]{1,5}$'
            path:
              type: string
        matched_rule_id:
          type:
            - string
            - "null"
        block_reason:
          type:
            - string
            - "null"
          enum:
            - scheme_not_allowed
            - origin_not_allowed
            - path_not_allowed
            - redirect_not_allowed
            - invalid_url
            - null
        received_at:
          type: string
          format: date-time
    ExamAttemptState:
      type: string
      enum:
        - ready
        - active
        - suspended
        - submitted
    AttemptParticipationState:
      type: string
      enum:
        - active
        - ended
    AttemptParticipationEndReason:
      type: string
      enum:
        - interrupted
        - lease_expired
        - kicked
        - submitted
        - sitting_closed
    AttemptConnectionState:
      type: string
      enum:
        - open
        - closed
    AttemptConnectionCloseReason:
      type: string
      enum:
        - transport_closed
        - interrupted
        - lease_expired
        - kicked
        - submitted
        - sitting_closed
    ExamAttemptWorkspaceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - cursor
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        cursor:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExamAttemptParticipationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - generation
        - renewal_sequence
        - started_at
        - updated_at
        - lease_expires_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        state:
          $ref: '#/components/schemas/AttemptParticipationState'
        generation:
          type: integer
          format: int64
          minimum: 1
        renewal_sequence:
          type: integer
          format: int64
          minimum: 0
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        end_reason:
          $ref: '#/components/schemas/AttemptParticipationEndReason'
    ExamAttemptConnectionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - state
        - opened_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        state:
          $ref: '#/components/schemas/AttemptConnectionState'
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        close_reason:
          $ref: '#/components/schemas/AttemptConnectionCloseReason'
    ExamAttemptSuspensionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - participation_id
        - flag_id
        - generation
        - state
        - source
        - candidate_reason
        - started_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        participation_id:
          $ref: '#/components/schemas/ID'
        flag_id:
          $ref: '#/components/schemas/ID'
        generation:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
            - active
            - closed
        source:
          type: string
          const: policy
        candidate_reason:
          type: string
          const: secure_connectivity_lost
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        reallowed_by_user_id:
          $ref: '#/components/schemas/ID'
    ExamAttemptManagerResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - exam_id
        - exam_sitting_id
        - candidate_user_id
        - admission_revision_id
        - state
        - created_at
        - updated_at
        - revision
        - workspace
      properties:
        id:
          $ref: '#/components/schemas/ID'
        exam_id:
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
        candidate_user_id:
          $ref: '#/components/schemas/ID'
        admission_revision_id:
          $ref: '#/components/schemas/ID'
        state:
          $ref: '#/components/schemas/ExamAttemptState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 1
        workspace:
          $ref: '#/components/schemas/ExamAttemptWorkspaceResponse'
        latest_participation:
          $ref: '#/components/schemas/ExamAttemptParticipationResponse'
        current_connection:
          $ref: '#/components/schemas/ExamAttemptConnectionResponse'
        active_suspension:
          $ref: '#/components/schemas/ExamAttemptSuspensionResponse'
    ReallowExamAttemptRequest:
      type: object
      additionalProperties: false
      required:
        - suspension_id
        - expected_attempt_revision
        - reason
      properties:
        suspension_id:
          $ref: '#/components/schemas/ID'
        expected_attempt_revision:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Trimmed private manager reason retained only in suspension provenance.
    ExamAttemptReallowResponse:
      type: object
      additionalProperties: false
      required:
        - exam_attempt_id
        - exam_sitting_id
        - state
        - attempt_revision
        - suspension_id
        - suspension_state
        - candidate_reason
        - reallowed_by_user_id
      properties:
        exam_attempt_id:
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
        state:
          type: string
          const: active
        attempt_revision:
          type: integer
          format: int64
          minimum: 1
        suspension_id:
          $ref: '#/components/schemas/ID'
        suspension_state:
          type: string
          const: closed
        candidate_reason:
          type: string
          const: secure_connectivity_lost
        reallowed_by_user_id:
          $ref: '#/components/schemas/ID'
    ExamAttemptManagerListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExamAttemptManagerResponse'
        next_cursor:
          type: string
          description: Opaque versioned cursor over descending creation time and Attempt identity; clients return it unchanged.
