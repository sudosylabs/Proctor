paths:
  /api/v1/exam-attempts/{exam_attempt_id}/workspace:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: listCandidateExamWorkspace
      summary: List one protected candidate Workspace page
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_unavailable
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque versioned cursor over ascending canonical path and Workspace entry identity; clients return it unchanged.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/CandidateExamWorkspaceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  responses:
    CandidateExamWorkspaceListOK:
      description: Bounded protected candidate Workspace manifest page
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateExamWorkspaceListResponse'
  schemas:
    CandidateExamWorkspaceListResponse:
      type: object
      additionalProperties: false
      required:
        - workspace_id
        - workspace_cursor
        - items
        - refresh_required
      properties:
        workspace_id:
          $ref: '#/components/schemas/ID'
        workspace_cursor:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CandidateExamWorkspaceItemResponse'
        next_cursor:
          type: string
          description: >-
            Opaque versioned cursor containing only the pinned Workspace cursor and last Entry identity; no Workspace path enters the URL.
        refresh_required:
          type: boolean
          description: True with an empty page when the pinned manifest cursor advanced; restart from the first page.
