paths:
  /api/v1/exam-attempts/{exam_attempt_id}/presentation:
    parameters:
      - $ref: '#/components/parameters/ExamAttemptID'
    get:
      operationId: getCandidateExamPresentation
      summary: Get the protected current presentation for one candidate Attempt
      description: >-
        Returns the Exam title, bounded Markdown instructions, admitted capacity policy, and ordered resource manifest
        visible to the active candidate Attempt. The request rechecks the Session-bound Attempt credential and open
        Connection; no answer or manager-only state is included.
      tags:
        - Attempts and workspaces
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - request.invalid
        - resource.not_found
        - exam.attempt.invalid
        - exam.attempt.sitting_unavailable
        - exam.attempt.state_conflict
        - exam.attempt.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CandidateAttemptCredential'
        - $ref: '#/components/parameters/CandidateAttemptConnectionID'
      responses:
        '200':
          $ref: '#/components/responses/CandidateExamPresentationOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  responses:
    CandidateExamPresentationOK:
      description: Protected current Exam presentation for one active Attempt Connection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CandidateExamPresentationResponse'
  schemas:
    CandidateExamResourceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - description_markdown
        - position
        - media_type
        - size
        - sha256
      properties:
        id:
          $ref: '#/components/schemas/ID'
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        description_markdown:
          type: string
          maxLength: 16384
        position:
          type: integer
          minimum: 0
          maximum: 99
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
        sha256:
          $ref: '#/components/schemas/SHA256'
    CandidateExamPresentationResponse:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - exam_sitting_id
        - title
        - instructions_markdown
        - candidate_runtime_capabilities
        - browser_policy
        - live_corrections
        - resources
      properties:
        attempt_id:
          $ref: '#/components/schemas/ID'
        exam_sitting_id:
          $ref: '#/components/schemas/ID'
        title:
          type: string
          minLength: 1
          maxLength: 200
        instructions_markdown:
          type: string
          description: Current Sitting Revision instructions as bounded authored Markdown.
        candidate_runtime_capabilities:
          $ref: '#/components/schemas/CandidateRuntimeCapabilities'
        browser_policy:
          oneOf:
            - $ref: '#/components/schemas/CandidateBrowserPolicy'
            - type: 'null'
        live_corrections:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/CandidateLiveCorrection'
        resources:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CandidateExamResourceResponse'
    CandidateBrowserPolicy:
      type: object
      additionalProperties: false
      required:
        - enabled
        - policy_revision_id
        - policy_revision_number
        - policy_digest
        - browser_activity_disclosure
      properties:
        enabled:
          type: boolean
        start_rule_id:
          type: string
          minLength: 1
          maxLength: 64
        rules:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/BrowserPolicyRule'
        policy_revision_id:
          $ref: '#/components/schemas/ID'
        policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        policy_revision_number:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        browser_activity_disclosure:
          $ref: '#/components/schemas/BrowserActivityDisclosure'
      oneOf:
        - properties:
            enabled:
              const: false
          not:
            anyOf:
              - required:
                  - start_rule_id
              - required:
                  - rules
        - properties:
            enabled:
              const: true
          required:
            - start_rule_id
            - rules
      description: >-
        Current Browser Policy and separately revisioned collection notice. Revision number is a monotonic ordinal. The
        sha256-prefixed digest covers only canonical BrowserPolicy bytes, excluding revision metadata and disclosure.
        Disabled policies omit start_rule_id and rules.
    CandidateLiveCorrection:
      type: object
      additionalProperties: false
      required:
        - revision_id
        - revision_number
        - effective_at
        - summary
        - changed_areas
        - affected_capabilities
        - acknowledgement_required
        - acknowledgement_state
      properties:
        revision_id:
          $ref: '#/components/schemas/ID'
        revision_number:
          type: integer
          format: int64
          minimum: 1
        effective_at:
          type: string
          format: date-time
        summary:
          type: string
          minLength: 1
          maxLength: 500
        changed_areas:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - browser_policy
              - instructions
              - resources
        affected_capabilities:
          $ref: '#/components/schemas/CorrectionCapabilitySelection'
        acknowledgement_required:
          type: boolean
        acknowledgement_state:
          type: string
          enum:
            - not_required
            - pending
            - acknowledged
        acknowledged_at:
          type: string
          format: date-time
          description: Present exactly when acknowledgement_state is acknowledged.
    CandidateRuntimeCapabilities:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - server_time
        - interaction_state
        - attempt_configuration
        - focus_loss_collection_enabled
        - pending_correction_capabilities
        - workspace_mutation_allowed
        - submission_allowed
        - terminal
        - browser
        - exam_revision
        - departure
      properties:
        schema_version:
          type: integer
          enum:
            - 1
        server_time:
          type: string
          format: date-time
        interaction_state:
          type: string
          enum:
            - interactive
            - sitting_paused
        attempt_configuration:
          $ref: '#/components/schemas/CandidateAttemptConfiguration'
        focus_loss_collection_enabled:
          type: boolean
        pending_correction_capabilities:
          type: array
          maxItems: 4
          uniqueItems: true
          description: Sorted union of capabilities selected by currently pending required acknowledgements.
          items:
            $ref: '#/components/schemas/CandidateCapability'
        workspace_mutation_allowed:
          type: boolean
        submission_allowed:
          type: boolean
        terminal:
          $ref: '#/components/schemas/CandidateTerminalCapability'
        browser:
          $ref: '#/components/schemas/CandidateBrowserCapability'
        exam_revision:
          $ref: '#/components/schemas/CandidateExamRevisionCapability'
        departure:
          $ref: '#/components/schemas/CandidateDepartureCapability'
    CandidateAttemptConfiguration:
      type: object
      additionalProperties: false
      description: >-
        Effective presentation and approved identifiers for the candidate renderer. The revision and digest identify the
        frozen configuration; private build, registry and User Settings provenance are delivered only to the owning
        privileged Desktop.
      required:
        - attempt_configuration_revision
        - presentation
        - approved_commands
        - approved_keybindings
        - digest
      properties:
        attempt_configuration_revision:
          type: string
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        presentation:
          $ref: '#/components/schemas/AttemptConfigurationPresentation'
        approved_commands:
          type: array
          description: >-
            Sorted unique approved catalog IDs; keybindings must resolve to selected commands. Raw key chords are
            rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        approved_keybindings:
          type: array
          description: >-
            Sorted unique approved catalog IDs; keybindings must resolve to selected commands. Raw key chords are
            rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
    AttemptConfigurationCandidate:
      type: object
      additionalProperties: false
      description: >-
        Complete proposed configuration, bounded at 16 KiB canonical bytes. Initial admission checks the acknowledged
        User Settings revision, exact admitted build and target, packaged registry and manifest, and Candidate-safe
        catalog membership. Out-of-range values are rejected without clamping. The digest of a frozen configuration
        covers this entire candidate, including its original provenance.
      required:
        - manifest_fingerprint
        - registry_fingerprint
        - desktop_build
        - desktop_target
        - user_settings_revision
        - presentation
        - approved_commands
        - approved_keybindings
      properties:
        manifest_fingerprint:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        registry_fingerprint:
          type: string
          pattern: ^fnv1a64:[0-9a-f]{16}$
        desktop_build:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        desktop_target:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        user_settings_revision:
          $ref: '#/components/schemas/ID'
        presentation:
          $ref: '#/components/schemas/AttemptConfigurationPresentation'
        approved_commands:
          type: array
          description: >-
            Sorted unique approved catalog IDs; keybindings must resolve to selected commands. Raw key chords are
            rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        approved_keybindings:
          type: array
          description: >-
            Sorted unique approved catalog IDs; keybindings must resolve to selected commands. Raw key chords are
            rejected.
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    AttemptConfigurationPresentation:
      type: object
      additionalProperties: false
      required:
        - color_theme
        - prefer_high_contrast
        - zoom_percent
        - editor_font_size_px
        - editor_line_height_px
        - reduced_motion
        - screen_reader_mode
        - announcement_mode
        - cursor_style
        - cursor_blinking
      properties:
        color_theme:
          type: string
          enum:
            - light
            - dark
            - hcLight
            - hcDark
        prefer_high_contrast:
          type: boolean
        zoom_percent:
          type: integer
          minimum: 80
          maximum: 200
          default: 100
        editor_font_size_px:
          type: integer
          minimum: 12
          maximum: 24
          default: 14
        editor_line_height_px:
          type: integer
          description: Pixel height with bounds independent of font size.
          minimum: 16
          maximum: 40
          default: 22
        reduced_motion:
          type: boolean
        screen_reader_mode:
          type: string
          enum:
            - auto
            - 'on'
            - 'off'
        announcement_mode:
          type: string
          enum:
            - auto
            - verbose
            - minimal
        cursor_style:
          type: string
          enum:
            - line
            - block
            - underline
        cursor_blinking:
          type: string
          enum:
            - blink
            - smooth
            - phase
            - expand
            - solid
    CandidateTerminalCapability:
      type: object
      additionalProperties: false
      required:
        - state
        - environment_epoch
        - applied_workspace_cursor
        - projection_state
      properties:
        state:
          type: string
          enum:
            - disabled
            - available
            - sitting_paused
            - acknowledgement_required
            - temporarily_unavailable
        environment_epoch:
          type: [string, 'null']
          description: Host environment identity; null until an environment has been created.
          pattern: '^[A-Za-z0-9_-]{1,128}$'
        applied_workspace_cursor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        projection_state:
          type: string
          enum: [synchronizing, ready, conflict, unavailable]
    CandidateBrowserCapability:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - disabled
            - available
            - sitting_paused
            - acknowledgement_required
            - temporarily_unavailable
        policy_revision_id:
          $ref: '#/components/schemas/ID'
        policy_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
      oneOf:
        - type: object
          properties:
            state:
              type: string
              enum:
                - disabled
        - type: object
          required:
            - state
            - policy_revision_id
            - policy_digest
          properties:
            state:
              type: string
              enum:
                - available
                - sitting_paused
                - acknowledgement_required
                - temporarily_unavailable
            policy_revision_id:
              $ref: '#/components/schemas/ID'
            policy_digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
    CandidateExamRevisionCapability:
      type: object
      additionalProperties: false
      required:
        - admission_revision_id
        - current_revision_id
        - acknowledgement_required
      properties:
        admission_revision_id:
          $ref: '#/components/schemas/ID'
        current_revision_id:
          $ref: '#/components/schemas/ID'
        acknowledgement_required:
          type: boolean
    CandidateDepartureCapability:
      type: object
      additionalProperties: false
      required:
        - allowed
        - reason
      properties:
        allowed:
          type: boolean
          enum:
            - false
        reason:
          type: string
          enum:
            - attempt_in_progress
