paths:
  /api/v1/jobs/{job_id}/attempts:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The durable Job whose execution history is requested.
    get:
      operationId: listJobAttempts
      summary: List ordered execution Attempts for one Job
      tags:
        - Jobs
      description: >-
        Returns the bounded execution history for an authorized, allowlisted Job in attempt-number order. The projection exposes safe status and public failure information, never worker leases, private payloads, stack traces, or infrastructure diagnostics.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - job.query.invalid
        - resource.not_found
        - job.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of execution Attempts to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation emitted by the preceding page for this exact Job and query.
      responses:
        "200":
          $ref: '#/components/responses/JobAttemptListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  responses:
    JobAttemptListOK:
      description: Safe Job Attempt collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobAttemptListResponse'
  schemas:
    JobAttemptStatus:
      description: Durable lifecycle state of one execution Attempt.
      type: string
      enum:
        - running
        - succeeded
        - failed
        - canceled
        - lease_expired
        - incompatible
    JobAttemptResponse:
      description: Safe execution history for one Job Attempt.
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - status
        - start_at
        - heartbeat_at
        - lease_expires_at
      properties:
        id:
          $ref: '#/components/schemas/ID'
        number:
          type: integer
          minimum: 1
          description: Monotonic attempt number within the parent Job.
        status:
          $ref: '#/components/schemas/JobAttemptStatus'
        start_at:
          type: integer
          format: int64
          description: Unix time in milliseconds when execution started.
        heartbeat_at:
          type: integer
          format: int64
          description: Unix time in milliseconds of the last retained worker heartbeat.
        lease_expires_at:
          type: integer
          format: int64
          description: Unix time in milliseconds at which this execution lease expires.
        complete_at:
          type: integer
          format: int64
          description: Unix time in milliseconds when the Attempt reached a terminal state, when complete.
        public_error_code:
          type: string
          description: Stable safe failure category for a failed terminal Attempt; internal error detail is never returned.
    JobAttemptListResponse:
      description: One bounded page of Job execution Attempts.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobAttemptResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
