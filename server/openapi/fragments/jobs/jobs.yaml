paths:
  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: List allowlisted durable Jobs
      tags:
        - Jobs
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - job.query.invalid
        - job.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/JobStatus'
      responses:
        "200":
          $ref: '#/components/responses/JobListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
    get:
      operationId: getJob
      summary: Get one allowlisted durable Job
      tags:
        - Jobs
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - resource.not_found
        - job.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/JobOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  responses:
    JobListOK:
      description: Safe durable Job collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobListResponse'
  schemas:
    JobListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobResponse'
        next_cursor:
          type: string
