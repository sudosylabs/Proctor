paths:
  /api/v1/users/{user_id}/email:
    parameters:
      - $ref: '#/components/parameters/UserID'
    put:
      operationId: changeUserEmail
      summary: Explicitly change a User email address and require verification
      tags:
        - Users
      description: >-
        Replaces the target User's email only after strong recent authentication, marks the new address unverified, and starts the bounded account-recovery notification path. It never treats possession of administrator authority as proof that the new address is owned.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - user.invalid
        - user.conflict
        - authentication.account_recovery.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/ChangeUserEmail'
      responses:
        "200":
          $ref: '#/components/responses/UserEmailStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}/email/verify:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      operationId: verifyUserEmailPrivileged
      summary: Privileged verification of a User email address
      tags:
        - Users
      description: >-
        Marks the target User's current email as verified through a distinct strongly authenticated administrative transition. It does not change the address, revive a disabled account, restore Sessions, or bypass current authorization.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/users/<user-id>/email/verify' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - user.conflict
        - authentication.account_recovery.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/UserEmailStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ChangeUserEmail:
      description: The complete replacement email address; successful change always requires later verification.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChangeUserEmailRequest'
          example:
            email: amina.diallo@example.edu
  responses:
    UserEmailStateOK:
      description: Narrow result of an explicit email-security transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserEmailStateResponse'
  schemas:
    UserEmailStateResponse:
      description: Narrow identity and verification state after an email-security transition.
      type: object
      additionalProperties: false
      required:
        - id
        - email_verified
      properties:
        id:
          $ref: '#/components/schemas/ID'
        email_verified:
          type: boolean
          description: Whether the target User's current email has completed verification.
    ChangeUserEmailRequest:
      description: New email address to store in an unverified state.
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Complete replacement address; it must satisfy canonical email validation and uniqueness.
