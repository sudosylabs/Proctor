paths:
  /api/v1/users/me/settings:
    get:
      operationId: getCurrentUserSettings
      summary: Get the signed-in User's exact settings.json source
      tags:
        - Users
      description: >-
        Returns the signed-in User's exact bounded settings JSON source, format version, revision, and write capability. The server does not reinterpret the source into undocumented fields, and the private response is never shared-cacheable.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - user_settings.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserSettingsOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceCurrentUserSettings
      summary: Conditionally replace the signed-in User's exact settings.json source
      tags:
        - Users
      description: >-
        Validates and replaces the signed-in User's complete settings source under an exact revision fence. An Idempotency-Key replay returns the retained outcome, while stale revisions fail rather than overwriting a concurrent client update.
      x-proctor-auth: session_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - request.invalid
        - user_settings.invalid
        - user_settings.format_unsupported
        - user_settings.revision_conflict
        - user_settings.unavailable
        - audit.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReplaceUserSettings'
      responses:
        "200":
          $ref: '#/components/responses/UserSettingsReplaced'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    ReplaceUserSettings:
      description: Complete settings JSON source, its supported format version, and the exact current revision to replace.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsReplaceRequest'
          example:
            source: '{"appearance":{"theme":"system"}}'
            format_version: 1
            expected_revision: ybndrfg8ejkmcpqxot1uwisza3
  responses:
    UserSettingsOK:
      description: Exact current User Settings Document
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsResponse'
    UserSettingsReplaced:
      description: User Settings Document replacement outcome
      headers:
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSettingsReplacementResponse'
  schemas:
    UserSettingsResponse:
      description: Exact private User Settings Document with concurrency metadata.
      type: object
      additionalProperties: false
      required:
        - source
        - format_version
        - revision
        - writable
        - updated_at
      properties:
        source:
          type: string
          maxLength: 262144
          description: Exact validated JSON source, bounded to 256 KiB.
        format_version:
          type: integer
          minimum: 1
          description: Version of the settings document format understood by the server.
        revision:
          $ref: '#/components/schemas/ID'
          description: Opaque current document revision required for conditional replacement.
        writable:
          type: boolean
          description: Whether this Session may currently replace the settings source.
        updated_at:
          type: integer
          format: int64
          description: Unix time in milliseconds of the latest durable replacement.
    UserSettingsReplaceRequest:
      description: Complete conditional replacement for the current User Settings Document.
      type: object
      additionalProperties: false
      required:
        - source
        - format_version
        - expected_revision
      properties:
        source:
          type: string
          maxLength: 262144
        format_version:
          type: integer
          minimum: 1
        expected_revision:
          $ref: '#/components/schemas/ID'
    UserSettingsReplacementResponse:
      description: Result metadata for a committed replacement or exact idempotent replay.
      type: object
      additionalProperties: false
      required:
        - revision
        - format_version
        - updated_at
        - changed
      properties:
        revision:
          $ref: '#/components/schemas/ID'
        format_version:
          type: integer
          minimum: 1
        updated_at:
          type: integer
          format: int64
        changed:
          type: boolean
          description: False when the accepted source already matched the retained document.
