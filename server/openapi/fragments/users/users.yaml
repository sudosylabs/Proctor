paths:
  /api/v1/users:
    get:
      operationId: searchUsers
      summary: Search the authorized User directory
      tags:
        - Users
      description: >-
        Searches only User profiles visible through the caller's current Institution or scoped relationships, ordered by canonical username and identity. Disabled Users remain concealed unless an Institution-wide user viewer explicitly requests them.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - user.invalid
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          description: Literal case-insensitive substring matched against visible User directory fields.
          schema:
            type: string
        - name: after_username
          in: query
          required: false
          schema:
            type: string
          description: Canonical username from the preceding page; supply together with after_id.
        - name: after_id
          in: query
          required: false
          schema:
            type: string
          description: Stable User identity from the preceding page; supply together with after_username.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Maximum number of visible User profiles to return.
        - name: include_disabled
          in: query
          required: false
          description: Honored only for institution-wide user.view; scoped visibility always excludes disabled Users.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: '#/components/responses/UserProfileListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me:
    get:
      operationId: getCurrentUserProfile
      summary: Get the authenticated User profile
      tags:
        - Users
      description: >-
        Returns the current principal's own safe User profile from durable state. The projection contains no password data, authentication-provider claims, Session credentials, Personal Access Token material, or private authorization bindings.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/me/context:
    get:
      operationId: getCurrentUserContext
      summary: Get the signed-in User's bounded product context
      tags:
        - Users
      description: >-
        Returns a credential-free navigation projection for the current interactive Session. It identifies available product areas, a bounded list of management scopes, and the current unresolved Attempt selector without exposing Roles, permissions, provider claims, Session credentials, or examination content. This response is not an authorization receipt and must never be cached.
      x-proctor-auth: session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/CurrentUserContextOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      operationId: getUserProfile
      summary: Get a contextually visible User profile
      tags:
        - Users
      description: >-
        Returns one safe User profile only when the caller has current contextual visibility through the Institution or a supported scoped relationship. Disabled or unrelated Users are concealed according to the documented authorization behavior.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateUserProfile
      summary: Administratively update a User profile
      tags:
        - Users
      description: >-
        Applies a partial administrative profile update after terminal authorization against the target User. It changes presentation fields only; email, credential methods, account state, memberships, and Role Bindings use explicit separate transitions.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - user.invalid
        - user.conflict
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/UpdateUserProfile'
      responses:
        "200":
          $ref: '#/components/responses/UserProfileOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    UpdateUserProfile:
      description: Mutable presentation fields for one User; omitted or null fields remain unchanged.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateUserProfileRequest'
          example:
            display_name: Amina Diallo
            first_name: Amina
            last_name: Diallo
            locale: en
            timezone: Europe/Paris
  responses:
    CurrentUserContextOK:
      description: Bounded current User product context
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CurrentUserContextResponse'
    UserProfileListOK:
      description: User profile collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileListResponse'
          example: []
  schemas:
    CurrentUserContextResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - no_current_affiliation
        - no_assigned_access
        - available_product_areas
        - management_scopes
        - management_scopes_has_more
        - unresolved_attempt
        - session_management_available
        - current_desktop_registration_id
      properties:
        user:
          $ref: '#/components/schemas/CurrentUserContextIdentity'
        no_current_affiliation:
          type: boolean
        no_assigned_access:
          type: boolean
        available_product_areas:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: string
            enum:
              - account
              - administration
              - exam_management
              - settings
              - student_activity
        management_scopes:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CurrentUserManagementScope'
        management_scopes_has_more:
          type: boolean
        unresolved_attempt:
          type:
            - object
            - "null"
          additionalProperties: false
          required:
            - id
            - exam_sitting_id
            - state
          properties:
            id:
              $ref: '#/components/schemas/ID'
            exam_sitting_id:
              $ref: '#/components/schemas/ID'
            state:
              type: string
              enum:
                - ready
                - active
                - suspended
        session_management_available:
          type: boolean
        current_desktop_registration_id:
          type:
            - string
            - "null"
          pattern: '^[a-z0-9]{26}$'
    CurrentUserContextIdentity:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - display_name
        - profile_picture_reference
      properties:
        id:
          $ref: '#/components/schemas/ID'
        username:
          type: string
        display_name:
          type: string
        profile_picture_reference:
          type: string
    CurrentUserManagementScope:
      type: object
      additionalProperties: false
      required:
        - scope_type
        - scope_id
        - display_name
      properties:
        scope_type:
          type: string
          enum:
            - institution
            - academic_unit
        scope_id:
          $ref: '#/components/schemas/ID'
        display_name:
          type: string
    UserProfileListResponse:
      description: Visible User profiles ordered by canonical username and identity.
      type: array
      items:
        $ref: '#/components/schemas/UserProfileResponse'
    UpdateUserProfileRequest:
      description: Partial User presentation update; omitted and explicit null values leave a field unchanged.
      type: object
      additionalProperties: false
      properties:
        username:
          type:
            - string
            - "null"
          description: Omitted or null leaves the canonical username unchanged.
        display_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the human-facing display name unchanged.
        first_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the first name unchanged.
        last_name:
          type:
            - string
            - "null"
          description: Omitted or null leaves the last name unchanged.
        locale:
          type:
            - string
            - "null"
          description: Omitted or null leaves the locale unchanged.
        timezone:
          type:
            - string
            - "null"
          description: Omitted or null leaves the IANA time-zone name unchanged.
