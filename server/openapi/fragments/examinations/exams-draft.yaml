paths:
  /api/v1/exams/{exam_id}/draft:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    patch:
      operationId: editExamDraftText
      summary: Edit authored title or Markdown instructions on the active Exam Draft
      description: >-
        Changes one or both authored text fields on the mutable Draft only when the expected Draft revision still matches. Null leaves a field unchanged, while bounded Markdown is stored as authored content and rendered through the documentation-safe presentation contract.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EditExamDraftText'
      responses:
        "200":
          $ref: '#/components/responses/ExamOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EditExamDraftText:
      required: true
      description: Supplies the expected Draft revision and at least one authored title or Markdown instructions change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditExamDraftTextRequest'
          example:
            expected_draft_revision: 2
            title: Distributed Systems Final
            instructions_markdown: "Read every question carefully. Save your work before submitting."
  schemas:
    EditExamDraftTextRequest:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
      anyOf:
        - required:
            - title
          properties:
            title:
              type: string
        - required:
            - instructions_markdown
          properties:
            instructions_markdown:
              type: string
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        title:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
          description: Omitted or null leaves the title unchanged; a present value is trimmed and must remain non-empty.
        instructions_markdown:
          type:
            - string
            - "null"
          description: >-
            Omitted or null leaves the authored Markdown unchanged; an empty string clears it. Present UTF-8 content is limited to 65536 bytes.
