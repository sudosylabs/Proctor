paths:
  /api/v1/exams/{exam_id}/draft/resources:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    get:
      operationId: listExamDraftResources
      summary: List the ordered protected resources in an Exam Draft
      description: >-
        Returns the complete ordered resource manifest for the mutable Draft, including authored presentation metadata, content revision, media type, size, and digest. Protected bytes remain available only through the separately authorized inline content route.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.resource.invalid
        - exam.resource.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createExamDraftResource
      summary: Upload and append a protected resource to an Exam Draft
      description: >-
        Appends one protected resource to the Draft after validating the expected Draft revision, authored metadata, declared content size and digest, media policy, resource limits, and Idempotency-Key. The metadata-first multipart upload is committed atomically with its protected content reference.
      x-codeSamples:
        - lang: Shell
          label: Append a protected PDF resource
          source: |-
            curl --request POST \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Idempotency-Key: exam-resource-create-001" \
              --form 'metadata={"expected_draft_revision":3,"display_name":"Formula sheet","description_markdown":"Reference formulas for this examination.","media_type":"application/pdf","size":2048,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./formula-sheet.pdf;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exams/ybndrfg8ejkmcpqxot1uwisza3/draft/resources
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - exam.resource.invalid_content
        - exam.resource.limit
        - exam.resource.upload_invalid
        - exam.resource.revision_conflict
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: Contains strict resource metadata first and bounded protected content second; the declared byte length and SHA-256 digest must match the uploaded bytes.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamResourceUploadMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "201":
          $ref: '#/components/responses/ExamResourceCreated'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/resources/order:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: reorderExamDraftResources
      summary: Replace the complete order of active Exam Draft resources
      description: >-
        Replaces the full active resource order at the expected Draft revision. Every current resource identifier must appear exactly once, so stale or partial lists fail without changing any positions.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - exam.resource.no_changes
        - exam.resource.order_invalid
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ReorderExamResources'
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/resources/{exam_resource_id}:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamResourceID'
    patch:
      operationId: editExamDraftResourceMetadata
      summary: Edit one Exam Draft resource's authored metadata
      description: >-
        Changes the display name and/or bounded Markdown description of one Draft resource at the expected Draft revision. Content bytes, digest, and order remain unchanged; omitted fields are preserved.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - exam.resource.no_changes
        - exam.resource.revision_conflict
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EditExamResourceMetadata'
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: removeExamDraftResource
      summary: Remove one resource from the active Exam Draft
      description: >-
        Removes the resource from the active Draft only when the expected Draft revision still matches, then closes the ordering gap atomically. Historical immutable Revisions retain their published resource snapshot.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - exam.resource.revision_conflict
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RemoveExamResource'
      responses:
        "204":
          $ref: '#/components/responses/ExamResourceRemoved'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/exams/{exam_id}/draft/resources/{exam_resource_id}/content:
    parameters:
      - $ref: '#/components/parameters/ExamID'
      - $ref: '#/components/parameters/ExamResourceID'
    get:
      operationId: getExamDraftResourceContent
      summary: Render protected Exam resource content inline
      tags:
        - Examinations
      description: >-
        Returns only an authorized in-application content stream. This route is not a public URL or download/export capability and never exposes an object key.
      x-proctor-auth: principal_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - exam.resource.invalid
        - exam.resource.unavailable
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: One or more entity tags from an earlier protected-content response; a match returns 304 without a body.
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceProtectedContent'
        "304":
          $ref: '#/components/responses/ExamProtectedContentNotModified'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceExamDraftResourceContent
      summary: Replace an Exam Draft resource's protected content
      description: >-
        Replaces one resource's protected bytes at the expected Draft revision after validating media type, length, digest, upload shape, and Idempotency-Key. Authored display metadata and resource order remain unchanged while a new content revision is recorded.
      x-codeSamples:
        - lang: Shell
          label: Replace protected resource content
          source: |-
            curl --request PUT \
              --header "Authorization: Bearer $PROCTOR_TOKEN" \
              --header "Idempotency-Key: exam-resource-replace-002" \
              --form 'metadata={"expected_draft_revision":4,"media_type":"application/pdf","size":3072,"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"};type=application/json' \
              --form 'content=@./formula-sheet-v2.pdf;type=application/octet-stream' \
              https://proctor.example.edu/api/v1/exams/ybndrfg8ejkmcpqxot1uwisza3/draft/resources/ybndrfg8ejkmcpqxot1uwisza4/content
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.archived
        - exam.draft.revision_conflict
        - exam.resource.invalid
        - exam.resource.conflict
        - exam.resource.unavailable
        - exam.resource.invalid_content
        - exam.resource.upload_invalid
        - exam.resource.revision_conflict
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        description: Contains strict replacement metadata first and bounded protected content second; declared media type, size, and digest must match the uploaded bytes.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamResourceContentReplacementMultipart'
            encoding:
              metadata:
                contentType: application/json
              content:
                contentType: application/octet-stream
      responses:
        "200":
          $ref: '#/components/responses/ExamResourceOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    EditExamResourceMetadata:
      required: true
      description: Supplies the expected Draft revision and at least one authored display-name or Markdown-description change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EditExamResourceMetadataRequest'
          example:
            expected_draft_revision: 4
            display_name: Formula sheet, revision 2
    ReorderExamResources:
      required: true
      description: Supplies the expected Draft revision and the complete ordered set of active resource identifiers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReorderExamResourcesRequest'
          example:
            expected_draft_revision: 5
            resource_ids:
              - ybndrfg8ejkmcpqxot1uwisza3
              - ybndrfg8ejkmcpqxot1uwisza4
    RemoveExamResource:
      required: true
      description: Supplies the last observed Draft revision required to remove the path resource without overwriting newer authoring work.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RemoveExamResourceRequest'
          example:
            expected_draft_revision: 6
  responses:
    ExamResourceOK:
      description: Exam Draft resource changed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResourceResponse'
    ExamResourceCreated:
      description: Exam Draft resource created
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResourceResponse'
    ExamResourceRemoved:
      description: Exam Draft resource removed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    ExamResourceListOK:
      description: Complete ordered Exam Draft resource catalog
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExamResourceListResponse'
    ExamResourceProtectedContent:
      description: Authorized inline Exam Resource content; not a public URL or export response
      headers:
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, max-age=300
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
      content:
        '*/*':
          schema:
            type: string
            format: binary
    ExamProtectedContentNotModified:
      description: Protected Exam content has not changed
      headers:
        ETag:
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            const: private, max-age=300
        X-Content-Type-Options:
          schema:
            type: string
            const: nosniff
  schemas:
    ExamResourceUploadMetadata:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
        - display_name
        - media_type
        - size
        - sha256
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Trimmed UTF-8 with at most 255 Unicode scalar values.
        description_markdown:
          type: string
          maxLength: 16384
          description: Authored Markdown encoded as UTF-8 and limited to 16384 bytes.
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
        sha256:
          $ref: '#/components/schemas/SHA256'
    ExamResourceContentReplacementMetadata:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
        - media_type
        - size
        - sha256
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
        sha256:
          $ref: '#/components/schemas/SHA256'
    ExamResourceUploadMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts in order: metadata first as application/json (maximum 32768 bytes), then content.'
      properties:
        metadata:
          $ref: '#/components/schemas/ExamResourceUploadMetadata'
        content:
          type: string
          format: binary
    ExamResourceContentReplacementMultipart:
      type: object
      additionalProperties: false
      required:
        - metadata
        - content
      description: 'Exactly two parts in order: metadata first as application/json (maximum 32768 bytes), then content.'
      properties:
        metadata:
          $ref: '#/components/schemas/ExamResourceContentReplacementMetadata'
        content:
          type: string
          format: binary
    EditExamResourceMetadataRequest:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
      anyOf:
        - required:
            - display_name
          properties:
            display_name:
              type: string
        - required:
            - description_markdown
          properties:
            description_markdown:
              type: string
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        display_name:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 255
          description: >-
            Omitted or null leaves the name unchanged; a present value is trimmed UTF-8 with at most 255 Unicode scalar values.
        description_markdown:
          type:
            - string
            - "null"
          maxLength: 16384
          description: Omitted or null leaves the Markdown unchanged; a present value is UTF-8 limited to 16384 bytes.
    ReorderExamResourcesRequest:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
        - resource_ids
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        resource_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ID'
    RemoveExamResourceRequest:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
    ExamResourceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - description_markdown
        - position
        - content_revision_id
        - media_type
        - size
        - sha256
        - updated_at
        - draft_revision
      properties:
        id:
          $ref: '#/components/schemas/ID'
        display_name:
          type: string
          minLength: 1
          maxLength: 255
        description_markdown:
          type: string
          maxLength: 16384
          description: Authored Markdown encoded as UTF-8 and limited to 16384 bytes.
        position:
          type: integer
          minimum: 0
          maximum: 99
        content_revision_id:
          $ref: '#/components/schemas/ID'
        media_type:
          $ref: '#/components/schemas/ExamResourceMediaType'
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 104857600
        sha256:
          $ref: '#/components/schemas/SHA256'
        updated_at:
          type: string
          format: date-time
        draft_revision:
          type: integer
          format: int64
          minimum: 1
    ExamResourceListResponse:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ExamResourceResponse'
