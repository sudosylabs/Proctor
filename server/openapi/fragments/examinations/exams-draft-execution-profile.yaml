paths:
  /api/v1/exams/{exam_id}/draft/execution-profile:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: configureExamDraftExecutionProfile
      summary: Replace the execution profile on the active Exam Draft
      description: >-
        Replaces the Draft's complete execution profile at the expected Draft revision. The selected image and network mode must be present in the current safe catalog; disabling execution still records an explicit, validated profile.
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.draft.revision_conflict
        - exam.draft.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ConfigureExamDraftExecutionProfile'
      responses:
        "200":
          $ref: '#/components/responses/ExamOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    ConfigureExamDraftExecutionProfile:
      required: true
      description: Supplies the expected Draft revision and the complete enabled, image, and network selection that should replace the current profile.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConfigureExamDraftExecutionProfileRequest'
          example:
            expected_draft_revision: 3
            enabled: true
            image: go-1.25
            network: none
  schemas:
    ConfigureExamDraftExecutionProfileRequest:
      type: object
      additionalProperties: false
      required:
        - expected_draft_revision
        - enabled
        - image
        - network
      properties:
        expected_draft_revision:
          type: integer
          format: int64
          minimum: 1
        enabled:
          type: boolean
        image:
          type: string
          maxLength: 255
        network:
          type: string
          enum:
            - none
            - allowlist
