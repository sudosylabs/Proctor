paths:
  /api/v1/exams/{exam_id}/owner:
    parameters:
      - $ref: '#/components/parameters/ExamID'
    put:
      operationId: transferExamOwnership
      summary: Transfer Exam ownership to an eligible current Manager
      tags:
        - Examinations
      x-proctor-auth: principal_required
      x-proctor-idempotency: required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authentication.csrf.invalid
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - audit.unavailable
        - request.invalid
        - resource.not_found
        - exam.invalid
        - exam.archived
        - exam.revision_conflict
        - exam.manager.not_found
        - exam.manager.ineligible
        - exam.owner.no_changes
        - exam.unavailable
        - idempotency.key_required
        - idempotency.invalid_key
        - idempotency.conflict
        - idempotency.in_progress
        - administration.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/TransferExamOwnership'
      responses:
        "200":
          $ref: '#/components/responses/ExamManagerChanged'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    TransferExamOwnership:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransferExamOwnershipRequest'
  schemas:
    TransferExamOwnershipRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
        - expected_exam_revision
      properties:
        user_id:
          $ref: '#/components/schemas/ID'
        expected_exam_revision:
          type: integer
          format: int64
          minimum: 1
