paths:
  /api/v1/mail/keys:
    get:
      operationId: inspectMailKeyState
      summary: Inspect safe mail payload-key identities and active reference counts
      tags:
        - Mail
      description: >-
        Returns non-secret key identifiers and active encrypted-payload reference counts needed to plan or verify key rotation. Strong recent authentication is required, and no key bytes, wrapping material, ciphertext, recipients, or message content are exposed.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - mail.unavailable
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailKeyStateOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  responses:
    MailKeyStateOK:
      description: Safe mail payload-key identities and active reference counts
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailKeyStateResponse'
  schemas:
    MailPayloadKeyUsage:
      description: Safe usage count for one configured mail payload-encryption key.
      type: object
      additionalProperties: false
      required:
        - key_id
        - active_references
      properties:
        key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Non-secret 128-bit key identifier encoded as lowercase hexadecimal.
        active_references:
          type: integer
          format: int64
          minimum: 1
          description: Number of active encrypted mail payloads that still reference this key.
    MailKeyStateResponse:
      description: Safe key identities and references used to govern mail payload rotation.
      type: object
      additionalProperties: false
      required:
        - primary_key_id
        - active
      properties:
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Identifier of the key currently used for new encrypted payloads.
        required_primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Configuration-required primary identifier when a mismatch must be resolved.
        active:
          type: array
          maxItems: 9
          items:
            $ref: '#/components/schemas/MailPayloadKeyUsage'
          description: Bounded keys with at least one active encrypted-payload reference.
