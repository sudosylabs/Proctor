paths:
  /api/v1/mail/metrics:
    get:
      operationId: getMailMetrics
      summary: Inspect bounded mail delivery metrics
      tags:
        - Mail
      description: >-
        Returns bounded aggregate delivery and queue health metrics for public allowlisted template categories. Metrics contain no recipient identity, message content, payload identifiers, credentials, or raw provider errors.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - mail.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailMetricsOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  responses:
    MailMetricsOK:
      description: Bounded safe mail delivery metrics
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailMetricsResponse'
  schemas:
    MailDeliveryMetricResponse:
      description: Aggregate delivery outcome and processing latency for one bounded metric bucket.
      type: object
      additionalProperties: false
      required:
        - template_key
        - state
        - outcome_code
        - count
        - attempt_count
        - processing_latency_millis
        - maximum_processing_latency_millis
      properties:
        template_key:
          type: string
          enum:
            - system.mail_test
        state:
          $ref: '#/components/schemas/MailDeliveryState'
        outcome_code:
          type: string
          maxLength: 128
          description: Stable safe outcome category for this metric bucket.
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of durable deliveries in the bucket.
        attempt_count:
          type: integer
          format: int64
          minimum: 0
          description: Total delivery Attempts represented by the bucket.
        processing_latency_millis:
          type: integer
          format: int64
          minimum: 0
          description: Aggregate processing latency in milliseconds.
        maximum_processing_latency_millis:
          type: integer
          format: int64
          minimum: 0
          description: Highest single processing latency in milliseconds within the bucket.
    MailQueueMetricResponse:
      description: Aggregate queue age and health for one bounded metric bucket.
      type: object
      additionalProperties: false
      required:
        - template_key
        - state
        - outcome_code
        - count
        - oldest_age_millis
        - health_code
        - truncated
      properties:
        template_key:
          type: string
          enum:
            - system.mail_test
        state:
          $ref: '#/components/schemas/MailDeliveryState'
        outcome_code:
          type: string
          maxLength: 128
        count:
          type: integer
          format: int64
          minimum: 0
        oldest_age_millis:
          type: integer
          format: int64
          minimum: 0
          description: Age in milliseconds of the oldest matching queued delivery.
        health_code:
          type: string
          enum:
            - mail.disabled
            - mail.healthy
            - mail.smtp_outage
            - mail.queue_delayed
          description: Stable safe operational classification for this queue bucket.
        truncated:
          type: boolean
          description: True when the bounded scan did not include every matching delivery.
    MailMetricsResponse:
      description: Bounded safe mail delivery and queue metrics.
      type: object
      additionalProperties: false
      required:
        - deliveries
        - queues
        - health_code
      properties:
        deliveries:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/MailDeliveryMetricResponse'
        queues:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/MailQueueMetricResponse'
        health_code:
          type: string
          enum:
            - ""
            - mail.disabled
            - mail.healthy
            - mail.smtp_outage
            - mail.queue_delayed
          description: Overall safe mail subsystem health classification.
