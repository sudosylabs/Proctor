paths:
  /api/v1/mail/rekey:
    post:
      operationId: startMailRekey
      summary: Start a durable fenced mail payload-key rotation
      tags:
        - Mail
      description: >-
        Starts one durable Job that re-encrypts active mail payloads from an explicitly retiring key to the configured primary key. Strong recent authentication and durable fencing prevent overlapping rotations or retirement without final zero-reference proof.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - mail.rekey.invalid
        - mail.rekey.conflict
        - mail.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        $ref: '#/components/requestBodies/StartMailRekey'
      responses:
        "202":
          $ref: '#/components/responses/MailRekeyAccepted'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/mail/rekey/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The durable mail rekey Job whose safe progress is requested.
    get:
      operationId: getMailRekeyStatus
      summary: Inspect safe progress and final retirement proof for one mail rekey Job
      tags:
        - Mail
      description: >-
        Returns bounded progress for one authorized mail rekey Job and, after completion, the counts required to prove whether the retiring key is safe to remove. No payload content, key bytes, recipients, or worker diagnostics are returned.
      x-proctor-auth: strong_recent_session_required
      x-proctor-idempotency: none
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.strong_required
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - mail.unavailable
        - authentication.dpop.invalid
        - authentication.dpop.replayed
        - authentication.dpop.use_nonce
        - authentication.dpop.unavailable
      security:
        - bearerAuth: []
        - dpopAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailRekeyStatusOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/ServiceUnavailable'
components:
  requestBodies:
    StartMailRekey:
      description: Identifies the currently active non-primary key that this rotation must retire.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailRekeyRequest'
          example:
            retiring_key_id: "0123456789abcdef0123456789abcdef"
  responses:
    MailRekeyAccepted:
      description: Durable fenced mail payload-key rotation accepted
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailRekeyResponse'
    MailRekeyStatusOK:
      description: Safe typed mail rekey progress and final retirement proof
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailRekeyStatusResponse'
  schemas:
    MailRekeyRequest:
      description: Exact retiring-key selection for a new fenced rotation Job.
      type: object
      additionalProperties: false
      required:
        - retiring_key_id
      properties:
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          description: Non-secret identifier of the configured key to retire; it must not be the primary key.
    MailRekeyResponse:
      description: Durable identities created when the rotation Job is accepted.
      type: object
      additionalProperties: false
      required:
        - job_id
        - primary_key_id
        - retiring_key_id
        - created_at
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        created_at:
          type: integer
          format: int64
          description: Unix time in milliseconds when the rekey Job was created.
    MailRekeyProgress:
      description: Coarse bounded progress while active payloads are being re-encrypted.
      type: object
      additionalProperties: false
      required:
        - current
        - total
        - stage
      properties:
        current:
          type: integer
          format: int64
          minimum: 0
          description: Active payloads processed so far.
        total:
          type: integer
          format: int64
          minimum: 1
          description: Active payloads in the fenced processing set.
        stage:
          type: string
          enum:
            - reencrypting
    MailRekeyProof:
      description: Final reference counts used to decide whether the retiring key may be removed.
      type: object
      additionalProperties: false
      required:
        - non_primary_references
        - retiring_references
        - retirement_safe
      properties:
        non_primary_references:
          type: integer
          format: int64
          minimum: 0
          description: Active payload references to every non-primary key after processing.
        retiring_references:
          type: integer
          format: int64
          minimum: 0
          description: Active payload references still using the exact retiring key.
        retirement_safe:
          type: boolean
          description: True only when the final durable reference counts prove the retiring key can be removed.
    MailRekeyStatusResponse:
      description: Safe Job status, progress, and optional final key-retirement proof.
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
        - primary_key_id
        - retiring_key_id
        - created_at
        - updated_at
        - attempt_count
        - maximum_attempts
        - processed
        - reencrypted
      properties:
        job_id:
          $ref: '#/components/schemas/ID'
        status:
          $ref: '#/components/schemas/JobStatus'
        primary_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        retiring_key_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        completed_at:
          type: integer
          format: int64
        public_error_code:
          type: string
          maxLength: 128
        attempt_count:
          type: integer
          minimum: 0
        maximum_attempts:
          type: integer
          minimum: 1
        processed:
          type: integer
          format: int64
          minimum: 0
        reencrypted:
          type: integer
          format: int64
          minimum: 0
        progress:
          $ref: '#/components/schemas/MailRekeyProgress'
        proof:
          $ref: '#/components/schemas/MailRekeyProof'
