paths:
  /api/v1/mail/deliveries:
    get:
      operationId: listMailDeliveries
      summary: List safe mail delivery metadata
      tags:
        - Mail
      description: >-
        Lists authorized durable delivery metadata for the allowlisted template and filters. Recipient addresses remain masked and the response never exposes encrypted payloads, rendered message bodies, SMTP credentials, or provider diagnostics.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - mail.query.invalid
        - mail.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of delivery projections to return.
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque continuation emitted by the preceding page for the same filters.
        - name: state
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MailDeliveryState'
          description: Optional set of durable delivery states to include.
        - name: template_key
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - system.mail_test
          description: Optional set of public allowlisted template keys to include.
        - name: created_after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Include deliveries created at or after this Unix-millisecond timestamp.
        - name: created_before
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Include deliveries created before this Unix-millisecond timestamp.
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryListOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/mail/deliveries/{mail_delivery_id}:
    parameters:
      - name: mail_delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The durable mail delivery to retrieve.
    get:
      operationId: getMailDelivery
      summary: Get one safe mail delivery status
      tags:
        - Mail
      description: >-
        Returns safe lifecycle metadata for one authorized durable delivery. The projection keeps the recipient masked and omits payload ciphertext, plaintext message content, SMTP response detail, and encryption-key material.
      x-proctor-auth: principal_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - request.invalid
        - resource.not_found
        - mail.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/mail/deliveries/{mail_delivery_id}/cancel:
    parameters:
      - name: mail_delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The queued mail delivery to cancel.
    post:
      operationId: cancelMailDelivery
      summary: Cancel queued mail delivery work
      tags:
        - Mail
      description: >-
        Cancels one exact authorized delivery only while it is still queued and prevents a worker from beginning that occurrence. The transition retains delivery history and audit provenance and never deletes the encrypted payload record as a side effect.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/mail/deliveries/<mail-delivery-id>/cancel' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - mail.conflict
        - mail.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
  /api/v1/mail/deliveries/{mail_delivery_id}/retry:
    parameters:
      - name: mail_delivery_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ID'
        description: The failed durable mail delivery to retry.
    post:
      operationId: retryMailDelivery
      summary: Retry a still-relevant failed mail delivery
      tags:
        - Mail
      description: >-
        Requeues an authorized failed delivery only when its message is still relevant and its bounded retry policy permits another Attempt. Prior Attempt and failure metadata remain durable, and a terminally stale or ineligible delivery fails without sending.
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url 'https://proctor.example.edu/api/v1/mail/deliveries/<mail-delivery-id>/retry' \
              --header 'Authorization: Bearer <interactive-session-access-token>' \
              --header 'X-Proctor-CSRF-Token: <session-csrf-token>'
      x-proctor-auth: recent_session_required
      x-proctor-error-codes:
        - authentication.required
        - authentication.invalid_token
        - authentication.credential_ambiguous
        - authorization.denied
        - authorization.request.invalid
        - authorization.unavailable
        - authentication.csrf.invalid
        - audit.unavailable
        - authentication.reauthentication_required
        - request.invalid
        - resource.not_found
        - mail.conflict
        - mail.unavailable
      x-proctor-idempotency: none
      security:
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          $ref: '#/components/responses/MailDeliveryOK'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
components:
  responses:
    MailDeliveryOK:
      description: Safe durable mail delivery status
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailDeliveryResponse'
    MailDeliveryListOK:
      description: Bounded safe mail delivery collection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MailDeliveryListResponse'
  schemas:
    MailDeliveryListResponse:
      description: One bounded page of safe mail delivery projections.
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailDeliveryResponse'
        next_cursor:
          type: string
          description: Opaque continuation for the next page, omitted after the final page.
