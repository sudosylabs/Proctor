components:
  schemas:
    MailDeliveryState:
      description: Durable lifecycle state of one mail delivery occurrence.
      type: string
      enum:
        - queued
        - sending
        - accepted
        - failed
        - suppressed
        - canceled
    MailDeliveryResponse:
      description: Safe durable mail delivery metadata with the recipient masked and content omitted.
      type: object
      additionalProperties: false
      required:
        - id
        - occurrence_id
        - target_user_id
        - template_key
        - template_digest
        - masked_recipient
        - state
        - created_at
        - updated_at
        - message_date
        - deadline
        - message_id
        - attempt_count
      properties:
        id:
          $ref: '#/components/schemas/ID'
        occurrence_id:
          $ref: '#/components/schemas/ID'
        target_user_id:
          $ref: '#/components/schemas/ID'
        template_key:
          type: string
          enum:
            - system.mail_test
        template_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 digest of the exact rendered template revision, encoded as lowercase hexadecimal.
        masked_recipient:
          type: string
          maxLength: 254
          description: Redacted recipient address suitable for bounded administrative display.
        state:
          $ref: '#/components/schemas/MailDeliveryState'
        created_at:
          type: string
          format: date-time
          description: Time when the delivery was created.
        updated_at:
          type: string
          format: date-time
          description: Time of the latest durable state change.
        message_date:
          type: string
          format: date-time
          description: Time represented by the message Date header.
        deadline:
          type: string
          format: date-time
          description: Time after which the message is no longer relevant for delivery.
        message_id:
          type: string
          maxLength: 900
          description: Safe retained Message-ID for delivery correlation, not a credential.
        attempt_count:
          type: integer
          minimum: 0
          maximum: 8
        accepted_at:
          type: string
          format: date-time
          description: Time when SMTP accepted the message.
        failed_at:
          type: string
          format: date-time
          description: Time when the delivery became terminally failed.
        public_failure_code:
          type: string
          maxLength: 128
          description: Stable safe failure category; raw SMTP or infrastructure errors are never exposed.
