name: proctor-server-test

services:
  postgres:
    image: ${PROCTOR_POSTGRES_IMAGE:-postgres:16.6-alpine3.20}
    environment:
      POSTGRES_DB: proctor
      POSTGRES_USER: proctor
      POSTGRES_PASSWORD: proctor
    ports:
      - "127.0.0.1:${PROCTOR_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctor -d proctor"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"
    user: "70:70"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=0770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  redis:
    image: ${PROCTOR_REDIS_IMAGE:-redis:7.2.15-alpine3.21}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:${PROCTOR_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"
    user: redis
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  minio:
    image: ${PROCTOR_MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: proctorminio
      MINIO_ROOT_PASSWORD: proctorminio-secret
    ports:
      - "127.0.0.1:${PROCTOR_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"
    user: "1000:1000"
    tmpfs:
      - /data:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
