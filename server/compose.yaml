name: proctor-server-test

services:
  postgres:
    image: ${PROCTOR_POSTGRES_IMAGE:-postgres:16.6-alpine3.20@sha256:1e59919c179e296eaf3cc701f4d50bab5c393d7ed9746c188c9d519489c998dc}
    environment:
      POSTGRES_DB: proctor
      POSTGRES_USER: proctor
      POSTGRES_PASSWORD: proctor
    ports:
      - "127.0.0.1:${PROCTOR_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctor -d proctor"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"
    user: "70:70"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=1g,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=0770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  redis:
    image: ${PROCTOR_REDIS_IMAGE:-redis:7.2.15-alpine3.21@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --loglevel
      - warning
    ports:
      - "127.0.0.1:${PROCTOR_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"
    user: redis
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  minio:
    image: ${PROCTOR_MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: proctorminio
      MINIO_ROOT_PASSWORD: proctorminio-secret
    ports:
      - "127.0.0.1:${PROCTOR_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"
    user: "1000:1000"
    tmpfs:
      - /data:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_MAX_MESSAGE_SIZE: "30"
      MP_QUIET: "true"
    ports:
      - "127.0.0.1:${PROCTOR_MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${PROCTOR_MAILPIT_HTTP_PORT:-18025}:8025"
    restart: "no"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
