name: proctor-server-test

services:
  postgres:
    image: ${PROCTOR_POSTGRES_IMAGE:-postgres:16.6-alpine3.20}
    environment:
      POSTGRES_DB: proctor
      POSTGRES_USER: proctor
      POSTGRES_PASSWORD: proctor
    ports:
      - "127.0.0.1:${PROCTOR_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctor -d proctor"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s
    restart: "no"
    user: "70:70"
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m,uid=70,gid=70,mode=0700
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=0770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
