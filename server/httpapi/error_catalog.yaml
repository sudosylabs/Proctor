# Public error code catalog: the single source of truth for every code Proctor
# presents, with its HTTP status and meaning. `go run ./cmd/ptool errors generate`
# renders error_mapping.go from it, and `go run ./cmd/ptool errors check` fails
# when source mints a code missing here or a listed code is never minted.
#
# A code is <domain>[.<subdomain>].<condition>: lowercase dot-separated
# segments, each snake_case. The condition is the last segment; a qualifier
# precedes its vocabulary word, as in revision_conflict or content_invalid.
# The HTTP status is a function of the condition: a condition equal to, or
# ending in _<word> for, a word below takes that status, and any other
# condition names a resource state that rejects the request (409). An entry
# states `status` only for a documented exception, with its `reason`.
#
# transport: the HTTP or WebSocket transport may mint the code; every other
#            code is minted only by the application.
# problem:   the HTTP kernel writes the code directly as Problem Details.
conditions:
  invalid: 400
  denied: 403
  disabled: 403
  not_found: 404
  conflict: 409
  expired: 410
  rate_limited: 429
  internal: 500
  unavailable: 503
  busy: 503
default_status: 409
