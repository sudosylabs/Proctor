<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Proctor academic structure ownership and period applicability</title>
  <desc id="description">One Institution contains a hierarchy of Academic Units. An Academic Unit may contain child units and owns Programmes; each Programme owns Programme Levels; each Class belongs to one Programme Level. Academic Periods are owned by the Institution or one Academic Unit, and each Class names exactly one period applicable to its Programme's Academic Unit.</desc>
  <defs>
    <marker id="arrow-cobalt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3657d6"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a65c16"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="718" rx="17" fill="none" stroke="#dfe3eb" stroke-width="2"/>

  <text x="48" y="52" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="2.1">ACADEMIC STRUCTURE MAP</text>
  <text x="48" y="84" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Ownership flows downward. Period applicability crosses the tree only through explicit rules.</text>

  <rect x="48" y="120" width="720" height="548" rx="14" fill="#f7f8fb" stroke="#dfe3eb" stroke-width="2"/>
  <text x="72" y="151" fill="#2945b8" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">OWNERSHIP TREE</text>
  <text x="72" y="170" fill="#5f6b80" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Every child has one owning parent; Academic Units alone may recurse.</text>

  <rect x="252" y="188" width="312" height="60" rx="12" fill="#3657d6" stroke="#2945b8" stroke-width="2"/>
  <text x="408" y="214" text-anchor="middle" fill="#ffffff" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="800">Institution</text>
  <text x="408" y="235" text-anchor="middle" fill="#eef1ff" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">exactly one per installation</text>

  <rect x="210" y="284" width="396" height="72" rx="12" fill="#eef1ff" stroke="#3657d6" stroke-width="2"/>
  <text x="234" y="313" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">Academic Unit</text>
  <text x="234" y="336" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">generic hierarchy node · owns children and Programmes</text>

  <rect x="80" y="406" width="260" height="72" rx="12" fill="#ffffff" stroke="#3657d6" stroke-width="2"/>
  <text x="104" y="435" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="750">Child Academic Unit</text>
  <text x="104" y="457" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">the same hierarchy rules repeat</text>

  <rect x="430" y="406" width="260" height="72" rx="12" fill="#ffffff" stroke="#3657d6" stroke-width="2"/>
  <text x="454" y="435" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="750">Programme</text>
  <text x="454" y="457" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">owned by one Academic Unit</text>

  <rect x="430" y="518" width="260" height="64" rx="12" fill="#ffffff" stroke="#3657d6" stroke-width="2"/>
  <text x="454" y="545" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="750">Programme Level</text>
  <text x="454" y="566" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">reusable curriculum stage</text>

  <rect x="430" y="610" width="260" height="42" rx="12" fill="#ffffff" stroke="#3657d6" stroke-width="2"/>
  <text x="454" y="636" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Class</text>
  <text x="510" y="636" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">concrete student roster</text>

  <path d="M 408 248 V 284" fill="none" stroke="#3657d6" stroke-width="2.5" marker-end="url(#arrow-cobalt)"/>
  <path d="M 408 356 V 382 M 210 382 H 560" fill="none" stroke="#3657d6" stroke-width="2.5"/>
  <circle cx="408" cy="382" r="4" fill="#3657d6"/>
  <path d="M 210 382 V 406" fill="none" stroke="#3657d6" stroke-width="2.5" marker-end="url(#arrow-cobalt)"/>
  <path d="M 560 382 V 406" fill="none" stroke="#3657d6" stroke-width="2.5" marker-end="url(#arrow-cobalt)"/>
  <path d="M 560 478 V 518" fill="none" stroke="#3657d6" stroke-width="2.5" marker-end="url(#arrow-cobalt)"/>
  <path d="M 560 582 V 610" fill="none" stroke="#3657d6" stroke-width="2.5" marker-end="url(#arrow-cobalt)"/>

  <rect x="792" y="120" width="360" height="548" rx="14" fill="#fff8ef" stroke="#d9a66b" stroke-width="2"/>
  <text x="818" y="151" fill="#a65c16" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">PERIOD APPLICABILITY</text>
  <text x="818" y="170" fill="#5f6b80" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Ownership defines where an Academic Period may apply.</text>

  <rect x="818" y="188" width="308" height="72" rx="12" fill="#ffffff" stroke="#a65c16" stroke-width="2"/>
  <text x="842" y="217" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">Academic Period</text>
  <text x="842" y="240" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">durable enrollment window · dates may overlap</text>

  <rect x="818" y="302" width="146" height="76" rx="11" fill="#ffffff" stroke="#a65c16"/>
  <text x="891" y="330" text-anchor="middle" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="750">Institution-owned</text>
  <text x="891" y="351" text-anchor="middle" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">applies to every unit</text>

  <rect x="980" y="302" width="146" height="76" rx="11" fill="#ffffff" stroke="#a65c16"/>
  <text x="1053" y="330" text-anchor="middle" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="750">Unit-owned</text>
  <text x="1053" y="351" text-anchor="middle" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">owner + descendants</text>

  <rect x="818" y="430" width="308" height="108" rx="12" fill="#ffffff" stroke="#a65c16" stroke-width="2"/>
  <text x="842" y="459" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Resolve applicability</text>
  <text x="842" y="483" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">against the Programme's Academic Unit</text>
  <rect x="842" y="500" width="260" height="24" rx="12" fill="#fff3e5"/>
  <text x="972" y="516" text-anchor="middle" fill="#a65c16" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="9" font-weight="750">NO INFERRED GLOBAL CURRENT PERIOD</text>

  <rect x="818" y="572" width="308" height="80" rx="12" fill="#fff3e5" stroke="#a65c16" stroke-width="2"/>
  <text x="842" y="594" fill="#a65c16" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="10" font-weight="800">EXPLICIT CLASS LINK</text>
  <text x="842" y="618" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">Exactly one applicable</text>
  <text x="842" y="640" fill="#172033" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">Academic Period, named explicitly</text>

  <path d="M 972 260 V 278 M 891 278 H 1053" fill="none" stroke="#a65c16" stroke-width="2.5"/>
  <circle cx="972" cy="278" r="4" fill="#a65c16"/>
  <path d="M 891 278 V 302" fill="none" stroke="#a65c16" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M 1053 278 V 302" fill="none" stroke="#a65c16" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M 891 378 V 404 M 1053 378 V 404 M 891 404 H 1053 M 972 404 V 430" fill="none" stroke="#a65c16" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <circle cx="972" cy="404" r="4" fill="#a65c16"/>
  <path d="M 972 538 V 572" fill="none" stroke="#a65c16" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <path d="M 690 631 H 818" fill="none" stroke="#a65c16" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>

  <path d="M 48 686 H 1152" stroke="#dfe3eb"/>
  <circle cx="61" cy="703" r="5" fill="#a65c16"/>
  <text x="76" y="707" fill="#4c586f" font-family="Avenir Next, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Periods organize enrollment. Membership records relationships. Roles and scoped bindings grant permission.</text>
</svg>
