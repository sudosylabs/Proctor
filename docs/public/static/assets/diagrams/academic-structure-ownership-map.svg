<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Academic structure ownership and Period reference</title>
  <desc id="description">One Institution owns Academic Units. An Academic Unit owns Programmes, each Programme owns Programme Levels, and each Programme Level owns Classes. Academic Units may recursively own child Academic Units. Every Class explicitly names exactly one applicable Academic Period owned by the Institution or an Academic Unit.</desc>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 H 0 V 8" fill="none" stroke="#f4f1f6" stroke-width="1"/>
    </pattern>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#5c00aa"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="url(#grid)" stroke="#e1dce5" stroke-width="2"/>

  <text x="56" y="96" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">SINGULAR OWNERSHIP</text>

  <rect x="56" y="144" width="184" height="112" rx="16" fill="#ffffff" stroke="#c8c0ce" stroke-width="2"/>
  <text x="80" y="188" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Institution</text>
  <text x="80" y="220" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">one per Installation</text>

  <path d="M 240 200 H 280" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="260" y="180" text-anchor="middle" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">OWNS</text>

  <rect x="280" y="144" width="200" height="112" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="304" y="188" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Academic Unit</text>
  <text x="304" y="220" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">hierarchy node</text>

  <path d="M 480 200 H 520" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="500" y="180" text-anchor="middle" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">OWNS</text>

  <rect x="520" y="144" width="184" height="112" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="544" y="188" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Programme</text>
  <text x="544" y="220" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">one owning Unit</text>

  <path d="M 704 200 H 744" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="724" y="180" text-anchor="middle" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">OWNS</text>

  <rect x="744" y="144" width="184" height="112" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="768" y="188" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Programme Level</text>
  <text x="768" y="220" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">curriculum stage</text>

  <path d="M 928 200 H 968" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="948" y="180" text-anchor="middle" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">OWNS</text>

  <rect x="968" y="144" width="176" height="112" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="992" y="188" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Class</text>
  <text x="992" y="220" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">concrete roster</text>

  <path d="M 380 256 V 344" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="396" y="304" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">MAY OWN</text>
  <rect x="280" y="344" width="200" height="112" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="304" y="384" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Child Academic</text>
  <text x="304" y="408" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Unit</text>
  <text x="304" y="440" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">the same rules recurse</text>

  <path d="M 1056 256 V 360" fill="none" stroke="#5c00aa" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-primary)"/>
  <text x="1032" y="312" text-anchor="end" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">NAMES EXACTLY ONE</text>
  <rect x="848" y="360" width="296" height="152" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="872" y="404" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Academic Period</text>
  <text x="872" y="436" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Institution- or Academic-Unit-owned</text>
  <text x="872" y="464" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">applicable through owning scope</text>
  <text x="872" y="492" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">NEVER INFER A GLOBAL CURRENT PERIOD</text>

  <path d="M 56 584 V 600 H 1144 V 584" fill="none" stroke="#655f69" stroke-width="1"/>
  <text x="600" y="632" text-anchor="middle" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Ownership has one parent. Period applicability is an explicit Class reference.</text>
</svg>
