<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Protected request proof and permission</title>
  <desc id="description">One presented credential passes through a transport proof gate to establish an immutable principal. That principal carries identity and assurance but no permission snapshot. The owning use case combines the principal with an action and exact resource, reads current PostgreSQL authority, and durably records an allow or deny decision.</desc>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 H 0 V 8" fill="none" stroke="#f4f1f6" stroke-width="1"/>
    </pattern>
    <marker id="arrow-neutral" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#655f69"/>
    </marker>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#5c00aa"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="url(#grid)" stroke="#e1dce5" stroke-width="2"/>

  <rect x="56" y="96" width="248" height="200" rx="16" fill="#ffffff" stroke="#c8c0ce" stroke-width="2"/>
  <text x="80" y="136" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Presented credential</text>
  <text x="80" y="160" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">EXACTLY ONE SOURCE</text>
  <path d="M 80 184 H 280" fill="none" stroke="#e1dce5" stroke-width="1"/>
  <text x="80" y="216" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Browser Session cookie</text>
  <text x="80" y="248" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Session access bearer</text>
  <text x="80" y="280" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Personal Access Token</text>

  <path d="M 304 196 H 352" fill="none" stroke="#655f69" stroke-width="2" marker-end="url(#arrow-neutral)"/>

  <rect x="352" y="72" width="328" height="248" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="376" y="112" fill="#470082" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Transport proof</text>
  <text x="376" y="136" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Match the route requirement</text>

  <circle cx="392" cy="176" r="16" fill="#5c00aa"/>
  <text x="392" y="181" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">1</text>
  <text x="424" y="181" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Validate source and credential</text>

  <circle cx="392" cy="224" r="16" fill="#5c00aa"/>
  <text x="392" y="229" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">2</text>
  <text x="424" y="221" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Check CSRF for unsafe cookie use</text>
  <text x="424" y="245" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">No source precedence fallback</text>

  <circle cx="392" cy="280" r="16" fill="#5c00aa"/>
  <text x="392" y="285" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">3</text>
  <text x="424" y="285" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Enforce strength and recency</text>

  <path d="M 680 196 H 728" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>

  <rect x="728" y="96" width="416" height="200" rx="16" fill="#5c00aa" stroke="#470082" stroke-width="2"/>
  <text x="752" y="136" fill="#ffffff" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Immutable principal</text>
  <text x="752" y="168" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">IDENTITY</text>
  <text x="904" y="168" fill="#ffffff" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">who is asking</text>
  <text x="752" y="200" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">CREDENTIAL</text>
  <text x="904" y="200" fill="#ffffff" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">how they proved it</text>
  <text x="752" y="232" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">ASSURANCE</text>
  <text x="904" y="232" fill="#ffffff" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">strength and auth time</text>
  <path d="M 752 248 H 1120" fill="none" stroke="#ffffff" stroke-width="1"/>
  <text x="936" y="274" text-anchor="middle" fill="#ffffff" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">NO ROLE · PERMISSION · MEMBERSHIP SNAPSHOT</text>

  <path d="M 936 296 V 352" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <rect x="56" y="352" width="1088" height="64" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="600" y="392" text-anchor="middle" fill="#470082" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Identity + assurance is not permission</text>

  <path d="M 936 416 V 448 H 192 V 480" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <rect x="56" y="480" width="272" height="136" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="80" y="520" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Owning use case</text>
  <text x="80" y="552" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">PRINCIPAL + ACTION</text>
  <text x="80" y="580" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">+ EXACT RESOURCE</text>

  <path d="M 328 548 H 400" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <rect x="400" y="480" width="344" height="136" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="424" y="520" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Current PostgreSQL authority</text>
  <text x="424" y="552" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Roles, bindings, scope, relationships</text>
  <text x="424" y="580" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">READ AGAIN FOR THIS DECISION</text>

  <path d="M 744 548 H 816" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <rect x="816" y="456" width="328" height="160" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="840" y="496" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Durable decision</text>
  <text x="840" y="520" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Audit before returning</text>
  <rect x="840" y="544" width="128" height="48" rx="6" fill="#e7f5f1" stroke="#0b766e" stroke-width="2"/>
  <text x="904" y="574" text-anchor="middle" fill="#0b766e" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">ALLOW</text>
  <rect x="984" y="544" width="136" height="48" rx="6" fill="#fff0f1" stroke="#b4233c" stroke-width="2"/>
  <text x="1052" y="574" text-anchor="middle" fill="#b4233c" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">DENY / STOP</text>

  <path d="M 56 624 V 640 H 1144 V 624" fill="none" stroke="#655f69" stroke-width="1"/>
  <text x="600" y="660" text-anchor="middle" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Proof establishes a principal. Current authority decides permission.</text>
</svg>
