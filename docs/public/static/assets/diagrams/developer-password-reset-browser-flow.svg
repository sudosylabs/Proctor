<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Password-reset browser flow</title>
  <desc id="description">A password-reset credential arrives in the URL fragment. The root removes the complete fragment before parsing exactly one purpose-specific token. The ready form never renders or stores the token, and posts only the token and password while confirmation stays in the browser. A feature action maps the exact 204 response and bounded public errors to complete, unusable, or retryable states with different clearing, focus, and recovery behavior.</desc>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 H 0 V 8" fill="none" stroke="#f4f1f6" stroke-width="1"/>
    </pattern>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#5c00aa"/>
    </marker>
    <marker id="arrow-complete" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#0b766e"/>
    </marker>
    <marker id="arrow-attention" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#95520d"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#b4233c"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="url(#grid)" stroke="#e1dce5" stroke-width="2"/>

  <text x="56" y="72" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">BOOTSTRAP + SUBMISSION</text>

  <rect x="56" y="88" width="240" height="144" rx="16" fill="#ffffff" stroke="#c8c0ce" stroke-width="2"/>
  <text x="80" y="128" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Browser URL</text>
  <rect x="80" y="144" width="192" height="32" rx="6" fill="#f7f5f9" stroke="#c8c0ce" stroke-width="1"/>
  <text x="92" y="165" fill="#49434f" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">…/reset#token=••••</text>
  <text x="80" y="208" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">SENSITIVE FRAGMENT</text>

  <path d="M 296 160 H 320" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>

  <rect x="320" y="88" width="240" height="144" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="344" y="128" fill="#470082" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Root sanitizer</text>
  <text x="344" y="160" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Remove fragment first</text>
  <text x="344" y="184" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Parse exactly one value</text>
  <text x="344" y="208" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">REPLACE HISTORY</text>

  <path d="M 560 160 H 584" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>

  <rect x="584" y="88" width="240" height="144" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="608" y="128" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Ready form</text>
  <text x="608" y="160" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Purpose-typed token</text>
  <text x="608" y="184" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Never rendered or stored</text>
  <text x="608" y="208" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">LOCAL STATE</text>

  <path d="M 824 160 H 848" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>

  <rect x="848" y="88" width="296" height="144" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="872" y="128" fill="#470082" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">POST completion</text>
  <text x="872" y="160" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Send token + password</text>
  <text x="872" y="184" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Keep confirmation local</text>
  <text x="872" y="208" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">SAME ORIGIN · CSRF</text>

  <path d="M 996 232 V 272 H 600 V 304" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <circle cx="996" cy="272" r="5" fill="#5c00aa"/>

  <rect x="432" y="304" width="336" height="120" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="456" y="344" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Feature result mapper</text>
  <text x="456" y="376" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Exact 204 + allowlisted public errors</text>
  <text x="456" y="400" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">SMALL SEMANTIC UNION</text>

  <path d="M 600 424 V 480" fill="none" stroke="#655f69" stroke-width="2"/>
  <circle cx="600" cy="480" r="5" fill="#655f69"/>
  <path d="M 600 480 H 224 V 520" fill="none" stroke="#0b766e" stroke-width="3" marker-end="url(#arrow-complete)"/>
  <path d="M 600 480 V 520" fill="none" stroke="#b4233c" stroke-width="3" marker-end="url(#arrow-failure)"/>
  <path d="M 600 480 H 976 V 520" fill="none" stroke="#95520d" stroke-width="3" marker-end="url(#arrow-attention)"/>

  <rect x="56" y="520" width="336" height="136" rx="16" fill="#e7f5f1" stroke="#0b766e" stroke-width="2"/>
  <text x="80" y="560" fill="#0b766e" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Complete</text>
  <text x="80" y="592" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Clear token + fields</text>
  <text x="80" y="616" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Replace task · focus heading</text>
  <text x="80" y="640" fill="#0b766e" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">TERMINAL SUCCESS</text>

  <rect x="432" y="520" width="336" height="136" rx="16" fill="#fff0f1" stroke="#b4233c" stroke-width="2"/>
  <text x="456" y="560" fill="#b4233c" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Unusable credential</text>
  <text x="456" y="592" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Clear token + fields</text>
  <text x="456" y="616" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Show one safe recovery path</text>
  <text x="456" y="640" fill="#b4233c" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">TERMINAL FAILURE</text>

  <rect x="808" y="520" width="336" height="136" rx="16" fill="#fff3e5" stroke="#95520d" stroke-width="2"/>
  <text x="832" y="560" fill="#95520d" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Retryable failure</text>
  <text x="832" y="592" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Preserve safe inputs</text>
  <text x="832" y="616" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Keep feedback beside action</text>
  <text x="832" y="640" fill="#95520d" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">RECOVERABLE</text>

  <text x="600" y="696" text-anchor="middle" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Each outcome changes only the state, focus, and secret lifetime it actually owns.</text>
</svg>
