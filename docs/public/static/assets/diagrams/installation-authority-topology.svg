<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Proctor installation commit order</title>
  <desc id="description">Client requests enter one or more identical Proctor nodes. Those nodes commit application state to PostgreSQL and managed content through VFS before publishing reconstructible effects to Redis, realtime clients, execution hosts, or mail delivery.</desc>
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 H 0 V 8" fill="none" stroke="#f4f1f6" stroke-width="1"/>
    </pattern>
    <marker id="arrow-neutral" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#655f69"/>
    </marker>
    <marker id="arrow-primary" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#5c00aa"/>
    </marker>
    <marker id="arrow-transient" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#0b766e"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="718" rx="15" fill="url(#grid)" stroke="#e1dce5" stroke-width="2"/>

  <rect x="56" y="208" width="176" height="152" rx="16" fill="#ffffff" stroke="#c8c0ce" stroke-width="2"/>
  <text x="80" y="248" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Client requests</text>
  <text x="80" y="280" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Operator</text>
  <text x="80" y="312" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Administrator</text>
  <text x="80" y="344" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Candidate</text>

  <path d="M 232 284 H 280" fill="none" stroke="#655f69" stroke-width="2" marker-end="url(#arrow-neutral)"/>

  <rect x="280" y="128" width="264" height="312" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="304" y="168" fill="#470082" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Proctor nodes</text>
  <text x="304" y="192" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">1 … n identical application nodes</text>

  <rect x="304" y="216" width="216" height="64" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="412" y="254" text-anchor="middle" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Load balancer</text>
  <path d="M 412 280 V 296 H 352 V 312 M 412 296 H 472 V 312" fill="none" stroke="#5c00aa" stroke-width="2"/>

  <rect x="304" y="312" width="96" height="80" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="352" y="346" text-anchor="middle" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Node 1</text>
  <text x="352" y="370" text-anchor="middle" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">same rules</text>

  <rect x="424" y="312" width="96" height="80" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="472" y="346" text-anchor="middle" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Node n</text>
  <text x="472" y="370" text-anchor="middle" fill="#655f69" font-family="IBM Plex Mono, Consolas, monospace" font-size="12">same rules</text>

  <path d="M 544 284 H 592" fill="none" stroke="#5c00aa" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <text x="568" y="264" text-anchor="middle" fill="#470082" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" font-weight="600">COMMIT</text>

  <rect x="592" y="128" width="264" height="312" rx="16" fill="#ffffff" stroke="#5c00aa" stroke-width="2"/>
  <text x="616" y="168" fill="#470082" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Durable authority</text>
  <text x="616" y="192" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">The recovery source</text>

  <rect x="616" y="216" width="216" height="80" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="640" y="250" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">PostgreSQL</text>
  <text x="640" y="274" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Application state</text>

  <rect x="616" y="320" width="216" height="80" rx="16" fill="#f3eafb" stroke="#5c00aa" stroke-width="2"/>
  <text x="640" y="354" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">VFS</text>
  <text x="640" y="378" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Managed content</text>

  <path d="M 856 284 H 912" fill="none" stroke="#0b766e" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-transient)"/>

  <rect x="912" y="96" width="232" height="376" rx="16" fill="#e7f5f1" stroke="#0b766e" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="936" y="136" fill="#0b766e" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Transient effects</text>
  <text x="936" y="160" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Only after durable commit</text>

  <rect x="936" y="192" width="184" height="48" rx="16" fill="#ffffff" stroke="#0b766e" stroke-width="2"/>
  <text x="960" y="222" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Redis</text>
  <rect x="936" y="256" width="184" height="48" rx="16" fill="#ffffff" stroke="#0b766e" stroke-width="2"/>
  <text x="960" y="286" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Realtime publication</text>
  <rect x="936" y="320" width="184" height="48" rx="16" fill="#ffffff" stroke="#0b766e" stroke-width="2"/>
  <text x="960" y="350" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Execution hosts</text>
  <rect x="936" y="384" width="184" height="48" rx="16" fill="#ffffff" stroke="#0b766e" stroke-width="2"/>
  <text x="960" y="414" fill="#161616" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Mail delivery</text>

  <path d="M 56 584 V 600 H 1144 V 584" fill="none" stroke="#655f69" stroke-width="1"/>
  <text x="600" y="632" text-anchor="middle" fill="#49434f" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="14">Node count changes capacity—not authority, commit order, or recovery semantics.</text>
</svg>
