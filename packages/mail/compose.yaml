name: proctor-mail-test

services:
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109}
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "100"
      MP_MAX_MESSAGE_SIZE: "30"
      MP_QUIET: "true"
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAIL_HTTP_PORT:-18025}:8025"
    restart: "no"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
