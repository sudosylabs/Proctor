name: proctor

services:
  proctor:
    image: ${PROCTOR_IMAGE_REF:?set PROCTOR_IMAGE_REF to an immutable tag-and-digest image reference}
    env_file:
      - path: ./proctor.env
        required: false
    ports:
      - ${PROCTOR_BIND_ADDRESS:-127.0.0.1}:${PROCTOR_HTTP_PORT:-8065}:8065
      - ${PROCTOR_METRICS_BIND_ADDRESS:-127.0.0.1}:${PROCTOR_METRICS_PORT:-8067}:8067
      - ${PROCTOR_CLUSTER_BIND_ADDRESS:-127.0.0.1}:${PROCTOR_CLUSTER_PORT:-7946}:7946/tcp
      - ${PROCTOR_CLUSTER_BIND_ADDRESS:-127.0.0.1}:${PROCTOR_CLUSTER_PORT:-7946}:7946/udp
    volumes:
      - ${PROCTOR_CONFIG_PATH:-./config.json}:/etc/proctor/config.json:ro
      - ${PROCTOR_DATA_PATH:-./data}:/var/lib/proctor
      - ${PROCTOR_LOG_PATH:-./logs}:/var/log/proctor
      - ${PROCTOR_SECRET_PATH:-./secrets}:/run/secrets/proctor:ro
    healthcheck:
      test: [CMD, /opt/proctor/proctor-healthcheck]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 90s
    restart: unless-stopped
    user: 65532:65532
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
