global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-keep-alive
    timeout connect 5s
    timeout client  10m
    timeout server  10m
    timeout tunnel  1h
    timeout http-request 15s

frontend proctor_public
    bind :8065
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request add-header X-Forwarded-For %[src]
    default_backend proctor_nodes

backend proctor_nodes
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    http-response set-header X-Proctor-Node %[srv_name]
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server node-a node-a:8065 check
    server node-b node-b:8065 check
    server node-c node-c:8065 check
