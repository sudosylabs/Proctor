services:
  prometheus:
    image: ${PROCTOR_PROMETHEUS_IMAGE:-prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996}
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - 127.0.0.1:${PROCTOR_PROMETHEUS_PORT:-19090}:9090
    volumes:
      - ../observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - ../../.build/dev/observability/${PROCTOR_PROMETHEUS_TARGETS_FILE:-single-node-targets.json}:/etc/prometheus/targets/targets.json:ro
      - ../../.build/dev/secrets/metrics-token:/run/secrets/proctor-metrics-token:ro
      - ../../.build/dev/secrets/metrics-certificate.pem:/run/secrets/proctor-metrics-ca.pem:ro
      - ../../.build/dev/prometheus:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, wget, --spider, --quiet, "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    restart: unless-stopped
    user: ${PROCTOR_UID:-1000}:${PROCTOR_GID:-1000}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proctor-dev

  grafana:
    image: ${PROCTOR_GRAFANA_IMAGE:-grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d}
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/proctor-overview.json
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - 127.0.0.1:${PROCTOR_GRAFANA_PORT:-13000}:3000
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    user: 472:0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proctor-dev

  loki:
    image: ${PROCTOR_LOKI_IMAGE:-grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd}
    command: [-config.file=/etc/loki/loki.yaml]
    ports:
      - 127.0.0.1:${PROCTOR_LOKI_PORT:-13100}:3100
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: [CMD, wget, --spider, --quiet, "http://127.0.0.1:3100/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proctor-dev

  otel-collector:
    image: ${PROCTOR_OTEL_IMAGE:-otel/opentelemetry-collector-contrib:0.145.0@sha256:a7343f01869071ea3f4c5e1e97df1bb1b3c4d5c77247db80e053a80b9df530c4}
    command: [--config=/etc/otelcol-contrib/config.yaml]
    ports:
      - 127.0.0.1:${PROCTOR_OTEL_HEALTH_PORT:-13133}:13133
    volumes:
      - ../observability/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ../../.build/dev/logs:/var/log/proctor:ro
      - ../../.build/dev/otel:/var/lib/otel
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    user: ${PROCTOR_UID:-1000}:${PROCTOR_GID:-1000}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proctor-dev

volumes:
  grafana-data:
  loki-data:
